<meta charset="UTF-8" />

<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
<script type="text/babel">
const { useState, useMemo, useCallback, useRef, useEffect } = React;

// ─── Constants ────────────────────────────────────────────────────────────────
const PALETTE = ["#16a34a","#2563eb","#dc2626","#d97706","#7c3aed","#db2777","#0891b2","#65a30d","#c2410c","#0f766e"];
const EMPTY   = { competitors: [], unit: "lbs" };
const LS_KEY  = "wl-current";

// ─── Utilities ────────────────────────────────────────────────────────────────
const uid     = () => Math.random().toString(36).slice(2, 9);
const calcPct = (start, cur) => (start - cur) / start * 100;
const fmtDate = (s) => { const [y,m,d] = s.split("-"); return new Date(y,m-1,d).toLocaleDateString("en-US",{month:"short",day:"numeric"}); };
const today   = () => new Date().toISOString().slice(0, 10);

// State is encoded in the URL hash with LZ-string AND mirrored to localStorage.
// On load: prefer URL hash (so shared links work), fall back to localStorage
// (so the organizer can return without needing the URL).
function tryDecode(compressed) {
  try {
    const json = LZString.decompressFromEncodedURIComponent(compressed);
    return json ? JSON.parse(json) : null;
  } catch { return null; }
}

function resolveInitialState() {
  const hash = window.location.hash.replace(/^#/, "");
  if (hash) {
    const state = tryDecode(hash);
    if (state) {
      try { localStorage.setItem(LS_KEY, hash); } catch {}
      return { state, hasData: true };
    }
  }
  try {
    const saved = localStorage.getItem(LS_KEY);
    if (saved) {
      const state = tryDecode(saved);
      if (state) {
        window.history.replaceState(null, "", "#" + saved);
        return { state, hasData: true };
      }
    }
  } catch {}
  return { state: null, hasData: false };
}

function encodeToUrl(state) {
  const compressed = LZString.compressToEncodedURIComponent(JSON.stringify(state));
  window.history.replaceState(null, "", "#" + compressed);
  try { localStorage.setItem(LS_KEY, compressed); } catch {}
}

function rankCompetitors(competitors) {
  return competitors
    .map(c => {
      const sorted = [...c.weighIns].sort((a,b) => a.date.localeCompare(b.date));
      const cur = sorted.length ? sorted[sorted.length-1].weight : c.startWeight;
      const pct = calcPct(c.startWeight, cur);
      return { ...c, currentWeight: cur, pctLost: pct, lostAbs: c.startWeight - cur, sortedWeighIns: sorted };
    })
    .sort((a,b) => b.pctLost - a.pctLost)
    .map((c,i) => ({ ...c, rank: i+1 }));
}

// ─── Progress Chart ────────────────────────────────────────────────────────────
function ProgressChart({ ranked, colorOf }) {
  const canvasRef = useRef(null);
  const instRef   = useRef(null);

  useEffect(() => {
    if (!canvasRef.current) return;
    if (instRef.current) { instRef.current.destroy(); instRef.current = null; }
    if (!ranked.some(c => c.sortedWeighIns.length > 0)) return;

    const allDates = [...new Set([
      ...ranked.map(c => c.startDate),
      ...ranked.flatMap(c => c.sortedWeighIns.map(w => w.date)),
    ])].sort();

    const datasets = ranked.map(c => {
      const color = colorOf(c.id);
      const dm = { [c.startDate]: c.startWeight };
      c.sortedWeighIns.forEach(w => { dm[w.date] = w.weight; });
      return {
        label: c.name,
        data: allDates.map(d => dm[d] !== undefined ? +calcPct(c.startWeight, dm[d]).toFixed(3) : null),
        borderColor: color, backgroundColor: color + "22", pointBackgroundColor: color,
        borderWidth: 2.5, pointRadius: 5, pointHoverRadius: 7, tension: 0.3, spanGaps: true, fill: false,
      };
    });

    instRef.current = new window.Chart(canvasRef.current, {
      type: "line",
      data: { labels: allDates.map(fmtDate), datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: "index", intersect: false },
        plugins: {
          legend: { position: "bottom", labels: { boxWidth: 12, padding: 16, font: { size: 13 } } },
          tooltip: { callbacks: { label: ctx => ctx.parsed.y === null ? null : ` ${ctx.dataset.label}: ${ctx.parsed.y.toFixed(2)}% lost` } },
        },
        scales: {
          x: { grid: { color: "#f1f5f9" }, ticks: { color: "#94a3b8", font: { size: 12 } } },
          y: {
            grid: { color: "#f1f5f9" },
            ticks: { color: "#94a3b8", font: { size: 12 }, callback: v => v.toFixed(1) + "%" },
            title: { display: true, text: "% Weight Lost", color: "#94a3b8", font: { size: 12 } },
          },
        },
      },
    });
    return () => { if (instRef.current) { instRef.current.destroy(); instRef.current = null; } };
  }, [ranked]);

  if (!ranked.some(c => c.sortedWeighIns.length > 0))
    return <div className="wl-empty">Log at least one weigh-in to see the chart</div>;
  return <div style={{ position:"relative", width:"100%", height:400 }}><canvas ref={canvasRef} /></div>;
}

// ─── Share Bar ────────────────────────────────────────────────────────────────
function ShareBar({ urlStamp, onNew }) {
  const [copied, setCopied] = useState(false);
  const url = window.location.href; // read at render; urlStamp re-triggers render on each save

  const copy = async () => {
    try { await navigator.clipboard.writeText(url); } catch { return; }
    setCopied(true);
    setTimeout(() => setCopied(false), 2000);
  };

  return (
    <div className="wl-share">
      <span style={{ fontSize:13 }}>🔗</span>
      <span className="wl-share-url">{url}</span>
      <button className={`wl-share-copy${copied ? " ok" : ""}`} onClick={copy}>
        {copied ? "✓ Copied" : "Copy link"}
      </button>
      <span className="wl-share-note">Copy after each update to share the latest</span>
      <button onClick={onNew} style={{ background:"none", border:"none", fontSize:12, color:"#94a3b8", cursor:"pointer", padding:0, whiteSpace:"nowrap" }}>
        New competition
      </button>
    </div>
  );
}

// ─── Main App ─────────────────────────────────────────────────────────────────
function MainApp({ initialData, onNew }) {
  const [competitors, setCompetitorsRaw] = useState(initialData.competitors || []);
  const [unit, setUnitRaw]               = useState(initialData.unit || "lbs");
  const [tab, setTab]                    = useState("rankings");
  const [urlStamp, setUrlStamp]          = useState(0); // incremented to force ShareBar re-render

  const [newName, setNewName] = useState("");
  const [newWt, setNewWt]     = useState("");
  const [newDate, setNewDate] = useState(today);
  const [wiId, setWiId]       = useState("");
  const [wiDate, setWiDate]   = useState(today);
  const [wiWt, setWiWt]       = useState("");
  const nameRef = useRef(null);

  // Use refs to avoid stale closures in save()
  const compsRef = useRef(competitors);
  const unitRef  = useRef(unit);
  compsRef.current = competitors;
  unitRef.current  = unit;

  const save = useCallback((comps, u) => {
    encodeToUrl({ competitors: comps, unit: u });
    setUrlStamp(n => n + 1);
  }, []);

  const setCompetitors = (c) => { setCompetitorsRaw(c); save(c, unitRef.current); };
  const setUnit        = (u) => { setUnitRaw(u);         save(compsRef.current, u); };

  const idOrder = useMemo(() => competitors.map(c => c.id), [competitors]);
  const colorOf = useCallback(id => PALETTE[idOrder.indexOf(id) % PALETTE.length], [idOrder]);
  const ranked  = useMemo(() => rankCompetitors(competitors), [competitors]);
  const maxPct  = useMemo(() => Math.max(0.01, ...ranked.map(c => Math.max(0, c.pctLost))), [ranked]);

  const addCompetitor = () => {
    const name = newName.trim();
    const wt = parseFloat(newWt);
    if (!name || isNaN(wt) || wt <= 0 || !newDate) return;
    if (competitors.some(c => c.name.toLowerCase() === name.toLowerCase())) return;
    setCompetitors([...competitors, { id: uid(), name, startWeight: wt, startDate: newDate, weighIns: [] }]);
    setNewName(""); setNewWt("");
    nameRef.current?.focus();
  };

  const removeCompetitor = id => {
    setCompetitors(competitors.filter(c => c.id !== id));
    if (wiId === id) setWiId("");
  };

  const logWeighIn = () => {
    const wt = parseFloat(wiWt);
    if (!wiId || isNaN(wt) || wt <= 0 || !wiDate) return;
    setCompetitors(competitors.map(c => {
      if (c.id !== wiId) return c;
      const idx = c.weighIns.findIndex(w => w.date === wiDate);
      const weighIns = idx >= 0
        ? c.weighIns.map((w, i) => i === idx ? { ...w, weight: wt } : w)
        : [...c.weighIns, { id: uid(), date: wiDate, weight: wt }];
      return { ...c, weighIns };
    }));
    setWiWt("");
  };

  const deleteWeighIn = (cId, wId) =>
    setCompetitors(competitors.map(c =>
      c.id !== cId ? c : { ...c, weighIns: c.weighIns.filter(w => w.id !== wId) }
    ));

  const preview = (() => {
    if (!wiId || !wiWt) return null;
    const c = competitors.find(x => x.id === wiId);
    const wt = parseFloat(wiWt);
    if (!c || isNaN(wt) || wt <= 0) return null;
    return { pct: calcPct(c.startWeight, wt), diff: c.startWeight - wt };
  })();

  const rankIcon = r => ["🥇","🥈","🥉"][r-1] ?? r;

  return (
    <>
      <style>{CSS}</style>
      <div className="wl">
        <div className="wl-hd">
          <a href="../../" className="wl-back">← Tools</a>
          <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", flexWrap:"wrap", gap:12 }}>
            <div>
              <h1 className="wl-title">Weight Loss Competition</h1>
              <p className="wl-sub">Track competitors, log weigh-ins, and rank by percentage lost</p>
            </div>
            <div className="wl-toggle">
              {["lbs","kg"].map(u => (
                <button key={u} className={`wl-toggle-btn${unit === u ? " on" : ""}`} onClick={() => setUnit(u)}>{u}</button>
              ))}
            </div>
          </div>
          <ShareBar urlStamp={urlStamp} onNew={onNew} />
        </div>

        <div className="wl-main">
          <div className="wl-grid2">

            {/* Add Competitor */}
            <div className="wl-card">
              <div className="wl-card-hd">Competitors</div>
              <div className="wl-field">
                <label className="wl-lbl">Name</label>
                <input ref={nameRef} className="wl-inp" placeholder="Competitor name" maxLength={40}
                  value={newName} onChange={e => setNewName(e.target.value)}
                  onKeyDown={e => e.key === "Enter" && addCompetitor()} />
              </div>
              <div style={{ display:"flex", gap:8 }}>
                <div className="wl-field" style={{ flex:1 }}>
                  <label className="wl-lbl">Starting weight ({unit})</label>
                  <input className="wl-inp" type="number" min={1} step={0.1} placeholder="0.0"
                    value={newWt} onChange={e => setNewWt(e.target.value)}
                    onKeyDown={e => e.key === "Enter" && addCompetitor()} />
                </div>
                <div className="wl-field" style={{ flex:1 }}>
                  <label className="wl-lbl">Start date</label>
                  <input className="wl-inp" type="date" value={newDate} onChange={e => setNewDate(e.target.value)} />
                </div>
              </div>
              <button className="wl-btn wl-btn-g" style={{ width:"100%" }}
                disabled={!newName.trim() || !newWt || !newDate} onClick={addCompetitor}>
                + Add Competitor
              </button>
              {competitors.length > 0 && (
                <div className="wl-clist">
                  {competitors.map(c => (
                    <div key={c.id} className="wl-citem">
                      <span style={{ display:"flex", alignItems:"center", gap:8, fontWeight:500 }}>
                        <span className="wl-dot" style={{ background: colorOf(c.id) }} />{c.name}
                      </span>
                      <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                        <span style={{ color:"#64748b" }}>{c.startWeight} {unit}</span>
                        <button className="wl-btn wl-btn-del" onClick={() => removeCompetitor(c.id)}>✕</button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>

            {/* Log Weigh-In */}
            <div className="wl-card">
              <div className="wl-card-hd">Log Weigh-In</div>
              {competitors.length === 0 ? (
                <div className="wl-empty">Add competitors to start logging weigh-ins</div>
              ) : (
                <>
                  <div className="wl-field">
                    <label className="wl-lbl">Competitor</label>
                    <select className="wl-inp" style={{ cursor:"pointer" }} value={wiId} onChange={e => setWiId(e.target.value)}>
                      <option value="">Select competitor…</option>
                      {competitors.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                    </select>
                  </div>
                  <div style={{ display:"flex", gap:8 }}>
                    <div className="wl-field" style={{ flex:1 }}>
                      <label className="wl-lbl">Date</label>
                      <input className="wl-inp" type="date" value={wiDate} onChange={e => setWiDate(e.target.value)} />
                    </div>
                    <div className="wl-field" style={{ flex:1 }}>
                      <label className="wl-lbl">Weight ({unit})</label>
                      <input className="wl-inp" type="number" min={1} step={0.1} placeholder="0.0"
                        value={wiWt} onChange={e => setWiWt(e.target.value)}
                        onKeyDown={e => e.key === "Enter" && logWeighIn()} />
                    </div>
                  </div>
                  {preview && (
                    <div className={`wl-preview ${preview.pct >= 0 ? "pos" : "neg"}`}>
                      {preview.pct >= 0
                        ? `${preview.pct.toFixed(2)}% lost — down ${preview.diff.toFixed(1)} ${unit}`
                        : `${Math.abs(preview.pct).toFixed(2)}% gained — up ${Math.abs(preview.diff).toFixed(1)} ${unit}`}
                    </div>
                  )}
                  <button className="wl-btn wl-btn-g" style={{ width:"100%" }}
                    disabled={!wiId || !wiWt || !wiDate} onClick={logWeighIn}>
                    Log Weigh-In
                  </button>
                  <p style={{ fontSize:12, color:"#94a3b8", textAlign:"center", marginTop:8 }}>
                    Logging on an existing date updates that entry
                  </p>
                </>
              )}
            </div>

          </div>

          {competitors.length > 0 && (
            <div className="wl-card" style={{ padding:0 }}>
              <div style={{ padding:"0 4px" }}>
                <div className="wl-tabs">
                  {[["rankings","🏆 Rankings"],["chart","📈 Progress Chart"],["history","📋 History"]].map(([t,lbl]) => (
                    <button key={t} className={`wl-tab${tab === t ? " on" : ""}`} onClick={() => setTab(t)}>{lbl}</button>
                  ))}
                </div>
              </div>

              <div style={{ padding:"0 20px 24px" }}>

                {tab === "rankings" && (
                  ranked.every(c => c.sortedWeighIns.length === 0) ? (
                    <div className="wl-empty">Rankings will appear once the first weigh-ins are logged</div>
                  ) : (
                    <table className="wl-tbl">
                      <thead>
                        <tr>
                          <th style={{ width:44 }}>#</th>
                          <th>Competitor</th>
                          <th className="tr">Start</th>
                          <th className="tr">Current</th>
                          <th className="tr">Lost</th>
                          <th style={{ minWidth:180 }}>% Lost</th>
                          <th className="tr">Check-ins</th>
                        </tr>
                      </thead>
                      <tbody>
                        {ranked.map(c => (
                          <tr key={c.id}>
                            <td><span className={`wl-badge${c.rank <= 3 ? ` r${c.rank}` : " rn"}`}>{rankIcon(c.rank)}</span></td>
                            <td>
                              <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                                <span className="wl-dot" style={{ background: colorOf(c.id) }} />
                                <span style={{ fontWeight:500 }}>{c.name}</span>
                              </div>
                            </td>
                            <td className="tr" style={{ color:"#64748b" }}>{c.startWeight} {unit}</td>
                            <td className="tr" style={{ fontWeight:500 }}>{c.currentWeight.toFixed(1)} {unit}</td>
                            <td className="tr" style={{ color: c.lostAbs > 0 ? "#16a34a" : c.lostAbs < 0 ? "#dc2626" : "#64748b" }}>
                              {c.lostAbs.toFixed(1)} {unit}
                            </td>
                            <td>
                              <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                                <div style={{ flex:1, height:6, background:"#f1f5f9", borderRadius:3, minWidth:60, overflow:"hidden" }}>
                                  <div style={{
                                    height:"100%", borderRadius:3, transition:"width 0.4s",
                                    background: c.pctLost < 0 ? "#dc2626" : "#16a34a",
                                    width: `${Math.max(0, c.pctLost) / maxPct * 100}%`,
                                  }} />
                                </div>
                                <span style={{
                                  fontWeight:600, fontSize:14, minWidth:58, textAlign:"right",
                                  color: c.pctLost < 0 ? "#dc2626" : c.pctLost === 0 ? "#94a3b8" : "#16a34a",
                                }}>
                                  {c.pctLost.toFixed(2)}%
                                </span>
                              </div>
                            </td>
                            <td className="tr" style={{ color:"#94a3b8" }}>{c.sortedWeighIns.length}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  )
                )}

                {tab === "chart" && <ProgressChart ranked={ranked} colorOf={colorOf} />}

                {tab === "history" && (
                  <div style={{ display:"flex", flexDirection:"column", gap:14 }}>
                    {ranked.map(c => (
                      <div key={c.id} style={{ border:"1px solid #e2e8f0", borderRadius:10, overflow:"hidden" }}>
                        <div style={{
                          display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap",
                          padding:"12px 16px", background:"#fff", borderBottom:"1px solid #e2e8f0", gap:10,
                        }}>
                          <div style={{ display:"flex", alignItems:"center", gap:8, fontWeight:600, fontSize:15 }}>
                            <span className="wl-dot-lg" style={{ background: colorOf(c.id) }} />
                            {c.name}
                            <span style={{ fontSize:12, color:"#94a3b8", fontWeight:400 }}>Rank #{c.rank}</span>
                          </div>
                          <div style={{ display:"flex", gap:18, fontSize:13, color:"#64748b", flexWrap:"wrap" }}>
                            <span>Start: <strong style={{ color:"#0f172a" }}>{c.startWeight} {unit}</strong></span>
                            <span>Now: <strong style={{ color:"#0f172a" }}>{c.currentWeight.toFixed(1)} {unit}</strong></span>
                            <span>Lost: <strong style={{ color: c.pctLost >= 0 ? "#16a34a" : "#dc2626" }}>{c.pctLost.toFixed(2)}%</strong></span>
                          </div>
                        </div>
                        <div style={{ padding:"10px 14px", display:"flex", flexDirection:"column", gap:6, background:"#f8fafc" }}>
                          <div style={{
                            display:"flex", alignItems:"center", gap:10, padding:"8px 12px",
                            background:"#f0fdf4", border:"1px solid #bbf7d0", borderRadius:7, fontSize:13,
                          }}>
                            <span style={{ color:"#64748b", minWidth:76 }}>{fmtDate(c.startDate)}</span>
                            <span style={{ fontWeight:600 }}>{c.startWeight} {unit}</span>
                            <span style={{ fontSize:11, color:"#94a3b8", background:"#dcfce7", borderRadius:4, padding:"1px 6px" }}>start</span>
                            <span style={{ marginLeft:"auto", fontWeight:600, color:"#94a3b8" }}>0.00%</span>
                          </div>
                          {c.sortedWeighIns.length === 0 && (
                            <div className="wl-empty" style={{ padding:"12px 0" }}>No weigh-ins logged yet</div>
                          )}
                          {c.sortedWeighIns.map(wi => {
                            const pct  = calcPct(c.startWeight, wi.weight);
                            const diff = c.startWeight - wi.weight;
                            return (
                              <div key={wi.id} style={{
                                display:"flex", alignItems:"center", gap:10, padding:"8px 12px",
                                background:"#fff", border:"1px solid #e2e8f0", borderRadius:7, fontSize:13,
                              }}>
                                <span style={{ color:"#64748b", minWidth:76 }}>{fmtDate(wi.date)}</span>
                                <span style={{ fontWeight:600 }}>{wi.weight} {unit}</span>
                                <span style={{ fontSize:12, color: diff >= 0 ? "#16a34a" : "#dc2626" }}>
                                  {diff >= 0 ? "−" : "+"}{Math.abs(diff).toFixed(1)} {unit}
                                </span>
                                <span style={{ marginLeft:"auto", fontWeight:600, color: pct >= 0 ? "#16a34a" : "#dc2626" }}>
                                  {pct.toFixed(2)}%
                                </span>
                                <button className="wl-btn wl-btn-del" onClick={() => deleteWeighIn(c.id, wi.id)}>✕</button>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    ))}
                  </div>
                )}

              </div>
            </div>
          )}
        </div>
      </div>
    </>
  );
}

// ─── Root ─────────────────────────────────────────────────────────────────────
function App() {
  const { state: initialState, hasData } = useMemo(resolveInitialState, []);
  const [phase, setPhase]   = useState(hasData ? "ready" : "landing");
  const [appKey, setAppKey] = useState(0); // increment to remount MainApp fresh

  const handleCreate = () => {
    encodeToUrl(EMPTY);
    setPhase("ready");
    setAppKey(k => k + 1);
  };

  const handleNew = () => {
    if (!window.confirm("Start a new competition? Your current data will still be accessible via its URL.")) return;
    try { localStorage.removeItem(LS_KEY); } catch {}
    window.history.replaceState(null, "", window.location.pathname);
    setPhase("landing");
    setAppKey(k => k + 1);
  };

  if (phase === "landing") return (
    <>
      <style>{CSS}</style>
      <div className="wl">
        <div style={{ maxWidth:960, margin:"0 auto", padding:"24px 16px 0" }}>
          <a href="../../" className="wl-back">← Tools</a>
        </div>
        <div className="wl-landing">
          <div className="wl-landing-icon">⚖️</div>
          <div className="wl-landing-title">Weight Loss Competition</div>
          <div className="wl-landing-desc">
            Track competitors, log weekly weigh-ins, and rank by percentage lost.
            Your competition is saved in this browser — come back any time. Share the link after each update so others see the latest.
          </div>
          <button className="wl-btn wl-btn-g wl-btn-lg" onClick={handleCreate}>
            Start a Competition →
          </button>
        </div>
      </div>
    </>
  );

  return <MainApp key={appKey} initialData={initialState || EMPTY} onNew={handleNew} />;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
