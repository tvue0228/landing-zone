<script type="text/babel">
const { useState, useMemo, useCallback, useRef, useEffect } = React;

// ─── Constants ────────────────────────────────────────────────────────────────
const RANK_PTS  = { 1: 4, 2: 3, 3: 2, 4: 1 };
const RANK_LABEL = { 1: "1st", 2: "2nd", 3: "3rd", 4: "4th" };
const RANK_COLOR = {
  1: { bg: "rgba(201,168,76,0.18)",  border: "rgba(201,168,76,0.55)",  text: "#c9a84c" },
  2: { bg: "rgba(160,160,160,0.14)", border: "rgba(160,160,160,0.4)",  text: "#b0b0b0" },
  3: { bg: "rgba(160,100,50,0.16)",  border: "rgba(160,100,50,0.45)",  text: "#c0804a" },
  4: { bg: "rgba(60,60,80,0.18)",    border: "rgba(80,80,110,0.35)",   text: "#7a7a9a" },
};
const RANK_ICON = { 1: "👑", 2: "🥈", 3: "🥉", 4: "4th" };

// ─── Utilities ────────────────────────────────────────────────────────────────
const uid = () => Math.random().toString(36).slice(2, 9);
const shuffle = (arr) => {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

const podComplete = (pod) =>
  pod.isBye || pod.players.every((pid) => pod.placements[pid] !== undefined);

// ─── Persistence ──────────────────────────────────────────────────────────────
const LS_KEY = "ct-current";

function tryDecode(compressed) {
  try {
    const json = LZString.decompressFromEncodedURIComponent(compressed);
    return json ? JSON.parse(json) : null;
  } catch { return null; }
}

function resolveInitialState() {
  const hash = window.location.hash.replace(/^#/, "");
  if (hash) {
    const state = tryDecode(hash);
    if (state) {
      try { localStorage.setItem(LS_KEY, hash); } catch {}
      return state;
    }
  }
  try {
    const saved = localStorage.getItem(LS_KEY);
    if (saved) {
      const state = tryDecode(saved);
      if (state) {
        window.history.replaceState(null, "", "#" + saved);
        return state;
      }
    }
  } catch {}
  return null;
}

function encodeToUrl(state) {
  const compressed = LZString.compressToEncodedURIComponent(JSON.stringify(state));
  window.history.replaceState(null, "", "#" + compressed);
  try { localStorage.setItem(LS_KEY, compressed); } catch {}
}

// ─── Strength of Schedule ─────────────────────────────────────────────────────
function calculateSoS(playerId, completedPods, playerMap) {
  const opponents = [];
  for (const pod of completedPods) {
    if (pod.isBye || !pod.players.includes(playerId)) continue;
    pod.players.forEach((id) => { if (id !== playerId) opponents.push(id); });
  }
  if (opponents.length === 0) return 0;
  const total = opponents.reduce((sum, id) => sum + (playerMap[id]?.points ?? 0), 0);
  return total / opponents.length;
}

// ─── Pod Generation ────────────────────────────────────────────────────────────
function generatePods(playerList, isFirst, completedRounds = []) {
  const playerMap = Object.fromEntries(playerList.map((p) => [p.id, p]));
  const completedPods = completedRounds.flatMap((r) => r.pods);

  const sorted = isFirst
    ? shuffle([...playerList])
    : [...playerList].sort((a, b) => {
        if (b.points !== a.points) return b.points - a.points;
        if (b.p1 !== a.p1) return b.p1 - a.p1;
        const sosA = calculateSoS(a.id, completedPods, playerMap);
        const sosB = calculateSoS(b.id, completedPods, playerMap);
        if (sosB !== sosA) return sosB - sosA;
        return b.p2 - a.p2;
      });

  const n = sorted.length;
  const rem = n % 4;
  const pods = [];
  let pool = [...sorted];

  if (rem === 1) {
    const bye = pool.pop();
    pods.push({ id: uid(), players: [bye.id], isBye: true, placements: { [bye.id]: 1 } });
  } else if (rem === 2) {
    const b2 = pool.pop(), b1 = pool.pop();
    pods.push({ id: uid(), players: [b1.id], isBye: true, placements: { [b1.id]: 1 } });
    pods.push({ id: uid(), players: [b2.id], isBye: true, placements: { [b2.id]: 1 } });
  } else if (rem === 3) {
    const trio = pool.splice(pool.length - 3);
    pods.push({ id: uid(), players: trio.map((p) => p.id), isBye: false, placements: {} });
  }

  for (let i = 0; i < pool.length; i += 4) {
    pods.push({
      id: uid(),
      players: pool.slice(i, i + 4).map((p) => p.id),
      isBye: false,
      placements: {},
    });
  }
  return pods;
}

// ─── Apply Round Results ───────────────────────────────────────────────────────
function applyResults(playerList, pods) {
  const map = Object.fromEntries(playerList.map((p) => [p.id, { ...p }]));
  for (const pod of pods) {
    if (pod.isBye) {
      pod.players.forEach((id) => { map[id].points += 1; map[id].byes += 1; });
    } else {
      pod.players.forEach((id) => {
        const rank = pod.placements[id];
        if (rank === undefined) return;
        map[id].gamesPlayed += 1;
        map[id].points += RANK_PTS[rank] ?? 1;
        if (rank === 1) map[id].p1 += 1;
        else if (rank === 2) map[id].p2 += 1;
        else if (rank === 3) map[id].p3 += 1;
        else map[id].p4 += 1;
      });
    }
  }
  return playerList.map((p) => map[p.id]);
}

`;

// ─── Share Bar ────────────────────────────────────────────────────────────────
function ShareBar({ urlStamp }) {
  const [copied, setCopied] = useState(false);
  const url = window.location.href;
  const copy = async () => {
    try { await navigator.clipboard.writeText(url); } catch { return; }
    setCopied(true);
    setTimeout(() => setCopied(false), 2000);
  };
  return (
    <div className="ct-share">
      <span style={{ fontSize:13 }}>🔗</span>
      <span className="ct-share-url">{url}</span>
      <button className={`ct-share-copy${copied ? " ok" : ""}`} onClick={copy}>
        {copied ? "✓ Copied" : "Copy Link"}
      </button>
    </div>
  );
}

// ─── Sub-components ────────────────────────────────────────────────────────────
function ManaPips() {
  return (
    <div className="ct-mana">
      {[["w","☀"],["u","💧"],["b","💀"],["r","🔥"],["g","🌿"]].map(([c,e]) => (
        <div key={c} className={`ct-mana-pip ${c}`}>{e}</div>
      ))}
    </div>
  );
}

function RoundProgress({ current, total }) {
  return (
    <div className="ct-progress">
      {Array.from({ length: total }, (_, i) => {
        const n = i + 1;
        const cls = n < current ? "done" : n === current ? "active" : "";
        return (
          <div key={n} style={{ display: "contents" }}>
            {i > 0 && <div className={`ct-rline${n <= current ? " done" : ""}`} />}
            <div className={`ct-rpip ${cls}`}>{n}</div>
          </div>
        );
      })}
    </div>
  );
}

function PodCard({ pod, podIndex, players, onSetPlacement, locked }) {
  const getP = (id) => players.find((p) => p.id === id);
  const complete = podComplete(pod);

  if (pod.isBye) {
    const p = getP(pod.players[0]);
    return (
      <div className="ct-pod">
        <div className="ct-pod-hd">
          <span className="ct-pod-title">Table {podIndex + 1}</span>
          <span className="ct-pod-badge bye">Bye</span>
        </div>
        <div className="ct-pod-bye">🌙 <span>{p?.name ?? "—"}</span>
          <span style={{ fontSize: 12, marginLeft: "auto", color: "#5a5a7a" }}>+1 pt</span>
        </div>
      </div>
    );
  }

  const maxRank = pod.players.length;

  return (
    <div className={`ct-pod${complete ? " resolved" : ""}`}>
      <div className="ct-pod-hd">
        <span className="ct-pod-title">Table {podIndex + 1} · {pod.players.length}P</span>
        <span className={`ct-pod-badge ${complete ? "done" : "wait"}`}>
          {complete ? "✓ Done" : `${Object.keys(pod.placements).length}/${pod.players.length} ranked`}
        </span>
      </div>
      <div className="ct-pod-players">
        {pod.players.map((pid) => {
          const p = getP(pid);
          const rank = pod.placements[pid];
          const rc = rank ? RANK_COLOR[rank] : null;
          return (
            <div
              key={pid}
              className={`ct-pod-row${rank ? " placed" : ""}`}
              style={rc ? { "--rank-bg": rc.bg, "--rank-border": rc.border } : {}}
            >
              <span
                className={`ct-pod-pname${!rank ? " unranked" : ""}`}
                style={rc ? { color: rc.text } : {}}
              >
                {rank ? `${RANK_ICON[rank] || rank} ` : ""}{p?.name ?? "?"}
              </span>
              {!locked && (
                <div className="ct-rank-btns">
                  {[1, 2, 3, 4].filter((r) => r <= maxRank).map((r) => (
                    <button
                      key={r}
                      className={`ct-rank-btn${rank === r ? ` active-${r}` : ""}`}
                      onClick={() => onSetPlacement(pod.id, pid, r)}
                      title={`${RANK_LABEL[r]} place`}
                    >
                      {r}
                    </button>
                  ))}
                </div>
              )}
              {locked && rank && (
                <span style={{
                  fontFamily: "'Cinzel',serif", fontSize: 11, color: rc?.text,
                  background: rc?.bg, border: `1px solid ${rc?.border}`,
                  borderRadius: 4, padding: "2px 7px"
                }}>
                  {RANK_LABEL[rank]} · {RANK_PTS[rank]}pt
                </span>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function StandingsTable({ players, completedRounds = [], showDetailed = true }) {
  const playerMap = useMemo(
    () => Object.fromEntries(players.map((p) => [p.id, p])),
    [players]
  );
  const completedPods = useMemo(
    () => completedRounds.flatMap((r) => r.pods),
    [completedRounds]
  );

  const enriched = useMemo(
    () =>
      players
        .map((p) => ({ ...p, sos: calculateSoS(p.id, completedPods, playerMap) }))
        .sort((a, b) =>
          b.points !== a.points ? b.points - a.points :
          b.p1 !== a.p1 ? b.p1 - a.p1 :
          b.sos !== a.sos ? b.sos - a.sos :
          b.p2 !== a.p2 ? b.p2 - a.p2 :
          a.name.localeCompare(b.name)
        ),
    [players, completedPods, playerMap]
  );

  const sosTBSet = useMemo(() => {
    const s = new Set();
    enriched.forEach((p, i) => {
      if (i === 0) return;
      const prev = enriched[i - 1];
      if (prev.points === p.points && prev.p1 === p.p1 && prev.sos !== p.sos) {
        s.add(p.id); s.add(prev.id);
      }
    });
    return s;
  }, [enriched]);

  const sosActive = sosTBSet.size > 0;
  const hasAnyGames = players.some((p) => p.gamesPlayed > 0 || p.byes > 0);

  return (
    <div>
      <table className="ct-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Player</th>
            <th>Pts</th>
            {showDetailed && (
              <>
                <th title="1st place finishes">👑</th>
                <th title="2nd place finishes">🥈</th>
                <th title="3rd place finishes">🥉</th>
                <th title="4th place finishes">4th</th>
                <th title="Strength of Schedule — avg opponent points">
                  SoS{sosActive && <span className="ct-tb-pip">TB</span>}
                </th>
                <th>Bye</th>
                <th>GP</th>
              </>
            )}
          </tr>
        </thead>
        <tbody>
          {enriched.map((p, i) => (
            <tr key={p.id}>
              <td>
                <span className={`ct-srank${i === 0 ? " r1" : i === 1 ? " r2" : i === 2 ? " r3" : ""}`}>
                  {i === 0 ? "👑" : i + 1}
                </span>
              </td>
              <td style={{ fontWeight: i === 0 ? 600 : 400, color: i === 0 ? "#c9a84c" : "#e8d5b0" }}>
                {p.name}
              </td>
              <td><span className="ct-pts-cell">{p.points}</span></td>
              {showDetailed && (
                <>
                  <td><span className="ct-place-chip p1">{p.p1}</span></td>
                  <td><span className="ct-place-chip p2">{p.p2}</span></td>
                  <td><span className="ct-place-chip p3">{p.p3}</span></td>
                  <td><span className="ct-place-chip p4">{p.p4}</span></td>
                  <td>
                    <span className={`ct-sos-val${sosTBSet.has(p.id) ? " tb" : ""}`}>
                      {hasAnyGames ? p.sos.toFixed(2) : "—"}
                    </span>
                  </td>
                  <td><span className="ct-place-chip bye">{p.byes}</span></td>
                  <td style={{ color: "#3e4555", fontSize: 13 }}>{p.gamesPlayed}</td>
                </>
              )}
            </tr>
          ))}
        </tbody>
      </table>
      {showDetailed && (
        <div className="ct-sos-footer">
          <span className="ct-sos-icon">⚖️</span>
          <span>
            <strong>SoS</strong> (Strength of Schedule) = average points of all opponents faced.
            {sosActive
              ? " Highlighted in gold — currently serving as tiebreaker."
              : " Used as 3rd tiebreaker when pts and 1st-place finishes are equal."}
          </span>
        </div>
      )}
    </div>
  );
}

// ─── Main App ─────────────────────────────────────────────────────────────────
function CommanderTournament() {
  const saved = useMemo(() => resolveInitialState(), []);
  const [phase, setPhase]             = useState(saved?.phase ?? "setup");
  const [players, setPlayers]         = useState(saved?.players ?? []);
  const [rounds, setRounds]           = useState(saved?.rounds ?? []);
  const [curRound, setCurRound]       = useState(saved?.curRound ?? 1);
  const [totalRounds, setTotalRounds] = useState(saved?.totalRounds ?? 4);
  const [newName, setNewName]         = useState("");
  const [tab, setTab]                 = useState("pods");
  const [urlStamp, setUrlStamp]       = useState(0);
  const inputRef = useRef(null);

  useEffect(() => {
    if (phase === "setup" && players.length === 0) return;
    encodeToUrl({ phase, players, rounds, curRound, totalRounds });
    setUrlStamp(n => n + 1);
  }, [phase, players, rounds, curRound, totalRounds]);

  const currentRoundData = rounds.find((r) => r.roundNum === curRound);
  const allPodsComplete  = currentRoundData?.pods.every(podComplete) ?? false;

  const completedRounds = useMemo(() => rounds.filter((r) => r.complete), [rounds]);

  const standings = useMemo(() => {
    const playerMap = Object.fromEntries(players.map((p) => [p.id, p]));
    const completedPods = completedRounds.flatMap((r) => r.pods);
    return [...players]
      .map((p) => ({ ...p, sos: calculateSoS(p.id, completedPods, playerMap) }))
      .sort((a, b) =>
        b.points !== a.points ? b.points - a.points :
        b.p1 !== a.p1 ? b.p1 - a.p1 :
        b.sos !== a.sos ? b.sos - a.sos :
        b.p2 !== a.p2 ? b.p2 - a.p2 :
        a.name.localeCompare(b.name)
      );
  }, [players, completedRounds]);

  const addPlayer = useCallback(() => {
    const name = newName.trim();
    if (!name || players.find((p) => p.name.toLowerCase() === name.toLowerCase())) {
      setNewName(""); return;
    }
    setPlayers((prev) => [...prev, {
      id: uid(), name,
      points: 0, p1: 0, p2: 0, p3: 0, p4: 0, byes: 0, gamesPlayed: 0,
    }]);
    setNewName("");
    inputRef.current?.focus();
  }, [newName, players]);

  const removePlayer = (id) => setPlayers((p) => p.filter((x) => x.id !== id));

  const startTournament = () => {
    if (players.length < 4) return;
    const pods = generatePods(players, true);
    setRounds([{ roundNum: 1, pods, complete: false }]);
    setCurRound(1);
    setPhase("tournament");
    setTab("pods");
  };

  const setPlacement = (podId, playerId, rank) => {
    setRounds((rs) =>
      rs.map((r) =>
        r.roundNum !== curRound ? r : {
          ...r,
          pods: r.pods.map((pod) => {
            if (pod.id !== podId) return pod;
            const newPlacements = { ...pod.placements };
            if (newPlacements[playerId] === rank) {
              delete newPlacements[playerId];
            } else {
              Object.keys(newPlacements).forEach((id) => {
                if (newPlacements[id] === rank) delete newPlacements[id];
              });
              newPlacements[playerId] = rank;
            }
            return { ...pod, placements: newPlacements };
          }),
        }
      )
    );
  };

  const completeRound = () => {
    if (!allPodsComplete) return;
    const updated = applyResults(players, currentRoundData.pods);
    setPlayers(updated);

    const nowComplete = rounds.map((r) =>
      r.roundNum === curRound ? { ...r, complete: true } : r
    );

    if (curRound >= totalRounds) {
      setRounds(nowComplete);
      setPhase("finished");
      setTab("standings");
    } else {
      const next = curRound + 1;
      const pods = generatePods(updated, false, nowComplete.filter((r) => r.complete));
      setRounds([...nowComplete, { roundNum: next, pods, complete: false }]);
      setCurRound(next);
      setTab("pods");
    }
  };

  const restart = () => {
    if (!window.confirm("Start a new tournament? This one remains accessible via its current URL.")) return;
    try { localStorage.removeItem(LS_KEY); } catch {}
    window.history.replaceState(null, "", window.location.pathname);
    setPhase("setup"); setPlayers([]); setRounds([]);
    setCurRound(1); setTotalRounds(4); setNewName(""); setTab("pods");
  };

  return (
    <>
      <style>{CSS}</style>
      <div className="ct">
        <div className="ct-header">
          <a href="../../" className="ct-back">← Tools</a>
          <ManaPips />
          <div className="ct-title">Commander Circuit</div>
          <div className="ct-subtitle">Tournament Management</div>
          <div className="ct-rule" />
          {(players.length > 0 || phase !== "setup") && <ShareBar urlStamp={urlStamp} />}
        </div>

        <div className="ct-main">

          {phase === "setup" && (
            <>
              <div className="ct-setup-grid">
                <div className="ct-card">
                  <div className="ct-sl">Register Players</div>
                  <div className="ct-input-row">
                    <input
                      ref={inputRef}
                      className="ct-input"
                      placeholder="Player name…"
                      value={newName}
                      onChange={(e) => setNewName(e.target.value)}
                      onKeyDown={(e) => e.key === "Enter" && addPlayer()}
                      maxLength={32}
                    />
                    <button className="ct-btn ct-btn-gold" onClick={addPlayer} disabled={!newName.trim()}>Add</button>
                  </div>
                  <div className="ct-plist">
                    {players.length === 0 && (
                      <div className="ct-empty">Add at least 4 players to begin</div>
                    )}
                    {players.map((p, i) => (
                      <div key={p.id} className="ct-pitem">
                        <div style={{ display: "flex", alignItems: "center" }}>
                          <div className="ct-pbadge">{i + 1}</div>{p.name}
                        </div>
                        <button className="ct-btn-sm" onClick={() => removePlayer(p.id)}>✕</button>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="ct-card">
                  <div className="ct-sl">Settings</div>
                  <div className="ct-settings">
                    <label>Rounds</label>
                    <input
                      type="number" className="ct-input" min={1} max={20}
                      value={totalRounds}
                      onChange={(e) => setTotalRounds(Math.max(1, Math.min(20, parseInt(e.target.value) || 1)))}
                    />
                  </div>

                  <div style={{ marginTop: 12 }}>
                    <div className="ct-sl">Game Scoring</div>
                    <div className="ct-score-legend">
                      {[[1,"👑 1st","#c9a84c"],[2,"🥈 2nd","#9a9a9a"],[3,"🥉 3rd","#b07040"],[4,"4th","#6a6a9a"]].map(([r,label,col]) => (
                        <div key={r} className="ct-score-row">
                          <span className="ct-score-label">{label}</span>
                          <span className="ct-score-pts" style={{ color: col }}>{RANK_PTS[r]} pts</span>
                        </div>
                      ))}
                      <div className="ct-score-row">
                        <span className="ct-score-label">🌙 Bye</span>
                        <span className="ct-score-pts" style={{ color: "#6a6aaa" }}>1 pt</span>
                      </div>
                    </div>
                  </div>

                  <div style={{ marginTop: 16 }}>
                    <div className="ct-sl">Tiebreakers</div>
                    <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
                      {[
                        ["1","Total points"],
                        ["2","1st-place finishes"],
                        ["3","Strength of Schedule (avg. opponent pts)"],
                        ["4","2nd-place finishes"],
                      ].map(([n, label]) => (
                        <div key={n} style={{ display:"flex", gap:10, alignItems:"center", fontSize:14, color:"#3e4555" }}>
                          <span style={{ fontFamily:"'Cinzel',serif", fontSize:10, color:"#6a5a40", width:14, flexShrink:0 }}>{n}.</span>
                          <span style={{ fontStyle:"italic" }}>{label}</span>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div style={{ marginTop: 16, borderTop: "1px solid #1c2230", paddingTop: 14 }}>
                    <div className="ct-sl">Players: {players.length}</div>
                    {players.length > 0 && players.length < 4 && (
                      <div className="ct-notice">Need at least 4 players to start.</div>
                    )}
                    {players.length >= 4 && (
                      <div className="ct-notice">
                        {Math.floor(players.length / 4)} pod{Math.floor(players.length / 4) !== 1 ? "s" : ""} of 4
                        {players.length % 4 === 1 && " · 1 bye"}
                        {players.length % 4 === 2 && " · 2 byes"}
                        {players.length % 4 === 3 && " · 1 pod of 3"}
                        {players.length % 4 === 0 && " · no byes"}
                      </div>
                    )}
                  </div>
                </div>
              </div>

              <div className="ct-actionbar">
                <button className="ct-btn ct-btn-gold ct-btn-lg" disabled={players.length < 4} onClick={startTournament}>
                  ⚔️ &nbsp; Begin Tournament
                </button>
              </div>
            </>
          )}

          {phase === "tournament" && (
            <>
              <RoundProgress current={curRound} total={totalRounds} />
              <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:20, flexWrap:"wrap", gap:10 }}>
                <div style={{ fontFamily:"'Cinzel',serif", fontSize:18, color:"#c9a84c" }}>
                  Round {curRound} <span style={{ color:"#3e4555", fontSize:14 }}>of {totalRounds}</span>
                </div>
                <span style={{ fontFamily:"'Cinzel',serif", fontSize:10, letterSpacing:"0.15em", color:"#3e4555" }}>
                  {players.length} PLAYERS
                </span>
              </div>

              <div className="ct-tabs">
                {[["pods","⚔️ Pods"],["standings","📊 Standings"],["history","📜 History"]].map(([t,label]) => (
                  <button key={t} className={`ct-tab${tab === t ? " on" : ""}`} onClick={() => setTab(t)}>{label}</button>
                ))}
              </div>

              {tab === "pods" && currentRoundData && (
                <>
                  <div className="ct-pods">
                    {currentRoundData.pods.map((pod, i) => (
                      <PodCard
                        key={pod.id} pod={pod} podIndex={i} players={players}
                        onSetPlacement={setPlacement} locked={currentRoundData.complete}
                      />
                    ))}
                  </div>
                  {!allPodsComplete && (
                    <div className="ct-notice" style={{ marginTop: 16 }}>
                      Assign finishing positions 1–4 using the rank buttons. Click again to deselect.
                    </div>
                  )}
                </>
              )}

              {tab === "standings" && (
                <div className="ct-card" style={{ padding: "20px 0" }}>
                  {players.every((p) => p.gamesPlayed === 0 && p.byes === 0)
                    ? <div className="ct-empty">Standings appear after the first round completes.</div>
                    : <StandingsTable players={players} completedRounds={completedRounds} showDetailed />
                  }
                </div>
              )}

              {tab === "history" && (
                <div style={{ display:"flex", flexDirection:"column", gap:16 }}>
                  {rounds.filter((r) => r.complete).length === 0 && (
                    <div className="ct-empty">No completed rounds yet.</div>
                  )}
                  {rounds.filter((r) => r.complete).map((r) => (
                    <div key={r.roundNum} className="ct-card">
                      <div className="ct-sl">Round {r.roundNum}</div>
                      <div className="ct-pods" style={{ gridTemplateColumns:"repeat(auto-fill,minmax(240px,1fr))" }}>
                        {r.pods.map((pod, i) => (
                          <PodCard key={pod.id} pod={pod} podIndex={i} players={players}
                            onSetPlacement={() => {}} locked />
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              )}

              <div className="ct-actionbar">
                <button className="ct-btn ct-btn-outline" onClick={restart}>↩ Restart</button>
                <button
                  className="ct-btn ct-btn-gold ct-btn-lg"
                  disabled={!allPodsComplete}
                  onClick={completeRound}
                >
                  {curRound >= totalRounds ? "🏆 End Tournament" : `Complete Round ${curRound} →`}
                </button>
              </div>
            </>
          )}

          {phase === "finished" && (
            <>
              <div className="ct-card">
                <div className="ct-winner">
                  <div className="ct-winner-icon">🏆</div>
                  <div className="ct-winner-label">Tournament Champion</div>
                  <div className="ct-winner-name">{standings[0]?.name}</div>
                  <div className="ct-winner-pts">
                    {standings[0]?.points} pts · {standings[0]?.p1} first-place finish{standings[0]?.p1 !== 1 ? "es" : ""} over {totalRounds} rounds
                  </div>
                </div>
                <div className="ct-glow-rule" />
                <div className="ct-sl" style={{ textAlign:"center" }}>Final Standings</div>
                <StandingsTable players={players} completedRounds={completedRounds} showDetailed />
              </div>
              <div className="ct-actionbar">
                <button className="ct-btn ct-btn-gold ct-btn-lg" onClick={restart}>⚔️ &nbsp; New Tournament</button>
              </div>
            </>
          )}

        </div>
      </div>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<CommanderTournament />);
</script>
</body>
</html>
