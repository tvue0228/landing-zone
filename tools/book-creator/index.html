const IMAGE_PROVIDERS = [
  { id: 'none',   label: 'No illustrations',         key: null          },
  { id: 'dalle',  label: 'DALL-E 3 (OpenAI key)',    key: 'openaiKey'   },

  { id:'5x8',     label:'5" × 8"   Compact',              w:5,   h:8   },
  { id:'5.5x8.5', label:'5.5" × 8.5"  Standard',          w:5.5, h:8.5 },
  { id:'6x9',     label:'6" × 9"   Trade (most popular)',  w:6,   h:9   },

];

const modelProvider = (id) => TEXT_MODELS.find(m => m.id === id)?.provider ?? 'anthropic';

// ── API helpers ───────────────────────────────────────────────────────────────
async function callClaude(apiKey, modelId, system, user, maxTokens) {
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
      'content-type': 'application/json',
    },
    body: JSON.stringify({ model: modelId, max_tokens: maxTokens, system, messages: [{ role: 'user', content: user }] }),
  });
  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    throw new Error(e.error?.message || `Anthropic ${res.status}`);
  }
  return (await res.json()).content[0].text;
}

async function callGemini(apiKey, modelId, system, user, maxTokens) {
  const res = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/${modelId}:generateContent?key=${apiKey}`,
    {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        system_instruction: { parts: [{ text: system }] },
        contents: [{ role: 'user', parts: [{ text: user }] }],
        generationConfig: { maxOutputTokens: maxTokens },
      }),
    }
  );
  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    throw new Error(e.error?.message || `Google AI ${res.status}`);
  }
  const data = await res.json();
  return data.candidates[0].content.parts[0].text;
}

// Unified text call — routes by model provider
async function callText(cfg, system, user, maxTokens) {
  const provider = modelProvider(cfg.textModel);
  if (provider === 'google') return callGemini(cfg.googleKey, cfg.textModel, system, user, maxTokens);
  return callClaude(cfg.anthropicKey, cfg.textModel, system, user, maxTokens);
}

async function callDALLE(apiKey, prompt) {
  const res = await fetch('https://api.openai.com/v1/images/generations', {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${apiKey}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ model: 'dall-e-3', prompt, n: 1, size: '1024x1024', quality: 'standard' }),
  });
  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    throw new Error(e.error?.message || `OpenAI ${res.status}`);
  }
  return (await res.json()).data[0].url;
}

async function callImagen(apiKey, prompt) {
  const res = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/imagen-3.0-generate-001:predict?key=${apiKey}`,
    {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        instances: [{ prompt }],
        parameters: { sampleCount: 1, aspectRatio: '1:1' },
      }),
    }
  );
  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    throw new Error(e.error?.message || `Google Imagen ${res.status}`);
  }
  const data = await res.json();
  const { bytesBase64Encoded, mimeType = 'image/png' } = data.predictions[0];
  return `data:${mimeType};base64,${bytesBase64Encoded}`;
}

async function urlToBase64(url) {
  const res = await fetch(url);
  const blob = await res.blob();
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}

// Unified image call — routes by imageProvider
async function callImage(cfg, prompt) {
  if (cfg.imageProvider === 'dalle') {
    return urlToBase64(await callDALLE(cfg.openaiKey, prompt));
  }
  if (cfg.imageProvider === 'imagen') {
    return callImagen(cfg.googleKey, prompt);
  }
  return null;
}

// ── Generation pipeline ───────────────────────────────────────────────────────
async function generateBook(cfg, onProgress, onUpdate) {
  const { prompt, genre, author, chapterCount, wordsPerChapter } = cfg;
  const hasImages = cfg.imageProvider !== 'none';

  onProgress({ stage: 'outline', msg: 'Generating book outline…', pct: 2, step: 0, steps: 0 });

  const raw = await callText(
    cfg,
    `You are a professional ${genre} author who creates compelling, well-structured books.`,
    `Create a detailed book outline for: "${prompt}"
Genre: ${genre}  |  Chapters: ${chapterCount}

Return ONLY valid JSON, no markdown, no explanation:
{
  "title": "Full Book Title",
  "subtitle": "Optional subtitle or empty string",
  "description": "2-3 sentence back-cover copy",
  "chapters": [
    { "number": 1, "title": "Chapter title", "summary": "What happens in this chapter (2-3 sentences)" }
  ]
}`,
    1400
  );

  let outline;
  try {
    const m = raw.match(/\{[\s\S]*\}/);
    outline = JSON.parse(m ? m[0] : raw);
    if (!Array.isArray(outline.chapters)) throw new Error();
  } catch {
    throw new Error('Failed to parse book outline — try rephrasing your prompt.');
  }

  const book = {
    title: outline.title || 'Untitled',
    subtitle: outline.subtitle || '',
    description: outline.description || '',
    author: author.trim() || 'Anonymous',
    genre,
    chapters: [],
  };
  onUpdate({ ...book });

  const prevCtx = [];
  for (let i = 0; i < outline.chapters.length; i++) {
    const ch = outline.chapters[i];
    const pct = 5 + Math.round((i / outline.chapters.length) * (hasImages ? 58 : 88));
    onProgress({ stage: 'chapter', msg: `Writing Chapter ${i + 1}: "${ch.title}"…`, pct, step: i + 1, steps: outline.chapters.length });

    const ctx = prevCtx.slice(-2).join('\n---\n');
    const content = await callText(
      cfg,
      `You are writing a ${genre} book titled "${book.title}". Maintain consistent voice, tone, and continuity.`,
      `Write Chapter ${ch.number}: "${ch.title}"
What should happen: ${ch.summary}
${ctx ? `\nContext from previous chapters:\n${ctx}\n` : ''}
Target length: ~${wordsPerChapter} words.
Start directly with the narrative. Do not include the chapter title. Write polished, publication-ready prose.`,
      Math.min(8000, Math.max(2048, Math.ceil(wordsPerChapter * 1.5)))
    );

    const chapter = { number: i + 1, title: ch.title, content: content.trim(), imageUrl: null };
    book.chapters.push(chapter);
    prevCtx.push(`Ch ${i + 1} (${ch.title}): ${content.substring(0, 350)}…`);
    onUpdate({ ...book, chapters: [...book.chapters] });
  }

  if (hasImages) {
    for (let i = 0; i < book.chapters.length; i++) {
      const ch = book.chapters[i];
      onProgress({ stage: 'images', msg: `Generating image for Chapter ${i + 1}…`, pct: 65 + Math.round((i / book.chapters.length) * 30), step: i + 1, steps: book.chapters.length });
      const imgPrompt = `Book illustration for a ${genre} story. "${ch.title}": ${ch.content.substring(0, 180)}. Painterly, cinematic, no text, no letters.`;
      try {
        book.chapters[i] = { ...ch, imageUrl: await callImage(cfg, imgPrompt) };
        onUpdate({ ...book, chapters: [...book.chapters] });
      } catch (e) {
        console.warn(`Image ${i + 1} skipped:`, e.message);
      }
    }
  }

  onProgress({ stage: 'done', msg: 'Book complete!', pct: 100, step: 0, steps: 0 });
  return book;
}

// ── PDF builder ───────────────────────────────────────────────────────────────
function buildPDF(book, trimId = '6x9') {
  const trim = TRIM_SIZES.find(t => t.id === trimId) || TRIM_SIZES[2];
  const { jsPDF } = window.jspdf;
  const W = trim.w, H = trim.h;
  const ML = 0.75, MR = 0.5, MT = 0.75, MB = 0.75;
  const TW = W - ML - MR;
  const LH = 0.195;
  let pg = 0;

  const doc = new jsPDF({ unit: 'in', format: [W, H], compress: true });

  const addPgNum = () => {
    doc.setFont('times', 'italic'); doc.setFontSize(9); doc.setTextColor(130, 130, 130);
    doc.text(String(pg), W / 2, H - 0.4, { align: 'center' });
    doc.setTextColor(0, 0, 0);
  };
  const np = () => { doc.addPage(); pg++; };

  // Title page
  doc.setFont('times', 'bold'); doc.setFontSize(30);
  const tLines = doc.splitTextToSize(book.title, TW + 0.3);
  let ty = H * 0.32;
  for (const l of tLines) { doc.text(l, W / 2, ty, { align: 'center' }); ty += 0.52; }
  if (book.subtitle) {
    doc.setFont('times', 'italic'); doc.setFontSize(14);
    doc.text(book.subtitle, W / 2, ty + 0.1, { align: 'center' });
  }
  doc.setFont('times', 'normal'); doc.setFontSize(13);
  doc.text(book.author, W / 2, H * 0.82, { align: 'center' });

  // Copyright page
  np();
  doc.setFont('times', 'normal'); doc.setFontSize(9);
  const yr = new Date().getFullYear();
  const cLines = [
    `Copyright © ${yr} ${book.author}`, 'All rights reserved.', '',
    'No part of this publication may be reproduced, distributed, or transmitted',
    'in any form or by any means without prior written permission of the author.',
    '', `Genre: ${book.genre}`, `First Edition, ${yr}`, '', 'Created with AI assistance.',
  ];
  let cy2 = 2;
  for (const line of cLines) { doc.text(line, ML, cy2); cy2 += 0.195; }

  // Table of contents
  np(); pg = 1;
  doc.setFont('times', 'bold'); doc.setFontSize(18);
  doc.text('Contents', W / 2, MT + 0.4, { align: 'center' });
  doc.setFontSize(11);
  let tocy = MT + 1;
  for (const ch of book.chapters) {
    if (tocy > H - MB - 0.3) { addPgNum(); np(); pg++; tocy = MT; }
    doc.setFont('times', 'bold'); doc.text(`${ch.number}.`, ML, tocy);
    doc.setFont('times', 'normal'); doc.text(doc.splitTextToSize(ch.title, TW - 0.5)[0], ML + 0.4, tocy);
    tocy += 0.31;
  }
  addPgNum();

  // Chapters
  for (const ch of book.chapters) {
    np(); pg++;
    let y = MT + 0.5;

    doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5); doc.setTextColor(160, 120, 30);
    doc.text(`CHAPTER ${ch.number}`, W / 2, y, { align: 'center' });
    doc.setTextColor(0, 0, 0); y += 0.3;

    doc.setFont('times', 'bold'); doc.setFontSize(20);
    for (const l of doc.splitTextToSize(ch.title, TW)) { doc.text(l, W / 2, y, { align: 'center' }); y += 0.38; }
    y += 0.15;

    doc.setDrawColor(200, 160, 50); doc.setLineWidth(0.012);
    doc.line(W / 2 - 0.6, y, W / 2 + 0.6, y);
    doc.setDrawColor(0, 0, 0); y += 0.35;

    if (ch.imageUrl) {
      const ih = 2.2;
      if (y + ih > H - MB - 1) { addPgNum(); np(); pg++; y = MT; }
      try { doc.addImage(ch.imageUrl, 'JPEG', ML, y, TW, ih); y += ih + 0.3; } catch { }
    }

    doc.setFont('times', 'normal'); doc.setFontSize(11);
    const paras = ch.content.split(/\n\n+/).filter(p => p.trim());
    for (let pi = 0; pi < paras.length; pi++) {
      const lines = doc.splitTextToSize(paras[pi].trim().replace(/\n/g, ' '), TW);
      for (let li = 0; li < lines.length; li++) {
        if (y + LH > H - MB) { addPgNum(); np(); pg++; y = MT; }
        doc.text(lines[li], ML + (pi > 0 && li === 0 ? 0.25 : 0), y);
        y += LH;
      }
      y += LH * 0.5;
    }
    addPgNum();
  }

  np(); pg++;
  doc.setFont('times', 'italic'); doc.setFontSize(13);
  doc.text('— End —', W / 2, H / 2, { align: 'center' });
  addPgNum();

  const fname = book.title.replace(/[^a-z0-9 ]/gi, '').replace(/\s+/g, '_').substring(0, 60) || 'book';
  doc.save(`${fname}.pdf`);
}

// ── ChapterItem ────────────────────────────────────────────────────────────────
function ChapterItem({ ch, onUpdate }) {
  const [open, setOpen] = useState(false);
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(ch.content);
  const words = useMemo(() => ch.content.trim().split(/\s+/).length, [ch.content]);

  const save = () => { onUpdate({ ...ch, content: draft }); setEditing(false); };
  const cancel = () => { setDraft(ch.content); setEditing(false); };

  return (
    <div className={`ch-item${open ? ' open' : ''}`}>
      <div className="ch-hdr" onClick={() => setOpen(o => !o)}>
        <span className="ch-num">CH {ch.number}</span>
        <span className="ch-ttl">{ch.title}</span>
        <span className="ch-stat">{words.toLocaleString()} w{ch.imageUrl ? ' · 🖼' : ''}</span>
        <span className="ch-arr">▾</span>
      </div>
      {open && (
        <div className="ch-body">
          {ch.imageUrl && <img className="ch-img" src={ch.imageUrl} alt={ch.title} />}
          {editing ? (
            <>
              <textarea className="ch-text-ta" value={draft} onChange={e => setDraft(e.target.value)} />
              <div className="edit-btns">
                <button className="btn btn-ghost" onClick={save}>✓ Save</button>
                <button className="btn btn-ghost" onClick={cancel}>Cancel</button>
              </div>
            </>
          ) : (
            <>
              <div className="ch-text">{ch.content}</div>
              <div className="edit-btns">
                <button className="btn btn-ghost" style={{ marginTop: 8 }} onClick={() => setEditing(true)}>✏️ Edit</button>
              </div>
            </>
          )}
        </div>
      )}
    </div>
  );
}

// ── LS helpers ────────────────────────────────────────────────────────────────
const lsGet = (k, d) => { try { return localStorage.getItem(k) || d; } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  const [step, setStep] = useState('setup');
  const [error, setError] = useState('');
  const [prog, setProg] = useState({ stage: '', msg: '', pct: 0, step: 0, steps: 0 });
  const [book, setBook] = useState(null);
  const [exportTrim, setExportTrim] = useState('6x9');
  const [buildingPdf, setBuildingPdf] = useState(false);
  const [showK, setShowK] = useState({ a: false, g: false, o: false });

  const [cfg, setCfg] = useState({
    anthropicKey:    lsGet('bc_ak', ''),
    googleKey:       lsGet('bc_gk', ''),
    openaiKey:       lsGet('bc_ok', ''),
    textModel:       'claude-sonnet-4-6',
    imageProvider:   'none',
    prompt:          '',
    genre:           'Fiction',
    author:          '',
    chapterCount:    8,
    wordsPerChapter: 1200,
  });

  const set = (k, v) => setCfg(c => ({ ...c, [k]: v }));
  useEffect(() => { lsSet('bc_ak', cfg.anthropicKey); }, [cfg.anthropicKey]);
  useEffect(() => { lsSet('bc_gk', cfg.googleKey); }, [cfg.googleKey]);
  useEffect(() => { lsSet('bc_ok', cfg.openaiKey); }, [cfg.openaiKey]);

  const provider = modelProvider(cfg.textModel);
  const imgProv = IMAGE_PROVIDERS.find(p => p.id === cfg.imageProvider);

  const hasTextKey = provider === 'google'
    ? cfg.googleKey.trim().length > 5
    : cfg.anthropicKey.trim().length > 10;

  const hasImageKey = cfg.imageProvider === 'none' ? true
    : cfg.imageProvider === 'dalle' ? cfg.openaiKey.trim().length > 10
    : cfg.imageProvider === 'imagen' ? cfg.googleKey.trim().length > 5
    : false;

  const canStart = hasTextKey && hasImageKey && cfg.prompt.trim().length > 10;

  const totalWords = cfg.chapterCount * cfg.wordsPerChapter;
  const estMins = Math.ceil(cfg.chapterCount * (cfg.textModel.includes('opus') ? 2.5 : cfg.textModel.includes('haiku') || cfg.textModel.includes('flash') ? 0.5 : 1.2));

  const missingKey = !hasTextKey
    ? (provider === 'google' ? 'Google AI key' : 'Anthropic key')
    : !hasImageKey
    ? (cfg.imageProvider === 'dalle' ? 'OpenAI key' : 'Google AI key')
    : null;

  const start = async () => {
    setError(''); setBook(null); setStep('generating');
    try {
      const result = await generateBook(cfg, setProg, b => setBook({ ...b, chapters: [...(b.chapters || [])] }));
      setBook(result); setStep('done');
    } catch (e) {
      setError(e.message || 'Generation failed — check your API key and try again.');
      setStep('setup');
    }
  };

  const downloadPDF = async () => {
    if (!book) return;
    setBuildingPdf(true);
    try { buildPDF(book, exportTrim); } catch (e) { setError('PDF error: ' + e.message); }
    setBuildingPdf(false);
  };

  const updateChapter = (idx, updated) =>
    setBook(b => { const chapters = [...b.chapters]; chapters[idx] = updated; return { ...b, chapters }; });

  const toggleK = (k) => setShowK(s => ({ ...s, [k]: !s[k] }));

  // ── Setup ─────────────────────────────────────────────────────────────────
  if (step === 'setup') return (
    <>
      <style>{CSS}</style>
      <div className="wrap">
        <a href="../../" className="back">← Tools</a>
        <div className="hd">
          <div className="logo">AI Book <em>Creator</em></div>
          <div className="sub">Generate a full book with AI, then download a print-ready PDF formatted for Amazon KDP.</div>
        </div>

        {error && <div className="card err-card" style={{ marginBottom: 14 }}><div className="err-msg">⚠ {error}</div></div>}

        {/* API Keys */}
        <div className="card">
          <div className="section-title">API Keys</div>

          <div className="field">
            <label>
              Anthropic API Key
              <span className="key-badge kb-anthropic">Claude models</span>
            </label>
            <div className="key-row">
              <input type={showK.a ? 'text' : 'password'} placeholder="sk-ant-…" value={cfg.anthropicKey}
                onChange={e => set('anthropicKey', e.target.value)} autoComplete="off" spellCheck={false} />
              <button className="key-toggle" onClick={() => toggleK('a')}>{showK.a ? 'Hide' : 'Show'}</button>
            </div>
          </div>

          <div className="field">
            <label>
              Google AI API Key
              <span className="key-badge kb-google">Gemini models + Imagen</span>
            </label>
            <div className="key-row">
              <input type={showK.g ? 'text' : 'password'} placeholder="AIza…" value={cfg.googleKey}
                onChange={e => set('googleKey', e.target.value)} autoComplete="off" spellCheck={false} />
              <button className="key-toggle" onClick={() => toggleK('g')}>{showK.g ? 'Hide' : 'Show'}</button>
            </div>
          </div>

          <div className="field" style={{ marginBottom: 0 }}>
            <label>
              OpenAI API Key
              <span className="key-badge kb-openai">DALL-E 3 only</span>
            </label>
            <div className="key-row">
              <input type={showK.o ? 'text' : 'password'} placeholder="sk-…" value={cfg.openaiKey}
                onChange={e => set('openaiKey', e.target.value)} autoComplete="off" spellCheck={false} />
              <button className="key-toggle" onClick={() => toggleK('o')}>{showK.o ? 'Hide' : 'Show'}</button>
            </div>
          </div>

          <div className="key-note">
            Keys are saved in your browser's localStorage and sent directly to each API — they never pass through any server.<br />
            <a href="https://console.anthropic.com" target="_blank" rel="noopener">Anthropic Console</a> ·{' '}
            <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener">Google AI Studio</a> ·{' '}
            <a href="https://platform.openai.com/api-keys" target="_blank" rel="noopener">OpenAI Platform</a>
          </div>
        </div>

        {/* Model & image settings */}
        <div className="card">
          <div className="section-title">AI Models</div>

          <div className="row2">
            <div className="field">
              <label>Text model</label>
              <select value={cfg.textModel} onChange={e => set('textModel', e.target.value)}>
                <optgroup label="── Anthropic (Claude) ──">
                  {TEXT_MODELS.filter(m => m.provider === 'anthropic').map(m =>
                    <option key={m.id} value={m.id}>{m.label}</option>
                  )}
                </optgroup>
                <optgroup label="── Google (Gemini) ──">
                  {TEXT_MODELS.filter(m => m.provider === 'google').map(m =>
                    <option key={m.id} value={m.id}>{m.label}</option>
                  )}
                </optgroup>
              </select>
              {provider === 'anthropic' && !cfg.anthropicKey.trim() && (
                <div style={{ fontSize:11, color:'#f59e0b', marginTop:4 }}>↑ Add Anthropic key above</div>
              )}
              {provider === 'google' && !cfg.googleKey.trim() && (
                <div style={{ fontSize:11, color:'#22c55e', marginTop:4 }}>↑ Add Google AI key above</div>
              )}
            </div>
            <div className="field">
              <label>Chapter illustrations</label>
              <select value={cfg.imageProvider} onChange={e => set('imageProvider', e.target.value)}>
                {IMAGE_PROVIDERS.map(p => <option key={p.id} value={p.id}>{p.label}</option>)}
              </select>
              {cfg.imageProvider === 'dalle' && !cfg.openaiKey.trim() && (
                <div style={{ fontSize:11, color:'#3b82f6', marginTop:4 }}>↑ Add OpenAI key above</div>
              )}
              {cfg.imageProvider === 'imagen' && !cfg.googleKey.trim() && (
                <div style={{ fontSize:11, color:'#22c55e', marginTop:4 }}>↑ Add Google AI key above</div>
              )}
            </div>
          </div>
        </div>

        {/* Book settings */}
        <div className="card">
          <div className="section-title">Book</div>

          <div className="field">
            <label>Prompt — describe your book</label>
            <textarea value={cfg.prompt} onChange={e => set('prompt', e.target.value)}
              placeholder="E.g. A retired detective in 1940s Chicago discovers her long-lost sister is the prime suspect in a high-profile murder. A story of loyalty, betrayal, and the price of truth." />
          </div>

          <div className="row2">
            <div className="field">
              <label>Genre</label>
              <select value={cfg.genre} onChange={e => set('genre', e.target.value)}>
                {GENRES.map(g => <option key={g}>{g}</option>)}
              </select>
            </div>
            <div className="field">
              <label>Author / Pen Name</label>
              <input type="text" placeholder="Your name" value={cfg.author} onChange={e => set('author', e.target.value)} />
            </div>
          </div>

          <div className="row2">
            <div className="field">
              <label>Chapters: {cfg.chapterCount}</label>
              <input type="range" min={3} max={20} value={cfg.chapterCount} onChange={e => set('chapterCount', +e.target.value)} />
            </div>
            <div className="field">
              <label>Words / chapter: ~{cfg.wordsPerChapter.toLocaleString()}</label>
              <input type="range" min={400} max={4000} step={100} value={cfg.wordsPerChapter} onChange={e => set('wordsPerChapter', +e.target.value)} />
            </div>
          </div>
        </div>

        <div style={{ fontSize:12, color:'#252c46', textAlign:'center', marginBottom:14, lineHeight:1.7 }}>
          ~{totalWords.toLocaleString()} words · ~{estMins} min to generate
          {cfg.imageProvider === 'dalle' && ' · ~$' + (cfg.chapterCount * 0.04).toFixed(2) + ' for DALL-E images'}
        </div>

        <button className="btn btn-purple btn-wide" disabled={!canStart} onClick={start}>
          ✨ Generate Book
        </button>
        {missingKey && (
          <div style={{ fontSize:11, color:'#252c46', textAlign:'center', marginTop:8 }}>
            Add your {missingKey} to start.
          </div>
        )}
        {!missingKey && cfg.prompt.trim().length <= 10 && (
          <div style={{ fontSize:11, color:'#252c46', textAlign:'center', marginTop:8 }}>
            Enter a prompt to start.
          </div>
        )}
      </div>
    </>
  );

  // ── Generating ───────────────────────────────────────────────────────────────
  if (step === 'generating') return (
    <>
      <style>{CSS}</style>
      <div className="wrap">
        <div className="hd">
          <div className="logo">AI Book <em>Creator</em></div>
          <div className="sub">Generating your book — this takes a few minutes.</div>
        </div>
        <div className="card">
          <div className="prog-stage">
            {prog.stage === 'outline' ? 'Building outline'
              : prog.stage === 'chapter' ? 'Writing chapters'
              : prog.stage === 'images' ? 'Generating illustrations'
              : prog.stage === 'done' ? 'Done!' : 'Starting…'}
          </div>
          <div className="prog-msg">{prog.msg || '…'}</div>
          <div className="prog-bar-wrap"><div className="prog-bar" style={{ width: `${prog.pct}%` }} /></div>
          {prog.steps > 0 && <div className="prog-steps">{prog.step} of {prog.steps}</div>}
        </div>
        {book && (
          <div className="card">
            {book.title && (
              <div style={{ marginBottom: 14 }}>
                <div style={{ fontSize: 16, fontWeight: 700, color: '#dde1f0' }}>{book.title}</div>
                {book.subtitle && <div style={{ fontSize: 12, color: '#6b7aaa', marginTop: 2 }}>{book.subtitle}</div>}
              </div>
            )}
            <div className="gen-feed">
              {(book.chapters || []).map((ch, i) => (
                <div key={i} className="gen-row done">
                  <div className="dot" />
                  <span style={{ flex: 1 }}>Ch {ch.number}: {ch.title}</span>
                  {ch.imageUrl && <span style={{ fontSize: 10, opacity: .6 }}>🖼 image</span>}
                </div>
              ))}
              {(prog.stage === 'chapter' || prog.stage === 'images') && (
                <div className="gen-row active">
                  <div className="dot" />
                  <span>{prog.stage === 'images' ? `Illustrating Ch ${prog.step}…` : `Writing Ch ${prog.step}…`}</span>
                </div>
              )}
            </div>
          </div>
        )}
      </div>
    </>
  );

  // ── Done ─────────────────────────────────────────────────────────────────────
  return (
    <>
      <style>{CSS}</style>
      <div className="wrap">
        <a href="../../" className="back">← Tools</a>
        <div className="hd"><div className="logo">AI Book <em>Creator</em></div></div>

        {error && <div className="card err-card" style={{ marginBottom: 14 }}><div className="err-msg">⚠ {error}</div></div>}

        {book && (
          <>
            <div className="card">
              <div className="bk-meta">
                <div className="bk-title">{book.title}</div>
                {book.subtitle && <div className="bk-sub">{book.subtitle}</div>}
                <div className="bk-author">by {book.author}</div>
                {book.description && <div className="bk-desc">{book.description}</div>}
                <div className="bk-stats">
                  {book.chapters.length} chapters · ~{book.chapters.reduce((s, c) => s + c.content.split(/\s+/).length, 0).toLocaleString()} words
                  {book.chapters.some(c => c.imageUrl) && ` · ${book.chapters.filter(c => c.imageUrl).length} illustrations`}
                </div>
              </div>

              <div className="section-title">Export PDF</div>
              <div className="export-bar">
                <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                  <span style={{ fontSize:12, color:'#6b7aaa', whiteSpace:'nowrap' }}>Trim size:</span>
                  <select value={exportTrim} onChange={e => setExportTrim(e.target.value)} style={{ width:'auto' }}>
                    {TRIM_SIZES.map(t => <option key={t.id} value={t.id}>{t.label}</option>)}
                  </select>
                </div>
                <button className="btn btn-green" onClick={downloadPDF} disabled={buildingPdf}>
                  {buildingPdf ? '⏳ Building…' : '📥 Download PDF'}
                </button>
                <button className="btn btn-ghost" onClick={() => { setStep('setup'); setBook(null); }}>↺ New Book</button>
              </div>
              <div className="kdp-note">
                PDF includes: title page · copyright · table of contents · formatted chapters with page numbers.<br />
                Upload to <a href="https://kdp.amazon.com" target="_blank" rel="noopener" style={{ color:'#404870' }}>kdp.amazon.com</a> → use their interior file checker and online previewer before publishing.<br />
                Images from DALL-E/Imagen are ~216 DPI at full text width — suitable for ebook; for print, 300+ DPI is ideal.
              </div>
            </div>

            <div className="card">
              <div className="section-title">Chapters — click to read or edit</div>
              <div className="ch-list">
                {book.chapters.map((ch, i) => (
                  <ChapterItem key={i} ch={ch} onUpdate={u => updateChapter(i, u)} />
                ))}
              </div>
            </div>
          </>
        )}
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
