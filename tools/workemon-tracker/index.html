// ─── Utilities ────────────────────────────────────────────────────────────────
const money = (n) => (n < 0 ? "-$" : "$") + Math.abs(Math.round(n)).toLocaleString();

// State is encoded in the URL hash with LZ-string AND mirrored to localStorage.
function tryDecode(compressed) {
  try {
    const json = LZString.decompressFromEncodedURIComponent(compressed);
    return json ? JSON.parse(json) : null;
  } catch { return null; }
}

function migrateState(state) {
  if (!state) return state;
  return {
    ...state,
    goldRate: state.goldRate ?? 200,
    expRate: state.expRate ?? 200,
    roster: (state.roster || []).map(w => ({
      id: w.id || uid(),
      name: w.name || "",
      position: w.position === "" || w.position == null ? null : +w.position,
      annualSalary: +w.annualSalary || 0,
      gold: +w.gold || 0,
      exp: +w.exp || 0,
    })),
  };
}

function resolveInitialState() {
  const hash = window.location.hash.replace(/^#/, "");
  if (hash) {
    const state = tryDecode(hash);
    if (state) {
      const migrated = migrateState(state);
      try { localStorage.setItem(LS_KEY, hash); } catch {}
      return { state: migrated, hasData: true, source: "url" };
    }
  }
  try {
    const saved = localStorage.getItem(LS_KEY);
    if (saved) {
      const state = tryDecode(saved);
      if (state) {
        const migrated = migrateState(state);
        window.history.replaceState(null, "", "#" + saved);
        return { state: migrated, hasData: true, source: "local" };
      }
    }
  } catch {}
  return { state: null, hasData: false, source: null };
}

function encodeToUrl(state) {
  const compressed = LZString.compressToEncodedURIComponent(JSON.stringify(state));
  window.history.replaceState(null, "", "#" + compressed);
  try { localStorage.setItem(LS_KEY, compressed); } catch {}
}

// Computes derived stats for every Workemon and ranks by profitability (DIFF desc).
function computeRoster(roster, goldRate, expRate) {
  return roster
    .map(w => {
      const annual = w.annualSalary || 0;
      const monthlySalary = Math.floor(annual / 12);
      const goldValue = (w.gold || 0) * goldRate;
      const expValue = (w.exp || 0) * expRate;
      const totalValue = goldValue + expValue;
      const diff = totalValue - monthlySalary;
      const ratio = monthlySalary > 0 ? totalValue / monthlySalary : null;
      // Breakeven raise %: how big a raise could this Workemon absorb before flipping unprofitable.
      const maxRaisePct = annual > 0 ? (totalValue * 12 / annual - 1) * 100 : null;
      return { ...w, monthlySalary, goldValue, expValue, totalValue, diff, ratio, maxRaisePct };
    })
    .sort((a, b) => b.diff - a.diff)
    .map((w, i) => ({ ...w, rank: i + 1 }));
}

// ─── Share Bar ────────────────────────────────────────────────────────────────
function ShareBar({ urlStamp, onNew }) {
  const [copied, setCopied] = useState(false);
  const url = window.location.href; // read at render; urlStamp re-triggers render on each save

  const copy = async () => {
    try { await navigator.clipboard.writeText(url); } catch { return; }
    setCopied(true);
    setTimeout(() => setCopied(false), 2000);
  };

  return (
    <div className="wm-share">
      <span style={{ fontSize:13 }}>🔗</span>
      <span className="wm-share-url">{url}</span>
      <button className={`wm-share-copy${copied ? " ok" : ""}`} onClick={copy}>
        {copied ? "✓ Copied" : "Copy link"}
      </button>
      <span className="wm-share-note">Copy after each update to save the latest</span>
      <button onClick={onNew} style={{ background:"none", border:"none", fontSize:12, color:"#94a3b8", cursor:"pointer", padding:0, whiteSpace:"nowrap" }}>
        Reset roster
      </button>
    </div>
  );
}

// ─── Main App ─────────────────────────────────────────────────────────────────
function MainApp({ initialData, onNew, source }) {
  const [roster, setRosterRaw]   = useState(initialData.roster || []);
  const [goldRate, setGoldRate]  = useState(initialData.goldRate ?? 200);
  const [expRate, setExpRate]    = useState(initialData.expRate ?? 200);
  const [urlStamp, setUrlStamp]  = useState(0);
  const [setupOpen, setSetupOpen] = useState(source !== "url");
  const [raisePct, setRaisePct]  = useState(10);
  const [isMobile, setIsMobile]  = useState(() => window.innerWidth <= 700);

  useEffect(() => {
    const onResize = () => setIsMobile(window.innerWidth <= 700);
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);

  const [editId, setEditId]     = useState("");
  const [fName, setFName]       = useState("");
  const [fPosition, setFPosition] = useState("");
  const [fSalary, setFSalary]   = useState("");
  const [fGold, setFGold]       = useState("");
  const [fExp, setFExp]         = useState("");
  const nameRef   = useRef(null);
  const uploadRef = useRef(null);

  const rosterRef = useRef(roster);
  const goldRateRef = useRef(goldRate);
  const expRateRef = useRef(expRate);
  rosterRef.current = roster;
  goldRateRef.current = goldRate;
  expRateRef.current = expRate;

  const save = useCallback((r, g, e) => {
    encodeToUrl({ roster: r, goldRate: g, expRate: e });
    setUrlStamp(n => n + 1);
  }, []);

  const setRoster = (r) => { setRosterRaw(r); save(r, goldRateRef.current, expRateRef.current); };
  const commitGoldRate = (g) => { setGoldRate(g); save(rosterRef.current, g, expRateRef.current); };
  const commitExpRate  = (e) => { setExpRate(e); save(rosterRef.current, goldRateRef.current, e); };

  const ranked = useMemo(() => computeRoster(roster, goldRate, expRate), [roster, goldRate, expRate]);

  const summary = useMemo(() => {
    const headcount = ranked.length;
    const profitable = ranked.filter(w => w.diff >= 0).length;
    const totalPayroll = ranked.reduce((s, w) => s + w.monthlySalary, 0);
    const totalValue = ranked.reduce((s, w) => s + w.totalValue, 0);
    return { headcount, profitable, totalPayroll, totalValue, net: totalValue - totalPayroll };
  }, [ranked]);

  const simulation = useMemo(() => {
    const mult = 1 + raisePct / 100;
    let flips = 0, projectedPayroll = 0;
    ranked.forEach(w => {
      const projMonthly = Math.floor((w.annualSalary * mult) / 12);
      projectedPayroll += projMonthly;
      if (w.diff >= 0 && (w.totalValue - projMonthly) < 0) flips += 1;
    });
    return { projectedPayroll, projectedNet: summary.totalValue - projectedPayroll, flips };
  }, [ranked, raisePct, summary.totalValue]);

  const resetForm = () => { setEditId(""); setFName(""); setFPosition(""); setFSalary(""); setFGold(""); setFExp(""); };

  const startEdit = (w) => {
    setEditId(w.id); setFName(w.name); setFPosition(w.position == null ? "" : String(w.position));
    setFSalary(String(w.annualSalary));
    setFGold(String(w.gold || 0)); setFExp(String(w.exp || 0));
    setSetupOpen(true);
    nameRef.current?.focus();
  };

  const submitForm = () => {
    const name = fName.trim();
    const salary = parseFloat(fSalary);
    const gold = parseFloat(fGold) || 0;
    const exp = parseFloat(fExp) || 0;
    const position = fPosition.trim() === "" ? null : parseInt(fPosition, 10);
    if (!name || isNaN(salary) || salary <= 0) return;
    if (editId) {
      setRoster(roster.map(w => w.id === editId ? { ...w, name, position, annualSalary: salary, gold, exp } : w));
    } else {
      setRoster([...roster, { id: uid(), name, position, annualSalary: salary, gold, exp }]);
    }
    resetForm();
  };

  const removeWorkemon = (id) => {
    setRoster(roster.filter(w => w.id !== id));
    if (editId === id) resetForm();
  };

  const downloadJson = () => {
    const json = JSON.stringify({ roster, goldRate, expRate }, null, 2);
    const blob = new Blob([json], { type: "application/json" });
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = blobUrl; a.download = "workemon-roster.json"; a.click();
    URL.revokeObjectURL(blobUrl);
  };

  const handleUpload = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!Array.isArray(data.roster)) throw new Error("Invalid");
        const migrated = migrateState(data);
        setRosterRaw(migrated.roster);
        setGoldRate(migrated.goldRate);
        setExpRate(migrated.expRate);
        save(migrated.roster, migrated.goldRate, migrated.expRate);
      } catch {
        alert("Could not read file. Make sure it's a valid roster JSON.");
      }
      e.target.value = "";
    };
    reader.readAsText(file);
  };

  const rankIcon = r => ["🥇","🥈","🥉"][r-1] ?? r;

  return (
    <>
      <style>{CSS}</style>
      <div className="wm">
        <div className="wm-hd">
          <a href="../../" className="wm-back">← Tools</a>
          <div>
            <h1 className="wm-title">Workemon Tracker</h1>
            <p className="wm-sub">Track each Workemon's salary vs. GOLD/EXP earnings, rank by profitability, and simulate year-end raises</p>
          </div>
          <ShareBar urlStamp={urlStamp} onNew={onNew} />
          <div className="wm-io-bar">
            <button className="wm-io-btn" onClick={downloadJson}>↓ Download JSON</button>
            <label className="wm-io-btn">
              ↑ Upload JSON
              <input ref={uploadRef} type="file" accept=".json,application/json" style={{ display:"none" }} onChange={handleUpload} />
            </label>
          </div>
        </div>

        <div className="wm-main">

          {/* Company Overview */}
          <div className="wm-stats">
            <div className="wm-stat">
              <div className="wm-stat-lbl">Headcount</div>
              <div className="wm-stat-val">{summary.headcount}</div>
            </div>
            <div className="wm-stat">
              <div className="wm-stat-lbl">Profitable</div>
              <div className="wm-stat-val" style={{ color: summary.profitable === summary.headcount ? "#16a34a" : "#0f172a" }}>
                {summary.profitable} / {summary.headcount}
              </div>
            </div>
            <div className="wm-stat">
              <div className="wm-stat-lbl">Monthly Payroll</div>
              <div className="wm-stat-val">{money(summary.totalPayroll)}</div>
            </div>
            <div className="wm-stat">
              <div className="wm-stat-lbl">Monthly Value Earned</div>
              <div className="wm-stat-val">{money(summary.totalValue)}</div>
            </div>
            <div className="wm-stat">
              <div className="wm-stat-lbl">Net Company Profit</div>
              <div className="wm-stat-val" style={{ color: summary.net >= 0 ? "#16a34a" : "#dc2626" }}>{money(summary.net)}</div>
            </div>
          </div>

          {/* Raise Simulator */}
          <div className="wm-card">
            <div className="wm-card-hd">Year-End Raise Simulator</div>
            <label className="wm-lbl">Simulated raise for everyone: <strong style={{ color:"#0f172a" }}>{raisePct}%</strong></label>
            <input
              className="wm-slider" type="range" min="0" max="25" step="1"
              value={raisePct} onChange={e => setRaisePct(+e.target.value)}
            />
            <div className="wm-sim-summary">
              <span>Projected monthly payroll: <strong style={{ color:"#0f172a" }}>{money(simulation.projectedPayroll)}</strong></span>
              <span>Projected net profit: <strong style={{ color: simulation.projectedNet >= 0 ? "#16a34a" : "#dc2626" }}>{money(simulation.projectedNet)}</strong></span>
              <span>Would flip unprofitable: <strong style={{ color: simulation.flips > 0 ? "#dc2626" : "#16a34a" }}>{simulation.flips}</strong></span>
            </div>
          </div>

          {/* Roster Table */}
          <div className="wm-card" style={{ padding:0 }}>
            <div style={{ padding:"20px 20px 4px" }}>
              <div className="wm-card-hd" style={{ marginBottom:4 }}>Roster — Ranked by Profitability</div>
            </div>
            {ranked.length === 0 ? (
              <div className="wm-empty">Add a Workemon below to get started</div>
            ) : (
              <div className="wm-tbl-wrap">
                <table className="wm-tbl">
                  <thead>
                    <tr>
                      <th style={{ width:40 }}>#</th>
                      <th className="tr" style={{ width:56 }}>Desk</th>
                      <th>Name</th>
                      <th className="tr">Annual Salary</th>
                      {!isMobile && <th className="tr">Monthly Salary</th>}
                      {!isMobile && <th className="tr">GOLD</th>}
                      {!isMobile && <th className="tr">EXP</th>}
                      <th className="tr">Value Earned</th>
                      <th className="tr">DIFF</th>
                      {!isMobile && <th className="tr">Ratio</th>}
                      {!isMobile && <th className="tr">Max Raise %</th>}
                      <th style={{ width:110 }}></th>
                    </tr>
                  </thead>
                  <tbody>
                    {ranked.map(w => {
                      const willFlip = w.diff >= 0 && raisePct > 0 && w.maxRaisePct !== null && w.maxRaisePct < raisePct;
                      return (
                        <tr key={w.id}>
                          <td><span className={`wm-badge${w.rank <= 3 ? ` r${w.rank}` : " rn"}`}>{rankIcon(w.rank)}</span></td>
                          <td className="tr" style={{ color:"#94a3b8" }}>{w.position == null ? "—" : w.position}</td>
                          <td>
                            <span style={{ fontWeight:500 }}>{w.name}</span>
                            {w.diff < 0 && <span className="wm-tag bad">unprofitable</span>}
                            {willFlip && <span className="wm-tag warn">flips at +{raisePct}%</span>}
                          </td>
                          <td className="tr">{money(w.annualSalary)}</td>
                          {!isMobile && <td className="tr" style={{ color:"#64748b" }}>{money(w.monthlySalary)}</td>}
                          {!isMobile && <td className="tr" style={{ color:"#64748b" }}>{w.gold || 0}</td>}
                          {!isMobile && <td className="tr" style={{ color:"#64748b" }}>{w.exp || 0}</td>}
                          <td className="tr">{money(w.totalValue)}</td>
                          <td className="tr" style={{ fontWeight:600, color: w.diff >= 0 ? "#16a34a" : "#dc2626" }}>{money(w.diff)}</td>
                          {!isMobile && <td className="tr" style={{ color:"#64748b" }}>{w.ratio === null ? "—" : w.ratio.toFixed(2) + "×"}</td>}
                          {!isMobile && (
                            <td className="tr" style={{ color: w.maxRaisePct === null ? "#94a3b8" : w.maxRaisePct < 0 ? "#dc2626" : "#64748b" }}>
                              {w.maxRaisePct === null ? "—" : w.maxRaisePct.toFixed(1) + "%"}
                            </td>
                          )}
                          <td className="tr">
                            <div style={{ display:"flex", gap:6, justifyContent:"flex-end" }}>
                              <button className="wm-btn wm-btn-edit" onClick={() => startEdit(w)}>Edit</button>
                              <button className="wm-btn wm-btn-del" onClick={() => removeWorkemon(w.id)}>✕</button>
                            </div>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}
          </div>

          <div>
            <button className="wm-setup-toggle" onClick={() => setSetupOpen(o => !o)}>
              <span className={`wm-setup-toggle-chevron${setupOpen ? " open" : ""}`}>▶</span>
              Manage Roster &amp; Settings
            </button>
            {setupOpen && <div className="wm-grid2">

              {/* Add / Edit Workemon */}
              <div className="wm-card">
                <div className="wm-card-hd">{editId ? "Edit Workemon" : "Add Workemon"}</div>
                <div style={{ display:"flex", gap:8 }}>
                  <div className="wm-field" style={{ flex:1 }}>
                    <label className="wm-lbl">Name</label>
                    <input ref={nameRef} className="wm-inp" placeholder="Workemon name" maxLength={40}
                      value={fName} onChange={e => setFName(e.target.value)}
                      onKeyDown={e => e.key === "Enter" && submitForm()} />
                  </div>
                  <div className="wm-field" style={{ width:84 }}>
                    <label className="wm-lbl">Desk #</label>
                    <input className="wm-inp" type="number" min={1} step={1} placeholder="—"
                      value={fPosition} onChange={e => setFPosition(e.target.value)}
                      onKeyDown={e => e.key === "Enter" && submitForm()} />
                  </div>
                </div>
                <div className="wm-field">
                  <label className="wm-lbl">Annual Salary ($)</label>
                  <input className="wm-inp" type="number" min={0} step={1} placeholder="0"
                    value={fSalary} onChange={e => setFSalary(e.target.value)}
                    onKeyDown={e => e.key === "Enter" && submitForm()} />
                </div>
                <div style={{ display:"flex", gap:8 }}>
                  <div className="wm-field" style={{ flex:1 }}>
                    <label className="wm-lbl">GOLD earned / mo</label>
                    <input className="wm-inp" type="number" min={0} step={1} placeholder="0"
                      value={fGold} onChange={e => setFGold(e.target.value)}
                      onKeyDown={e => e.key === "Enter" && submitForm()} />
                  </div>
                  <div className="wm-field" style={{ flex:1 }}>
                    <label className="wm-lbl">EXP earned / mo</label>
                    <input className="wm-inp" type="number" min={0} step={1} placeholder="0"
                      value={fExp} onChange={e => setFExp(e.target.value)}
                      onKeyDown={e => e.key === "Enter" && submitForm()} />
                  </div>
                </div>
                <div style={{ display:"flex", gap:8 }}>
                  <button className="wm-btn wm-btn-g" style={{ flex:1 }}
                    disabled={!fName.trim() || !fSalary} onClick={submitForm}>
                    {editId ? "Save Changes" : "+ Add Workemon"}
                  </button>
                  {editId && <button className="wm-btn wm-btn-sec" onClick={resetForm}>Cancel</button>}
                </div>
                <p style={{ fontSize:12, color:"#94a3b8", marginTop:8 }}>
                  Enter the current GOLD or EXP earn rate after training — the tool doesn't need to know training mechanics, just the result.
                </p>
              </div>

              {/* Settings + list */}
              <div className="wm-card">
                <div className="wm-card-hd">Settings</div>
                <div style={{ display:"flex", gap:8 }}>
                  <div className="wm-field" style={{ flex:1 }}>
                    <label className="wm-lbl">$ value per GOLD point</label>
                    <input className="wm-inp" type="number" min={0} step={1}
                      value={goldRate} onChange={e => commitGoldRate(+e.target.value || 0)} />
                  </div>
                  <div className="wm-field" style={{ flex:1 }}>
                    <label className="wm-lbl">$ value per EXP point</label>
                    <input className="wm-inp" type="number" min={0} step={1}
                      value={expRate} onChange={e => commitExpRate(+e.target.value || 0)} />
                  </div>
                </div>
                <p style={{ fontSize:12, color:"#94a3b8", marginBottom:10 }}>
                  Matches the spreadsheet's shared multiplier (200) — adjust if your game's exchange rate changes.
                </p>
                {roster.length > 0 && (
                  <div className="wm-clist">
                    {roster.map(w => (
                      <div key={w.id} className="wm-citem">
                        <span style={{ fontWeight:500 }}>{w.name}</span>
                        <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                          <span style={{ color:"#64748b" }}>{money(w.annualSalary)}/yr</span>
                          <button className="wm-btn wm-btn-del" onClick={() => removeWorkemon(w.id)}>✕</button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>

            </div>}
          </div>

        </div>
      </div>
    </>
  );
}

// ─── Root ─────────────────────────────────────────────────────────────────────
function App() {
  const { state: initialState, hasData, source: initialSource } = useMemo(resolveInitialState, []);
  const [phase, setPhase]         = useState(hasData ? "ready" : "landing");
  const [appKey, setAppKey]       = useState(0);
  const [loadedState, setLoaded]  = useState(initialState);
  const [loadedSource, setSource] = useState(initialSource);
  const [importUrl, setImportUrl] = useState("");
  const [importErr, setImportErr] = useState("");

  const handleCreate = () => {
    const state = EMPTY;
    encodeToUrl(state);
    setLoaded(state);
    setSource(null);
    setPhase("ready");
    setAppKey(k => k + 1);
  };

  const handleNew = () => {
    if (!window.confirm("Reset the roster back to the starter example data? Your current roster will still be accessible via its URL.")) return;
    try { localStorage.removeItem(LS_KEY); } catch {}
    window.history.replaceState(null, "", window.location.pathname);
    setImportUrl("");
    setImportErr("");
    setPhase("landing");
    setAppKey(k => k + 1);
  };

  const handleLoadUrl = () => {
    setImportErr("");
    const raw = importUrl.trim();
    let hash = "";
    try {
      const u = new URL(raw);
      hash = u.hash.replace(/^#/, "");
    } catch {
      hash = raw.replace(/^#/, "");
    }
    if (!hash) { setImportErr("No roster data found in that URL."); return; }
    const state = tryDecode(hash);
    if (!state) { setImportErr("Couldn't decode roster data — make sure you copied the full URL."); return; }
    const migrated = migrateState(state);
    encodeToUrl(migrated);
    setLoaded(migrated);
    setSource("url");
    setPhase("ready");
    setAppKey(k => k + 1);
  };

  if (phase === "landing") return (
    <>
      <style>{CSS}</style>
      <div className="wm">
        <div style={{ maxWidth:1040, margin:"0 auto", padding:"24px 16px 0" }}>
          <a href="../../" className="wm-back">← Tools</a>
        </div>
        <div className="wm-landing">
          <div className="wm-landing-icon">🪙</div>
          <div className="wm-landing-title">Workemon Tracker</div>
          <div className="wm-landing-desc">
            Track each Workemon's salary against what they earn in GOLD or EXP, rank the roster by profitability,
            and simulate year-end raises to see who'd stop being worth keeping. Comes pre-loaded with example data.
          </div>
          <button className="wm-btn wm-btn-g wm-btn-lg" onClick={handleCreate}>
            Start Tracking →
          </button>
          <div style={{ margin:"28px 0 0", borderTop:"1px solid #e2e8f0", paddingTop:24 }}>
            <p style={{ fontSize:13, color:"#64748b", marginBottom:10 }}>Or load an existing roster from a shared link:</p>
            <div style={{ display:"flex", gap:8 }}>
              <input
                className="wm-inp"
                placeholder="Paste roster URL here…"
                value={importUrl}
                onChange={e => { setImportUrl(e.target.value); setImportErr(""); }}
                onKeyDown={e => e.key === "Enter" && handleLoadUrl()}
                style={{ flex:1, fontSize:13 }}
              />
              <button
                className="wm-btn wm-btn-g"
                onClick={handleLoadUrl}
                disabled={!importUrl.trim()}
                style={{ whiteSpace:"nowrap" }}
              >
                Load →
              </button>
            </div>
            {importErr && <p style={{ fontSize:12, color:"#dc2626", marginTop:8 }}>{importErr}</p>}
          </div>
        </div>
      </div>
    </>
  );

  return <MainApp key={appKey} initialData={loadedState || EMPTY} onNew={handleNew} source={loadedSource} />;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
