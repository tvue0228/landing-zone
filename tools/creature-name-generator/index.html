  padding: 5px 11px; border-radius: 18px;

.pill.selected {

}

.gen-btn:active:not(:disabled) { transform: scale(0.98); }

// ─── Name blending engine ─────────────────────────────────────────────────────

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function titleCase(s) {
  return s.charAt(0).toUpperCase() + s.slice(1).toLowerCase();
}

// Remove double vowels when joining (charr → char, etc.)
function smoothJoin(a, b) {
  const vowels = 'aeiou';
  a = a.toLowerCase(); b = b.toLowerCase();
  // Drop trailing vowel of a if b starts with same vowel
  if (a.slice(-1) === b[0] && vowels.includes(a.slice(-1))) {
    return a.slice(0, -1) + b;
  }
  return a + b;
}

const POKEMON_SUFFIXES  = ['eon','ite','ix','on','ax','ux','is','ar','us','oth','ine','ling'];
const DIGIMON_SUFFIXES  = ['mon','dramon','angemon','agumon','omon','remon','domon'];
const ORIGINAL_JOINER   = ['us','is','ar','ix','os','ra','ex','ax','on','um','an','ia'];

function generateNames(elem, creature, style, count = 8) {
  const results = [];
  const seen = new Set();

  const strategies = [
    // Classic Pokémon: elem prefix + creature suffix
    () => {
      const a = pick(elem.pre), b = pick(creature.suf);
      const name = titleCase(a + b);
      return { name, a, aLabel: elem.label, b, bLabel: creature.label,
               note: 'element start + creature end' };
    },
    // Reverse: creature prefix + elem suffix
    () => {
      const a = pick(creature.pre), b = pick(elem.suf);
      const name = titleCase(a + b);
      return { name, a, aLabel: creature.label, b, bLabel: elem.label,
               note: 'creature start + element end' };
    },
    // Short elem prefix + creature suffix
    () => {
      const ep = pick(elem.pre);
      const a = ep.length > 4 ? ep.slice(0, Math.ceil(ep.length / 2)) : ep;
      const b = pick(creature.suf);
      const name = titleCase(a + b);
      return { name, a, aLabel: elem.label, b, bLabel: creature.label,
               note: 'short element + creature end' };
    },
    // Style-specific suffix
    () => {
      const a = pick(elem.pre);
      let b, bLabel;
      if (style === 'digimon')       { b = pick(DIGIMON_SUFFIXES);  bLabel = 'Digimon suffix'; }
      else if (style === 'pokemon')  { b = pick(POKEMON_SUFFIXES);  bLabel = 'Pokémon suffix'; }
      else                           { b = pick(ORIGINAL_JOINER);   bLabel = 'fusion suffix'; }
      const name = titleCase(a + b);
      return { name, a, aLabel: elem.label, b, bLabel,
               note: `element + ${style} suffix` };
    },
    // Creature prefix + style suffix
    () => {
      const a = pick(creature.pre);
      let b, bLabel;
      if (style === 'digimon')       { b = pick(DIGIMON_SUFFIXES);  bLabel = 'Digimon suffix'; }
      else if (style === 'pokemon')  { b = pick(POKEMON_SUFFIXES);  bLabel = 'Pokémon suffix'; }
      else                           { b = pick(elem.suf);          bLabel = elem.label + ' end'; }
      const name = titleCase(a + b);
      return { name, a, aLabel: creature.label, b, bLabel,
               note: `creature + ${style === 'original' ? 'element' : style} suffix` };
    },
    // Vowel-smoothed portmanteau
    () => {
      const a = pick(elem.pre), b = pick(creature.suf);
      const name = titleCase(smoothJoin(a, b));
      return { name, a, aLabel: elem.label, b, bLabel: creature.label,
               note: 'vowel-smoothed blend' };
    },
    // Creature prefix + elem prefix short combo
    () => {
      const cp = pick(creature.pre);
      const ep = pick(elem.pre);
      const epShort = ep.length > 3 ? ep.slice(0, 3) : ep;
      let tail;
      if (style === 'digimon')      tail = pick(DIGIMON_SUFFIXES);
      else if (style === 'pokemon') tail = pick(POKEMON_SUFFIXES);
      else                          tail = pick(ORIGINAL_JOINER);
      const name = titleCase(cp + epShort.toLowerCase() + tail);
      return { name, a: cp + epShort, aLabel: creature.label + ' × ' + elem.label, b: tail, bLabel: 'suffix',
               note: 'three-part fusion' };
    },
    // Full elem word clipped + creature clipped
    () => {
      const ep = pick(elem.pre);
      const cs = pick(creature.suf);
      // Take first half of ep + second half of cs
      const half1 = ep.slice(0, Math.max(2, Math.ceil(ep.length * 0.6)));
      const half2 = cs.slice(Math.max(0, Math.floor(cs.length * 0.4)));
      const name = titleCase(half1 + half2);
      return { name, a: half1, aLabel: elem.label, b: half2, bLabel: creature.label,
               note: 'clipped overlap blend' };
    },
  ];

  let attempts = 0;
  const maxAttempts = count * 12;

  while (results.length < count && attempts < maxAttempts) {
    attempts++;
    const strat = strategies[attempts % strategies.length];
    try {
      const r = strat();
      if (!seen.has(r.name) && r.name.length >= 4 && r.name.length <= 14) {
        seen.add(r.name);
        results.push(r);
      }
    } catch (_) {}
  }

  return results;
}

// ─── UI helpers ───────────────────────────────────────────────────────────────

function renderPills(containerId, items, selectedId, onClick) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  items.forEach(item => {
    const btn = document.createElement('button');
    btn.className = 'pill' + (item.id === selectedId ? ' selected' : '');
    if (item.color) btn.style.setProperty('--c', item.color);
    btn.innerHTML = `<span class="pill-icon">${item.icon}</span>${item.label}`;
    btn.addEventListener('click', () => onClick(item));
    container.appendChild(btn);
  });
}

function updateGenBtn() {
  document.getElementById('gen-btn').disabled = !(selElem && selCreature);
}

function renderResults(names, elem) {
  const section = document.getElementById('results-section');
  const grid    = document.getElementById('results-grid');
  grid.innerHTML = '';

  if (!names.length) { section.style.display = 'none'; return; }

  names.forEach(({ name, a, aLabel, b, bLabel, note }) => {
    const card = document.createElement('div');
    card.className = 'name-card';
    card.style.setProperty('--accent', elem.color);

    const copyBtn = document.createElement('button');
    copyBtn.className = 'copy-btn';
    copyBtn.textContent = 'copy';
    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(name).then(() => {
        copyBtn.textContent = 'copied!';
        copyBtn.classList.add('copied');
        setTimeout(() => { copyBtn.textContent = 'copy'; copyBtn.classList.remove('copied'); }, 1600);
      });
    });

    card.innerHTML = `
      <div class="name-main">${name}</div>
      <div class="name-breakdown">
        <span class="chunk-a">${a}</span> (${aLabel}) +
        <span class="chunk-b">${b}</span> (${bLabel})<br>
        <em>${note}</em>
      </div>
    `;
    card.appendChild(copyBtn);
    grid.appendChild(card);
  });

  section.style.display = 'block';
}

});

// Generate
document.getElementById('gen-btn').addEventListener('click', () => {
  if (!selElem || !selCreature) return;
  document.getElementById('empty-hint').style.display = 'none';
  const names = generateNames(selElem, selCreature, selStyle, 8);
  renderResults(names, selElem);
  document.getElementById('results-section').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
});
</script>
</body>
