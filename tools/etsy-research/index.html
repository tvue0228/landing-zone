// ─── Helpers ──────────────────────────────────────────────────────────────────
function loadTracker() {
  try { return JSON.parse(localStorage.getItem(LS_TRACKER) || "[]"); } catch { return []; }
}
function saveTracker(list) {
  try { localStorage.setItem(LS_TRACKER, JSON.stringify(list)); } catch {}
}

// ─── CompTag ─────────────────────────────────────────────────────────────────
function CompTag({ comp }) {
  const m = COMP_META[comp];
  return <span className="eh-tag" style={{ background: m.bg, color: m.color }}>{m.label}</span>;
}

  const [nicheId, setNicheId] = useState(NICHES[0].id);
  const [custom, setCustom] = useState("");
  const niche = NICHES.find(n => n.id === nicheId);
  const savedNames = new Set(tracked.map(t => t.name));

  const openCustom = () => {
    const q = custom.trim();
    if (!q) return;
    window.open(etsyUrl(q), "_blank", "noopener");
  };

  return (
    <div>
      {/* Niche selector */}
      <div className="eh-niche-bar">
        {NICHES.map(n => (
          <button
            key={n.id}
            className={`eh-niche-btn${nicheId === n.id ? " on" : ""}`}
            style={nicheId === n.id ? { background: n.color } : {}}
            onClick={() => setNicheId(n.id)}
          >
            {n.icon} {n.label}
          </button>
        ))}
      </div>

      {/* Niche tip */}
      <div className="eh-tip">
        <span className="eh-tip-icon">💡</span>
        <span><strong>{niche.desc}</strong> {niche.tip}</span>
      </div>

      {/* Trending keywords */}
      <div style={{ marginBottom: 8 }}>
        <div className="eh-section-hd">Trending searches — click to open in Etsy</div>
        <div className="eh-keywords">
          {niche.keywords.map(kw => (
            <a key={kw} className="eh-kw" href={etsyUrl(kw)} target="_blank" rel="noopener">
              🔍 {kw}
            </a>
          ))}
        </div>
      </div>

      {/* Product grid */}
      <div className="eh-section-hd">Product ideas — sorted by opportunity</div>
      <div className="eh-grid">
        {niche.products.map(p => {
          const already = savedNames.has(p.name);
          return (
            <div key={p.name} className="eh-card">
              <div className="eh-card-top">
                <div className="eh-card-name">{p.name}</div>
                <button
                  className={`eh-card-save${already ? " saved" : ""}`}
                  title={already ? "Remove from tracker" : "Save to tracker"}
                  onClick={() => already
                    ? onUnsave(p.name)
                    : onSave({ name: p.name, q: p.q, price: p.price, source: "browse", niche: niche.label })
                  }
                >
                  {already ? "★" : "☆"}
                </button>
              </div>
              <div className="eh-tags">
                <span className="eh-tag eh-tag-price">💰 {p.price}</span>
                <CompTag comp={p.comp} />
                {p.hot && <span className="eh-tag eh-tag-hot">🔥 Trending</span>}
              </div>
              <a className="eh-search-btn" href={etsyUrl(p.q)} target="_blank" rel="noopener">
                Search Etsy (best sellers) →
              </a>
            </div>
          );
        })}
      </div>

      {/* Custom search */}
      <div className="eh-custom-search">
        <div className="eh-section-hd">Custom search — generate a best-sellers URL for any idea</div>
        <div className="eh-cs-row">
          <input
            className="eh-cs-input"
            placeholder="e.g. personalized dog breed ornament"
            value={custom}
            onChange={e => setCustom(e.target.value)}
            onKeyDown={e => e.key === "Enter" && openCustom()}
          />
          <button className="eh-cs-btn" onClick={openCustom} disabled={!custom.trim()}>Open in Etsy →</button>
        </div>
      </div>
    </div>
  );
}

// ─── Live Search Tab ──────────────────────────────────────────────────────────
function LiveTab({ tracked, onSave, onUnsave }) {
  const [apiKey, setApiKey]     = useState(() => localStorage.getItem(LS_APIKEY) || "");
  const [query, setQuery]       = useState("");
  const [results, setResults]   = useState([]);
  const [loading, setLoading]   = useState(false);
  const [error, setError]       = useState("");
  const savedNames = new Set(tracked.map(t => t.name));

  const allKeywords = NICHES.flatMap(n => n.keywords).slice(0, 12);

  const fetch_ = useCallback(async (q) => {
    const key = apiKey.trim();
    const kw  = (q || query).trim();
    if (!key || !kw) return;
    localStorage.setItem(LS_APIKEY, key);
    setLoading(true); setError(""); setResults([]);
    try {
      const url = `https://openapi.etsy.com/v3/application/listings/active?keywords=${encodeURIComponent(kw)}&sort_on=score&sort_order=desc&limit=24&includes[]=Images`;
      const res = await fetch(url, { headers: { "x-api-key": key } });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.error_description || body.error || `HTTP ${res.status}`);
      }
      const data = await res.json();
      setResults(data.results || []);
    } catch (e) {
      setError(e.message.includes("fetch")
        ? "Network error — Etsy's API may block requests from this domain. Try opening the browser console for details."
        : e.message);
    } finally {
      setLoading(false);
    }
  }, [apiKey, query]);

  const fmtPrice = (p) => {
    if (!p) return "—";
    return `${p.currency_symbol || "$"}${(p.amount / p.divisor).toFixed(2)}`;
  };

  return (
    <div>
      <div className="eh-api-box">
        <div className="eh-api-label">🔑 Etsy API Key</div>
        <div className="eh-api-row">
          <input
            className="eh-api-input"
            type="password"
            placeholder="Paste your Etsy API keystring…"
            value={apiKey}
            onChange={e => setApiKey(e.target.value)}
          />
        </div>
        <div className="eh-api-note">
          Free key at <a href="https://www.etsy.com/developers/register" target="_blank" rel="noopener">etsy.com/developers/register</a> → Create app → copy <strong>Keystring</strong>. Saved locally, never leaves your browser.
        </div>

        <div style={{ marginTop: 16 }}>
          <div className="eh-api-label">Search</div>
          <div className="eh-api-row">
            <input
              className="eh-api-input"
              style={{ fontFamily: "inherit", fontSize: 14 }}
              placeholder="e.g. laser engraved cutting board personalized"
              value={query}
              onChange={e => setQuery(e.target.value)}
              onKeyDown={e => e.key === "Enter" && fetch_()}
            />
            <button className="eh-fetch-btn" onClick={() => fetch_()} disabled={!apiKey.trim() || !query.trim() || loading}>
              {loading ? "Fetching…" : "Fetch →"}
            </button>
          </div>
          <div className="eh-api-note" style={{ marginTop: 4 }}>Results sorted by Etsy's relevance score — a strong proxy for sales velocity.</div>
        </div>

        <div className="eh-api-kw-row" style={{ marginTop: 12 }}>
          <span style={{ fontSize: 12, color: "var(--text3)" }}>Quick:</span>
          {allKeywords.map(kw => (
            <button key={kw} className="eh-api-kw-pill" onClick={() => { setQuery(kw); fetch_(kw); }}>{kw}</button>
          ))}
        </div>
      </div>

      {error && <div className="eh-error">⚠️ {error}</div>}
      {loading && <div className="eh-loading">Loading listings…</div>}
      {!loading && !error && results.length === 0 && query && (
        <div className="eh-empty">No results — try a different keyword or check your API key.</div>
      )}
      {results.length > 0 && (
        <>
          <div className="eh-section-hd" style={{ marginBottom: 12 }}>{results.length} listings — sorted by relevance score</div>
          <div className="eh-live-grid">
            {results.map(r => {
              const img  = r.images?.[0]?.url_570xN || r.images?.[0]?.url_fullxfull;
              const name = r.title || "Untitled";
              const already = savedNames.has(name);
              return (
                <div key={r.listing_id} className="eh-live-card">
                  {img
                    ? <img className="eh-live-img" src={img} alt={name} loading="lazy" />
                    : <div className="eh-live-img" style={{ display:"flex", alignItems:"center", justifyContent:"center", fontSize:32 }}>🏷️</div>
                  }
                  <div className="eh-live-body">
                    <div className="eh-live-title">{name}</div>
                    <div className="eh-live-meta">
                      <span className="eh-live-favs">❤️ {(r.num_favorers || 0).toLocaleString()}</span>
                      <span className="eh-live-price">{fmtPrice(r.price)}</span>
                      <button
                        className={`eh-live-save${already ? " saved" : ""}`}
                        title={already ? "Remove" : "Save"}
                        onClick={() => already
                          ? onUnsave(name)
                          : onSave({ name, q: query, price: fmtPrice(r.price), source: "live", niche: "API search", url: r.url })
                        }
                      >
                        {already ? "★" : "☆"}
                      </button>
                    </div>
                    <a className="eh-live-link" href={r.url} target="_blank" rel="noopener">View on Etsy →</a>
                  </div>
                </div>
              );
            })}
          </div>
        </>
      )}
    </div>
  );
}

// ─── Research Tracker Tab ─────────────────────────────────────────────────────
function TrackerTab({ tracked, onNote, onUnsave }) {
  if (tracked.length === 0) return (
    <div className="eh-empty">
      No saved ideas yet.<br />
      <span style={{ fontSize: 13, marginTop: 6, display: "block" }}>Star items in Browse or Live Search to track them here.</span>
    </div>
  );
  return (
    <div>
      <div className="eh-section-hd">{tracked.length} saved idea{tracked.length !== 1 ? "s" : ""}</div>
      <div className="eh-tracker-list">
        {tracked.map((t, i) => (
          <div key={i} className="eh-tracker-item">
            <div className="eh-tracker-info">
              <div className="eh-tracker-name">{t.name}</div>
              <div className="eh-tracker-meta">{t.niche} · {t.price || "—"} · saved from {t.source}</div>
              <textarea
                className="eh-tracker-note"
                rows={2}
                placeholder="Add notes (price research, competition, ideas…)"
                value={t.note || ""}
                onChange={e => onNote(i, e.target.value)}
              />
              <a className="eh-tracker-open" href={etsyUrl(t.q || t.name)} target="_blank" rel="noopener">
                🔍 Search Etsy
              </a>
              {t.url && <a className="eh-tracker-open" href={t.url} target="_blank" rel="noopener" style={{ marginLeft: 12 }}>↗ View listing</a>}
            </div>
            <button className="eh-tracker-del" onClick={() => onUnsave(t.name)} title="Remove">✕</button>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── Root ─────────────────────────────────────────────────────────────────────
function App() {
  const [tab, setTab]         = useState(() => localStorage.getItem(LS_TAB) || "browse");
  const [tracked, setTracked] = useState(loadTracker);

  const switchTab = (t) => { setTab(t); localStorage.setItem(LS_TAB, t); };

  const saveTracked = (list) => { setTracked(list); saveTracker(list); };

  const onSave = (item) => {
    if (tracked.some(t => t.name === item.name)) return;
    saveTracked([...tracked, { ...item, note: "", savedAt: Date.now() }]);
  };
  const onUnsave = (name) => saveTracked(tracked.filter(t => t.name !== name));
  const onNote   = (i, note) => {
    const next = tracked.map((t, idx) => idx === i ? { ...t, note } : t);
    saveTracked(next);
  };

  return (
    <>
      <style>{CSS}</style>
      <div className="eh-wrap">
        <a href="../../" className="eh-back">← Tools</a>
        <div className="eh-header">
          <h1 className="eh-title">Etsy Research Hub</h1>
          <p className="eh-sub">Discover winning products in 6 high-opportunity niches — browse curated ideas or search live listings</p>
        </div>

        <div className="eh-tabs">
          {[
            ["browse",  "🔍 Browse Ideas"],
            ["live",    "📡 Live Search"],
            ["tracker", "📌 My Research"],
          ].map(([t, label]) => (
            <button key={t} className={`eh-tab${tab === t ? " on" : ""}`} onClick={() => switchTab(t)}>
              {label}
              {t === "tracker" && tracked.length > 0 && <span className="eh-tab-badge">{tracked.length}</span>}
            </button>
          ))}
        </div>

        {tab === "browse"  && <BrowseTab  tracked={tracked} onSave={onSave} onUnsave={onUnsave} />}
        {tab === "live"    && <LiveTab    tracked={tracked} onSave={onSave} onUnsave={onUnsave} />}
        {tab === "tracker" && <TrackerTab tracked={tracked} onNote={onNote} onUnsave={onUnsave} />}
      </div>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
