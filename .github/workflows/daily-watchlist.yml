name: Daily Watchlist

on:
  schedule:
    # 8:30 AM ET = 13:30 UTC (standard time) / 12:30 UTC (daylight saving)
    # Using 13:30 UTC — runs ~30 min before US open, before DST shift it's 8:30 AM ET
    - cron: "30 13 * * 1-5"
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run screener
        run: python scripts/daily_watchlist.py

      - name: Commit watchlist
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: daily watchlist update [skip ci]"
          file_pattern: data/daily-watchlist.json
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
