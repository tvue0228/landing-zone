  <text x="905" y="100" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#2a3050" letter-spacing="2.5" font-weight="600">GUESS BOARD</text>

  <!-- ── Row 1 (done: 1 orange, 1 white) -->
  <rect x="716" y="112" width="378" height="58" rx="10" fill="#ffffff" fill-opacity="0.03"/>
  <text x="736" y="147" font-family="monospace" font-size="13" fill="#2a3050" font-weight="700">1</text>
