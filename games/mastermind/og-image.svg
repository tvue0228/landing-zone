  <circle cx="838" cy="141" r="20" fill="url(#pB)"/>
  <circle cx="886" cy="141" r="20" fill="url(#pY)"/>
  <circle cx="934" cy="141" r="20" fill="url(#pG)"/>
  <!-- feedback 2×2: 1 orange, 1 white, 2 dark -->
  <circle cx="976" cy="133" r="8" fill="#f59e0b"/>
  <circle cx="996" cy="133" r="8" fill="#d4d8e8"/>
  <circle cx="976" cy="153" r="8" fill="#181d30"/>
  <circle cx="996" cy="153" r="8" fill="#181d30"/>

