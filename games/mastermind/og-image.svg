  <text x="736" y="411" font-family="monospace" font-size="13" fill="#1e2438" font-weight="700">5</text>
  <circle cx="790" cy="405" r="20" fill="#0d1020" stroke="#181d30" stroke-width="2.5"/>
  <circle cx="838" cy="405" r="20" fill="#0d1020" stroke="#181d30" stroke-width="2.5"/>
  <circle cx="886" cy="405" r="20" fill="#0d1020" stroke="#181d30" stroke-width="2.5"/>
  <circle cx="934" cy="405" r="20" fill="#0d1020" stroke="#181d30" stroke-width="2.5"/>

  <text x="736" y="477" font-family="monospace" font-size="13" fill="#1a1f30" font-weight="700">6</text>
  <circle cx="790" cy="471" r="20" fill="#0d1020" stroke="#151928" stroke-width="2.5"/>
  <circle cx="838" cy="471" r="20" fill="#0d1020" stroke="#151928" stroke-width="2.5"/>
  <circle cx="886" cy="471" r="20" fill="#0d1020" stroke="#151928" stroke-width="2.5"/>
  <circle cx="934" cy="471" r="20" fill="#0d1020" stroke="#151928" stroke-width="2.5"/>

