  <circle cx="790" cy="273" r="20" fill="url(#pG)"/>
  <circle cx="838" cy="273" r="20" fill="url(#pV)"/>
  <circle cx="886" cy="273" r="20" fill="url(#pR)"/>
  <circle cx="934" cy="273" r="20" fill="url(#pO)"/>
  <circle cx="976" cy="265" r="8" fill="#f59e0b"/>
  <circle cx="996" cy="265" r="8" fill="#f59e0b"/>
  <circle cx="976" cy="285" r="8" fill="#f59e0b"/>
  <circle cx="996" cy="285" r="8" fill="#181d30"/>

  <!-- ── Row 4 (WIN: 4 orange) — highlighted -->
  <rect x="716" y="310" width="378" height="58" rx="10" fill="#f59e0b" fill-opacity="0.06" stroke="#f59e0b" stroke-opacity="0.2" stroke-width="1"/>
  <text x="736" y="345" font-family="monospace" font-size="13" fill="#f59e0b" font-weight="700">4</text>
  <circle cx="790" cy="339" r="20" fill="url(#pG)" filter="url(#glow)"/>
  <circle cx="838" cy="339" r="20" fill="url(#pV)" filter="url(#glow)"/>
  <circle cx="886" cy="339" r="20" fill="url(#pR)" filter="url(#glow)"/>
  <circle cx="934" cy="339" r="20" fill="url(#pO)" filter="url(#glow)"/>
  <circle cx="976" cy="331" r="8" fill="#f59e0b" filter="url(#glow)"/>
