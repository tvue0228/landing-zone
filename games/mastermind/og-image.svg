  <circle cx="768" cy="535" r="9" fill="url(#pR)"/>
  <circle cx="798" cy="535" r="9" fill="url(#pO)"/>
  <circle cx="828" cy="535" r="9" fill="url(#pY)"/>
  <circle cx="858" cy="535" r="9" fill="url(#pG)"/>
  <circle cx="888" cy="535" r="9" fill="url(#pB)"/>
  <circle cx="918" cy="535" r="9" fill="url(#pV)"/>
  <text x="960" y="540" font-family="-apple-system, sans-serif" font-size="12" fill="#2a3050">pick a color →</text>

