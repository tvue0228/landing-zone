<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg1" cx="18%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#502890" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#07090f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg2" cx="82%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#14328c" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#07090f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pR" cx="36%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="52%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.65"/>
    </radialGradient>
    <radialGradient id="pO" cx="36%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="52%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.65"/>
    </radialGradient>
    <radialGradient id="pY" cx="36%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="52%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.65"/>
    </radialGradient>
    <radialGradient id="pG" cx="36%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="52%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.65"/>
    </radialGradient>
    <radialGradient id="pB" cx="36%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="52%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.65"/>
    </radialGradient>
    <radialGradient id="pV" cx="36%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#d8b4fe"/>
      <stop offset="52%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.65"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#07090f"/>
  <rect width="1200" height="630" fill="url(#bg1)"/>
  <rect width="1200" height="630" fill="url(#bg2)"/>

  <!-- ── Left: text ─────────────────────────────────────────── -->

  <!-- Title -->
  <text x="90" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="108" font-weight="700" letter-spacing="-3">
    <tspan fill="#dde1f0">Master</tspan><tspan fill="#f59e0b">mind</tspan>
  </text>

  <!-- Divider line under title -->
  <rect x="90" y="254" width="200" height="2" rx="1" fill="#f59e0b" opacity="0.35"/>

  <!-- Tagline -->
  <text x="90" y="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#6b7aaa" letter-spacing="0.3">
    The code-breaking challenge
  </text>

  <!-- Description bullets -->
  <text x="90" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#303555">
    <tspan fill="#f59e0b">→</tspan><tspan fill="#6b7aaa"> Creator sets a secret color code</tspan>
  </text>
  <text x="90" y="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#303555">
    <tspan fill="#f59e0b">→</tspan><tspan fill="#6b7aaa"> Share the link with a challenger</tspan>
  </text>
  <text x="90" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#303555">
    <tspan fill="#f59e0b">→</tspan><tspan fill="#6b7aaa"> Can they crack the code?</tspan>
  </text>

  <!-- Share snippet -->
  <rect x="90" y="510" width="460" height="68" rx="10" fill="#0b0e1c" stroke="#181d30" stroke-width="1.5"/>
  <text x="114" y="535" font-family="'Courier New', monospace" font-size="18" fill="#404870">Mastermind 4/10</text>
  <text x="114" y="562" font-family="'Courier New', monospace" font-size="22" fill="#dde1f0">🟠🟠⚪⚫  🟠🟠🟠⚫  🟠🟠🟠🟠</text>

  <!-- ── Right: game board ──────────────────────────────────── -->

  <!-- Card -->
  <rect x="700" y="60" width="410" height="510" rx="18" fill="#0b0e1c" stroke="#181d30" stroke-width="1.5"/>

