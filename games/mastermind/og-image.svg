  <circle cx="790" cy="207" r="20" fill="url(#pB)"/>
  <circle cx="838" cy="207" r="20" fill="url(#pV)"/>
  <circle cx="886" cy="207" r="20" fill="url(#pR)"/>
  <circle cx="934" cy="207" r="20" fill="url(#pO)"/>
  <circle cx="976" cy="199" r="8" fill="#f59e0b"/>
