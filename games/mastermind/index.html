<script type="text/babel">
const { useState, useMemo, useEffect, useRef } = React;

// ─── Colors ───────────────────────────────────────────────────────────────────
const COLORS = [
  { id:"R", hex:"#ef4444", hi:"#fca5a5", label:"Red"    },
  { id:"O", hex:"#f97316", hi:"#fdba74", label:"Orange" },
  { id:"Y", hex:"#eab308", hi:"#fde047", label:"Yellow" },
  { id:"G", hex:"#22c55e", hi:"#86efac", label:"Green"  },
  { id:"B", hex:"#3b82f6", hi:"#93c5fd", label:"Blue"   },
  { id:"V", hex:"#a855f7", hi:"#d8b4fe", label:"Purple" },
  { id:"K", hex:"#ec4899", hi:"#f9a8d4", label:"Pink"   },
  { id:"T", hex:"#14b8a6", hi:"#5eead4", label:"Teal"   },
];

// ─── Game Logic ───────────────────────────────────────────────────────────────
function calcFeedback(guess, code) {
  const c = [...code], g = [...guess];
  let black = 0, white = 0;
  for (let i = 0; i < c.length; i++) {
    if (g[i] === c[i]) { black++; c[i] = g[i] = null; }
  }
  for (let i = 0; i < g.length; i++) {
    if (!g[i]) continue;
    const j = c.indexOf(g[i]);
    if (j !== -1) { white++; c[j] = null; }
  }
  return { black, white };
}

// ─── URL Persistence ──────────────────────────────────────────────────────────
function tryDecode(str) {
  try {
    const json = LZString.decompressFromEncodedURIComponent(str);
    return json ? JSON.parse(json) : null;
  } catch { return null; }
}
function encode(obj) {
  return LZString.compressToEncodedURIComponent(JSON.stringify(obj));
}
function resolveState() {
  const hash = window.location.hash.replace(/^#/, "");
  if (hash) { const s = tryDecode(hash); if (s?.mode) return s; }
  return { mode: "creator" };
}
function pushHash(obj) {
  window.history.replaceState(null, "", "#" + encode(obj));
}
function shareLink(obj) {
  return window.location.origin + window.location.pathname + "#" + encode(obj);
}
function buildShareText(guesses, numPegs, maxGuesses, won, url) {
  const header = won ? `Mastermind ${guesses.length}/${maxGuesses}` : `Mastermind X/${maxGuesses}`;
  const grid = guesses.map(g =>
    "🟠".repeat(g.fb.black) + "⚪".repeat(g.fb.white) + "⚫".repeat(numPegs - g.fb.black - g.fb.white)
  );
  return [header, "", ...grid, "", "Try it yourself:", url].join("\n");
}

// ─── Canvas helpers ───────────────────────────────────────────────────────────
function rrect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

function buildResultCanvas(guesses, nPegs, maxG, isWon, url) {
  const W = 600, pegR = 15, pegGap = 10;
  const headerH = 164, rowH = 52, footerH = 72;
  const H = headerH + guesses.length * rowH + footerH;
  const DPR = 2;

  const canvas = document.createElement('canvas');
  canvas.width = W * DPR; canvas.height = H * DPR;
  const ctx = canvas.getContext('2d');
  ctx.scale(DPR, DPR);

  // Background
  ctx.fillStyle = '#07090f';
  ctx.fillRect(0, 0, W, H);
  const glow = ctx.createRadialGradient(W * 0.15, H * 0.1, 0, W * 0.15, H * 0.1, W * 0.55);
  glow.addColorStop(0, 'rgba(80,40,160,0.14)'); glow.addColorStop(1, 'rgba(7,9,15,0)');
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);

  // Title "Master" + "mind"
  const FONT = 'bold 54px system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif';
  ctx.font = FONT; ctx.textBaseline = 'alphabetic';
  const mw = ctx.measureText('Master').width;
  const iw = ctx.measureText('mind').width;
  const tx = (W - mw - iw) / 2;
  ctx.fillStyle = '#dde1f0'; ctx.fillText('Master', tx, 68);
  ctx.fillStyle = '#f59e0b'; ctx.fillText('mind', tx + mw, 68);

  // Score line
  const scoreText = isWon
    ? `Cracked in ${guesses.length} / ${maxG} guess${guesses.length !== 1 ? 'es' : ''} 🎉`
    : `Failed — all ${maxG} guesses used 💀`;
  ctx.font = '19px system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif';
  ctx.fillStyle = isWon ? '#a07830' : '#6b3a3a';
  ctx.textAlign = 'center'; ctx.fillText(scoreText, W / 2, 104);

  // Divider
  ctx.beginPath(); ctx.moveTo(W/2 - 50, 126); ctx.lineTo(W/2 + 50, 126);
  ctx.strokeStyle = '#1e2438'; ctx.lineWidth = 1; ctx.stroke();

  // Peg rows
  const ORANGE = '#f59e0b', LITE = '#c8ccd8', DARK = '#181d30';
  guesses.forEach((g, row) => {
    const { black, white } = g.fb;
    const total = nPegs;
    const pegs = [...Array(black).fill(ORANGE), ...Array(white).fill(LITE), ...Array(total - black - white).fill(DARK)];
    const rowW = total * pegR * 2 + (total - 1) * pegGap;
    const sx = (W - rowW) / 2;
    const cy = headerH + row * rowH + pegR + 2;
    const isWinRow = isWon && row === guesses.length - 1;

    // Row bg
    ctx.fillStyle = isWinRow ? 'rgba(245,158,11,0.06)' : 'rgba(255,255,255,0.025)';
    rrect(ctx, sx - 22, cy - pegR - 7, rowW + 44, pegR * 2 + 14, 9); ctx.fill();
    if (isWinRow) { ctx.strokeStyle = 'rgba(245,158,11,0.2)'; ctx.lineWidth = 1; rrect(ctx, sx - 22, cy - pegR - 7, rowW + 44, pegR * 2 + 14, 9); ctx.stroke(); }

    // Row number
    ctx.font = 'bold 10px monospace'; ctx.fillStyle = isWinRow ? 'rgba(245,158,11,0.5)' : '#1e2438';
    ctx.textAlign = 'right'; ctx.fillText(String(row + 1), sx - 30, cy + 4);

    pegs.forEach((color, pi) => {
      const x = sx + pi * (pegR * 2 + pegGap) + pegR;

      // Glow halo for win row orange pegs
      if (isWinRow && color === ORANGE) {
        ctx.beginPath(); ctx.arc(x, cy, pegR + 5, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(245,158,11,0.18)'; ctx.fill();
      }
      // Shadow
      ctx.beginPath(); ctx.arc(x, cy + 2, pegR, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fill();
      // Body
      ctx.beginPath(); ctx.arc(x, cy, pegR, 0, Math.PI * 2);
      ctx.fillStyle = color; ctx.fill();
      // Highlight
      if (color !== DARK) {
        const hl = ctx.createRadialGradient(x - pegR * 0.3, cy - pegR * 0.35, 0, x, cy, pegR);
        hl.addColorStop(0, 'rgba(255,255,255,0.45)');
        hl.addColorStop(0.55, 'rgba(255,255,255,0.08)');
        hl.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.beginPath(); ctx.arc(x, cy, pegR, 0, Math.PI * 2);
        ctx.fillStyle = hl; ctx.fill();
      }
    });
  });

  // Footer — prompt (full link lives in the share text, not here)
  const footerText = '↗  Tap the link below to play the same puzzle';
  ctx.font = '13px system-ui,-apple-system,sans-serif';
  const ftw = ctx.measureText(footerText).width;
  const fty = H - 22;
  rrect(ctx, (W - ftw) / 2 - 14, fty - 17, ftw + 28, 26, 7);
  ctx.fillStyle = '#0f1420'; ctx.fill();
  ctx.fillStyle = '#6b7aaa';
  ctx.textAlign = 'center'; ctx.fillText(footerText, W / 2, fty);

  return canvas;
}

// ─── Peg ──────────────────────────────────────────────────────────────────────
function Peg({ id, size = 42, clickable, active, onClick }) {
  const c = COLORS.find(x => x.id === id);
  return (
    <div
      className={`mm-peg${c ? " gem" : " hole"}${clickable ? " clickable" : ""}${active ? " active-slot" : ""}`}
      style={{
        width: size, height: size,
        ...(c ? { background: `radial-gradient(circle at 36% 30%, ${c.hi}, ${c.hex} 52%, rgba(0,0,0,.6))` } : {}),
      }}
      onClick={onClick}
    />
  );
}

// ─── FeedbackGrid ─────────────────────────────────────────────────────────────
function FeedbackGrid({ black, white, total }) {
  const cols = total <= 4 ? 2 : 3;
  const sz   = total <= 4 ? 13 : 11;
  const pegs = [
    ...Array(black).fill("b"),
    ...Array(white).fill("w"),
    ...Array(total - black - white).fill("m"),
  ];
  return (
    <div className={`mm-fgrid c${cols}`}>
      {pegs.map((t, i) => <div key={i} className={`mm-fpeg ${t}`} style={{ width: sz, height: sz }} />)}
    </div>
  );
}

// ─── ColorRow ─────────────────────────────────────────────────────────────────
function ColorRow({ ids, sel, onSel, size = 40 }) {
  return (
    <div className="mm-color-row">
      {ids.map(id => {
        const c = COLORS.find(x => x.id === id);
        return (
          <div
            key={id}
            className={`mm-cpeg${sel === id ? " sel" : ""}`}
            style={{
              width: size, height: size,
              background: `radial-gradient(circle at 36% 30%, ${c.hi}, ${c.hex} 52%, rgba(0,0,0,.6))`,
            }}
            title={c.label}
            onClick={() => onSel(id)}
          />
        );
      })}
    </div>
  );
}

// ─── Creator ──────────────────────────────────────────────────────────────────
function Creator() {
  const [nColors,  setNC]    = useState(6);
  const [nPegs,    setNP]    = useState(4);
  const [maxG,     setMG]    = useState(10);
  const [code,      setCode]     = useState(Array(4).fill(null));
  const [activePeg, setActivePeg] = useState(0);
  const [link,      setLink]     = useState("");
  const [copied,    setCopied]   = useState(false);

  const ids = COLORS.slice(0, nColors).map(c => c.id);

  useEffect(() => { setCode(Array(nPegs).fill(null)); setActivePeg(0); }, [nPegs]);

  // Tap a peg slot → move cursor there
  const tapPeg = (i) => setActivePeg(i);

  // Tap a color → fill active slot, advance cursor to next empty
  const tapColor = (colorId) => {
    const next = code.map((c, i) => i === activePeg ? colorId : c);
    setCode(next);
    const nextEmpty = next.findIndex((c, i) => i > activePeg && c === null);
    if (nextEmpty !== -1) setActivePeg(nextEmpty);
  };

  const randomize = () => { setCode(Array(nPegs).fill(null).map(() => ids[Math.floor(Math.random() * nColors)])); setActivePeg(0); };

  const goBreaker = (state) => {
    history.replaceState(null, '', window.location.pathname + '#' + encode(state));
    window.location.reload();
  };

  // Generate a random code and go straight to breaker without ever showing the code
  const playSolo = () => {
    const c = Array(nPegs).fill(null).map(() => ids[Math.floor(Math.random() * nColors)]);
    goBreaker({ mode: "breaker", code: c, colors: nColors, pegs: nPegs, maxG, guesses: [] });
  };

  const generate = () => {
    setLink(shareLink({ mode: "breaker", code, colors: nColors, pegs: nPegs, maxG, guesses: [] }));
  };

  // Play the same code you just set (you've already seen it, but useful to test or play together)
  const playToo = () => {
    goBreaker({ mode: "breaker", code, colors: nColors, pegs: nPegs, maxG, guesses: [] });
  };

  const copy = async () => {
    try { await navigator.clipboard.writeText(link); } catch { return; }
    setCopied(true); setTimeout(() => setCopied(false), 2200);
  };

  const codeReady = code.every(Boolean);

  return (
    <div>
      <div className="mm-hd">
        <div className="mm-logo">Master<em>mind</em></div>
        <div className="mm-sub">Play solo · challenge a friend · crack the code</div>
      </div>

      <div className="mm-card">
        <div className="mm-lbl">Game settings</div>
        <div className="mm-set-row">
          <span className="mm-set-name">Available colors</span>
          <div className="mm-opts">
            {[6,7,8].map(n => <button key={n} className={`mm-opt${nColors===n?" on":""}`} onClick={() => setNC(n)}>{n}</button>)}
          </div>
        </div>
        <div className="mm-set-row">
          <span className="mm-set-name">Code length</span>
          <div className="mm-opts">
            {[4,5].map(n => <button key={n} className={`mm-opt${nPegs===n?" on":""}`} onClick={() => setNP(n)}>{n} pegs</button>)}
          </div>
        </div>
        <div className="mm-set-row">
          <span className="mm-set-name">Max guesses</span>
          <div className="mm-opts">
            {[8,10,12].map(n => <button key={n} className={`mm-opt${maxG===n?" on":""}`} onClick={() => setMG(n)}>{n}</button>)}
          </div>
        </div>
      </div>

      <button className="mm-btn mm-btn-green mm-btn-wide" onClick={playSolo}>
        🎮 Play Solo — Random Code
      </button>

      <div className="mm-or-div">or challenge a friend</div>

      <div className="mm-card">
        <div className="mm-lbl">Set a secret code for them to crack</div>
        <div className="mm-peg-row" style={{ marginBottom: 16 }}>
          {code.map((c, i) => (
            <Peg key={i} id={c} clickable active={i === activePeg} onClick={() => tapPeg(i)} />
          ))}
        </div>
        <ColorRow ids={ids} sel={null} onSel={tapColor} size={38} />
        <div className="mm-btn-row" style={{ justifyContent: "center", marginTop: 14 }}>
          <button className="mm-btn mm-btn-ghost" style={{ fontSize: 13 }} onClick={randomize}>🎲 Random</button>
          <button className="mm-btn mm-btn-ghost" style={{ fontSize: 13 }} onClick={() => { setCode(Array(nPegs).fill(null)); setActivePeg(0); }}>✕ Clear</button>
        </div>
      </div>

      <button className="mm-btn mm-btn-gold mm-btn-wide" disabled={!codeReady} onClick={generate}>
        🔗 Generate Challenge Link
      </button>

      {link && (
        <>
          <div className="mm-sbox">
            <div className="mm-surl">{link}</div>
            <button className={`mm-scopy${copied ? " ok" : ""}`} onClick={copy}>
              {copied ? "✓ Copied!" : "Copy link"}
            </button>
          </div>
          <button className="mm-btn mm-btn-green mm-btn-wide" style={{ marginTop: 10 }} onClick={playToo}>
            ▶ Play This Code Too
          </button>
          <div className="mm-hint">
            Send the link above to your challenger — then hit Play to race them.<br />
            ⚠️ Don't share your screen — the code is in the URL!
          </div>
        </>
      )}
    </div>
  );
}

// ─── Breaker ──────────────────────────────────────────────────────────────────
function Breaker({ init }) {
  const { code, colors: nColors, pegs: nPegs, maxG } = init;
  const ids = COLORS.slice(0, nColors).map(c => c.id);

  const [guesses,  setGuesses] = useState(init.guesses || []);
  const [current,    setCurrent]   = useState(Array(nPegs).fill(null));
  const [activePeg,  setActivePeg] = useState(0);
  const [copied,     setCopied]    = useState(false);
  const [linkCopied, setLinkCopied] = useState(false);
  const resultRef = useRef(null);

  const isWon  = guesses.length > 0 && guesses.at(-1).fb.black === nPegs;
  const isLost = !isWon && guesses.length >= maxG;
  const isOver = isWon || isLost;

  useEffect(() => {
    if (guesses.length === 0) return;
    pushHash({ ...init, guesses });
  }, [guesses]);

  useEffect(() => {
    if (isOver) setTimeout(() => resultRef.current?.scrollIntoView({ behavior: "smooth", block: "start" }), 120);
  }, [isOver]);

  // Tap a peg slot → move cursor there
  const tapPeg = (i) => { if (!isOver) setActivePeg(i); };

  // Tap a color → fill active slot, advance cursor to next empty
  const tapColor = (colorId) => {
    if (isOver) return;
    const next = current.map((c, i) => i === activePeg ? colorId : c);
    setCurrent(next);
    const nextEmpty = next.findIndex((c, i) => i > activePeg && c === null);
    if (nextEmpty !== -1) setActivePeg(nextEmpty);
  };

  const clearRow = () => { setCurrent(Array(nPegs).fill(null)); setActivePeg(0); };

  const submit = () => {
    if (isOver || current.some(c => !c)) return;
    const fb = calcFeedback(current, code);
    setGuesses(p => [...p, { colors: current, fb }]);
    setCurrent(Array(nPegs).fill(null));
    setActivePeg(0);
  };

  const canSubmit = !isOver && current.every(Boolean);

  const freshUrl = useMemo(() => shareLink({ ...init, guesses: [] }), []);

  const shareStr = useMemo(() => isOver ? buildShareText(guesses, nPegs, maxG, isWon, freshUrl) : "", [isOver]);

  const shareResult = async () => {
    const canvas = buildResultCanvas(guesses, nPegs, maxG, isWon, freshUrl);
    const dataUrl = canvas.toDataURL('image/png');
    const b64 = dataUrl.split(',')[1];
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    const blob = new Blob([arr], { type: 'image/png' });
    const file = new File([blob], 'mastermind.png', { type: 'image/png' });

    try {
      if (navigator.canShare?.({ files: [file] })) {
        await navigator.share({ files: [file], text: shareStr, url: freshUrl });
      } else if (navigator.share) {
        await navigator.share({ text: shareStr, url: freshUrl });
      } else {
        await navigator.clipboard.writeText(shareStr);
        setCopied(true); setTimeout(() => setCopied(false), 2200);
      }
    } catch (e) {
      if (e.name !== 'AbortError') {
        try { await navigator.clipboard.writeText(shareStr); setCopied(true); setTimeout(() => setCopied(false), 2200); } catch {}
      }
    }
  };

  const copyLink = async () => {
    try { await navigator.clipboard.writeText(freshUrl); } catch { return; }
    setLinkCopied(true); setTimeout(() => setLinkCopied(false), 2200);
  };

  const newGame = () => {
    window.history.replaceState(null, "", window.location.pathname);
    window.location.reload();
  };

  return (
    <div>
      <div className="mm-hd">
        <div className="mm-logo">Master<em>mind</em></div>
        <div className="mm-sub">
          {isOver
            ? (isWon ? "🎉 Code cracked!" : "💀 The code wins")
            : `Guess ${guesses.length + 1} / ${maxG}`}
          {" · "}{nPegs} pegs · {nColors} colors
        </div>
      </div>

      {/* Board */}
      <div className="mm-board">
        {Array.from({ length: maxG }, (_, row) => {
          const done   = guesses[row];
          const isLive = !isOver && row === guesses.length;
          const pegs   = done ? done.colors : isLive ? current : Array(nPegs).fill(null);
          const fb     = done?.fb;

          return (
            <div key={row} className={`mm-row${isLive ? " live" : ""}`}>
              <span className="mm-rnum">{row + 1}</span>
              <div className="mm-peg-row mm-spacer" style={{ justifyContent: "flex-start" }}>
                {pegs.map((c, pi) => (
                  <Peg
                    key={pi} id={c}
                    clickable={isLive}
                    active={isLive && pi === activePeg}
                    onClick={isLive ? () => tapPeg(pi) : undefined}
                  />
                ))}
              </div>
              {fb
                ? <FeedbackGrid black={fb.black} white={fb.white} total={nPegs} />
                : <div style={{ width: nPegs <= 4 ? 34 : 50 }} />
              }
            </div>
          );
        })}
      </div>

      {/* Result card */}
      {isOver && (
        <div className="mm-card" ref={resultRef}>
          <div className="mm-result">
            <div className="mm-r-icon">{isWon ? "🎉" : "💀"}</div>
            <div className={`mm-r-title ${isWon ? "won" : "lost"}`}>
              {isWon ? "You cracked it!" : "The code wins!"}
            </div>
            <div className="mm-r-sub">
              {isWon
                ? `Solved in ${guesses.length} of ${maxG} guess${guesses.length !== 1 ? "es" : ""}`
                : `All ${maxG} guesses used`}
            </div>
            <div className="mm-lbl">The secret code was</div>
            <div className="mm-r-code">
              {code.map((c, i) => <Peg key={i} id={c} size={46} />)}
            </div>
          </div>
          <div className="mm-sgrid">{shareStr}</div>

          {/* Challenge link — tappable on screen, included in share text */}
          <div className="mm-sbox" style={{ marginBottom: 12 }}>
            <div className="mm-lbl" style={{ marginBottom: 6 }}>Challenge link — share this so others can try the same puzzle</div>
            <div className="mm-surl">{freshUrl}</div>
            <button className={`mm-scopy${linkCopied ? " ok" : ""}`} onClick={copyLink}>
              {linkCopied ? "✓ Copied!" : "Copy link"}
            </button>
          </div>

          <div className="mm-r-actions">
            <button className="mm-btn mm-btn-gold" onClick={shareResult}>
              {copied ? "✓ Copied!" : "📤 Share"}
            </button>
            <button className="mm-btn mm-btn-ghost" onClick={newGame}>+ New Game</button>
          </div>
        </div>
      )}

      {/* Sticky bottom control bar */}
      {!isOver && (
        <div className="mm-ctrl-bar">
          <ColorRow ids={ids} sel={null} onSel={tapColor} size={40} />
          <div className="mm-btn-row" style={{ marginTop: 10 }}>
            <button className="mm-btn mm-btn-green" style={{ flex: 1 }} disabled={!canSubmit} onClick={submit}>
              Submit Guess →
            </button>
            <button className="mm-btn mm-btn-ghost" onClick={clearRow} title="Clear row">✕</button>
          </div>
          <div className="mm-hint" style={{ marginTop: 8 }}>
            🟠 right place · ⚪ right color, wrong place · ⚫ not in code
          </div>
        </div>
      )}
    </div>
  );
}

// ─── App ──────────────────────────────────────────────────────────────────────
function App() {
  const state = useMemo(() => resolveState(), []);
  return (
    <>
      <style>{CSS}</style>
      <div className="mm">
        <a href="../../" className="mm-back">← Games</a>
        {state.mode === "creator" && <Creator />}
        {state.mode === "breaker" && <Breaker init={state} />}
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
