<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Egg Rhythm Cooking</title>
<style>
:root{--ink:#111;--paper:#fbf6ea;--card:#fffdf6;--amber:#fbbf24;--green:#22c55e;--red:#ef4444}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:#171717;color-scheme:light}
body{font-family:"Segoe Print","Bradley Hand","Chalkboard SE","Comic Sans MS","Comic Neue",cursive;min-height:100vh;
  background-image:radial-gradient(#e9ddc0 1.2px,transparent 0);background-size:24px 24px;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);-webkit-tap-highlight-color:transparent}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:0 14px 28px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;max-width:980px;margin:0 auto}
.logo{display:flex;align-items:center;gap:8px;font-size:1.6rem;font-weight:700}
.logo span{width:40px;height:40px;border-radius:50%;background:#fcd34d;border:3px solid var(--ink);box-shadow:2px 2px 0 var(--ink);display:inline-flex;align-items:center;justify-content:center;font-size:1.3rem}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:#fff;border:3px solid var(--ink);box-shadow:2px 2px 0 var(--ink);font-weight:700;font-size:1.05rem;white-space:nowrap}
.pill.gold{background:#fcd34d}
.card{background:var(--card);border:3px solid var(--ink);border-radius:1.25rem;box-shadow:5px 5px 0 var(--ink);padding:14px}
.btn{border:4px solid var(--ink);border-radius:1.25rem;box-shadow:5px 5px 0 var(--ink);background:var(--amber);font-weight:700;font-size:1.5rem;padding:10px 26px;transition:transform .08s,box-shadow .08s;user-select:none;-webkit-user-select:none}
.btn:hover{background:#fcd34d}
.btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.btn.sm{font-size:1rem;padding:6px 14px;border-width:3px;box-shadow:3px 3px 0 var(--ink)}
.btn.green{background:#86efac}.btn.red{background:#fca5a5}.btn.gray{background:#e5e7eb;color:#6b7280;box-shadow:none;cursor:not-allowed}
.center{text-align:center}
.col{display:flex;flex-direction:column;align-items:center;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
.big{font-size:clamp(2rem,6vw,3.6rem);font-weight:700;line-height:1.05}
.muted{color:#6b7280}
.bar{height:16px;border:3px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden;min-width:120px}
.bar>i{display:block;height:100%;background:var(--green);transition:width .4s}
.stat{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px}
.recipe{display:flex;align-items:center;gap:10px;padding:8px 10px;border:3px solid var(--ink);border-radius:1rem;background:#fff;text-align:left}
.recipe.locked{background:#f3f4f6;opacity:.75}
.recipe.secret{background:#fef3c7;border-style:dashed}
.recipe .em{font-size:1.9rem;width:44px;text-align:center}
.recipe b{display:block}
.chefrow{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:8px 10px;border:3px solid var(--ink);border-radius:1rem;background:#fff;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{padding:2px 10px;border-radius:999px;border:3px solid var(--ink);font-weight:700}
.vip{display:inline-block;background:linear-gradient(90deg,#fbbf24,#f59e0b);border:3px solid var(--ink);border-radius:999px;padding:0 10px;font-weight:700;font-size:.95rem;transform:rotate(-3deg)}
.face{font-size:4.5rem;line-height:1}
.cookgrid{display:grid;grid-template-columns:7fr 3fr;gap:12px;width:100%}
.track{position:relative;width:100%;height:min(54vh,440px);min-height:280px;border:4px solid var(--ink);border-radius:2rem;background:#fffdf4;overflow:hidden;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;outline:none}
.zone{position:absolute;left:4px;right:4px;border-radius:999px;background:#4ade80;border:4px solid #14532d;transition:box-shadow .1s}
.ball{position:absolute;left:50%;width:64px;height:64px;transform:translate(-50%,-50%);pointer-events:none}
.ball i{position:absolute;inset:0;border-radius:50%;background:#fb923c;border:6px solid var(--ink);box-shadow:3px 3px 0 rgba(0,0,0,.85)}
.ball b{position:absolute;inset:-6px;border-radius:50%;border:5px solid #fff}
.dot{display:inline-block;width:18px;height:18px;border-radius:50%;border:2px solid var(--ink);background:#fff;margin:0 2px}
.fb{position:absolute;left:0;right:0;top:44px;text-align:center;font-size:2.6rem;font-weight:700;pointer-events:none;z-index:5;animation:pop 1s ease-out forwards}
@keyframes pop{0%{transform:scale(.3) rotate(-6deg);opacity:0}20%{transform:scale(1.2) rotate(3deg);opacity:1}45%{transform:scale(1)}75%{opacity:1}100%{transform:scale(1.05) translateY(-26px);opacity:0}}
.part{position:absolute;width:12px;height:12px;border-radius:50%;pointer-events:none;z-index:4}
.part.s{background:#fbbf24;border:2px solid var(--ink);animation:rise 1s ease-out forwards}
.part.k{background:#6b7280;animation:smoke 1.3s ease-out forwards}
@keyframes rise{to{transform:translate(10px,-80px) scale(.3);opacity:0}}
@keyframes smoke{to{transform:translate(-14px,-100px) scale(1.6);opacity:0}}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-10px) rotate(1deg)}}
.shake{animation:shake .35s ease-in-out}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-6px,2px) rotate(-2deg)}40%{transform:translate(6px,-3px) rotate(2deg)}60%{transform:translate(-4px,-2px)}80%{transform:translate(4px,2px)}}
.wig{display:inline-block;animation:wig 2.2s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.steam{animation:steam 1.8s ease-in-out infinite}
@keyframes steam{0%{transform:translateY(8px);opacity:0}35%{opacity:.75}100%{transform:translateY(-16px);opacity:0}}
.banner{background:#fef3c7;border:3px dashed var(--ink);border-radius:1rem;padding:8px 12px;font-weight:700}
.vipcard{background:linear-gradient(135deg,#fffdf6,#fde68a)}
footer{text-align:center;padding:6px 0 20px;color:#737373}
.hidden{display:none!important}
</style>
</head>
<body>
<header class="top">
  <div class="logo"><span>🍳</span><h1>Egg Rhythm!</h1></div>
  <div class="row" id="hud"></div>
</header>
<main class="wrap" id="app"></main>
<footer>A hand-drawn rhythm snack — no eggs were harmed.</footer>

<script>
"use strict";
/* ---------------- data ---------------- */
const SAVE_KEY = "egg-rhythm-cooking-v2";
const RECIPES = [
  {id: "fried",   name: "Fried Egg",           em: "🍳", price: 12,  flips: 7, zone: .34, speed: 1.00, need: 0},
  {id: "omelet",  name: "Cheesy Omelette",     em: "🧀", price: 22,  flips: 7, zone: .32, speed: 1.05, need: 5},
  {id: "rice",    name: "Egg Fried Rice",      em: "🍚", price: 38,  flips: 8, zone: .30, speed: 1.10, need: 15},
  {id: "shak",    name: "Shakshuka",           em: "🍅", price: 60,  flips: 8, zone: .28, speed: 1.15, need: 30},
  {id: "benny",   name: "Eggs Benedict",       em: "🥓", price: 95,  flips: 9, zone: .26, speed: 1.20, need: 55},
  {id: "souffle", name: "Truffle Soufflé",     em: "🍄", price: 150, flips: 9, zone: .24, speed: 1.25, need: 90},
  {id: "dragon",  name: "Dragon's Gold Egg",   em: "🐉", price: 400, flips: 10, zone: .22, speed: 1.30, secret: true}
];
const SECRET_VIP_NEEDED = 3;
const CHEFS = [
  {id: "line",  name: "Line Cook",  em: "🧑‍🍳", cost: 200,  wage: 30, skill: 55},
  {id: "sous",  name: "Sous Chef",  em: "👩‍🍳", cost: 650,  wage: 80, skill: 70},
  {id: "head",  name: "Head Chef",  em: "👨‍🍳", cost: 1800, wage: 190, skill: 85}
];
const MAX_CHEFS = 6;
const FACES = ["🧑","👵","🧔","👧","🤠","👨‍🚀","👩‍🎤","🧓","👱‍♀️","🧑‍🎨"];
const NAMES = ["Sam","Mia","Leo","Ana","Bo","Zed","Ivy","Max","Kai","Rae","Dot","Gus","Pia","Ned","Lux"];
const VIPS = [
  {name: "Food Critic Gordo", face: "🧐"},
  {name: "Princess Pearl",    face: "👸"},
  {name: "Rockstar Rex",      face: "🕶️"},
  {name: "Mayor Muffin",      face: "🎩"},
  {name: "Sultan Saffron",    face: "🤴"}
];

/* ---------------- rebirth gifts ---------------- */
const REBIRTH_NEED = 30;   // customers served before you can be reborn
const GIFTS = [
  {em: "🍳", name: "Lucky Pan",     desc: "+10% pay on every order"},
  {em: "💰", name: "Starter Fund",  desc: "start each life with +$150"},
  {em: "🧢", name: "Chef's Hat",    desc: "start with +5 reputation"},
  {em: "🎯", name: "Steady Hand",   desc: "green zones 5% bigger"},
  {em: "🧑‍🍳", name: "Free Line Cook", desc: "a line cook joins you for free"}
];
function giftCount(i) { // how many times gift i has been earned
  let n = 0;
  for (let k = 1; k <= S.rebirths; k++) if ((k - 1) % GIFTS.length === i) n++;
  return n;
}
const payBonus = () => 1 + .1 * giftCount(0);
const zoneBonus = () => 1 + .05 * giftCount(3);

/* ---------------- save state ---------------- */
function fresh() {
  return {rebirths: 0, started: false, cash: 0, rep: 50, day: 1, served: 0, vipGood: 0, vipTotal: 0, chefs: [], seen: ["fried"], best: 0};
}
let S = load();
function load() {
  try { const o = JSON.parse(localStorage.getItem(SAVE_KEY)); if (o && typeof o === "object") { const f = Object.assign(fresh(), o); if (f.spice != null || f.served > 0) f.started = true; return f; } } catch (e) {}
  return fresh();
}
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }

/* ---------------- helpers ---------------- */
const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const money = (n) => "$" + Math.round(n).toLocaleString();
const stars = (n) => "★".repeat(n) + "☆".repeat(5 - n);
function unlocked(r) { return r.secret ? S.vipGood >= SECRET_VIP_NEEDED : S.served >= r.need; }
function unlockedList() { return RECIPES.filter(unlocked); }

/* ---------------- sound ---------------- */
let actx = null, master = null, muted = false;
function audio() {
  if (!actx) {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = muted ? 0 : 0.4;
    const c = actx.createDynamicsCompressor(); master.connect(c); c.connect(actx.destination);
  }
  if (actx.state !== "running") actx.resume();
}
function tone(f, d = .15, type = "sine", v = .22, delay = 0) {
  if (muted) return;
  try {
    audio();
    const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + d + .08);
  } catch (e) {}
}
function sfx(kind) {
  if (kind === "perfect") { tone(880, .12, "sine", .25); tone(1318.5, .2, "sine", .22, .09); }
  else if (kind === "good") tone(659.3, .14, "triangle", .25);
  else if (kind === "miss") { tone(150, .28, "sawtooth", .16); tone(110, .3, "sawtooth", .13, .05); }
  else if (kind === "cash") { tone(988, .09, "square", .12); tone(1318, .18, "square", .12, .08); }
  else if (kind === "unlock") { [523, 659, 784, 1047].forEach((f, i) => tone(f, .18, "triangle", .22, i * .09)); }
  else if (kind === "start") { tone(523.25, .12, "triangle", .22); tone(783.99, .16, "triangle", .22, .1); }
}

/* ---------------- svg art ---------------- */
function eggSvg(stage, burns) {
  const t = clamp(stage, 0, 3), w = ["#ffffff", "#fffdf4", "#ffedbe", "#f8cd7d"][t], y = ["#ffe27a", "#ffcf4d", "#ffb62e", "#ff9d1f"][t];
  const sp = [{x:-26,y:4,r:8},{x:28,y:-6,r:6},{x:-4,y:10,r:7},{x:20,y:8,r:5},{x:-14,y:-10,r:5},{x:6,y:-12,r:4}];
  return `<path d="M-40 2 C-42 -10 -28 -16 -14 -13 C-6 -20 12 -19 20 -12 C34 -12 44 -4 42 6 C40 14 26 18 12 16 C-2 20 -30 18 -40 2 Z" fill="${w}" stroke="#111" stroke-width="4"/>`
    + (t >= 2 ? `<g fill="#c97f2e" opacity=".55"><ellipse cx="-30" cy="6" rx="7" ry="4"/><ellipse cx="32" cy="2" rx="6" ry="4"/><ellipse cx="10" cy="13" rx="8" ry="3.5"/></g>` : "")
    + (t >= 1 ? `<g fill="#fff" opacity=".65"><circle cx="-18" cy="-4" r="2.4"/><circle cx="24" cy="-8" r="2"/><circle cx="-6" cy="6" r="1.8"/></g>` : "")
    + `<circle cx="6" cy="-2" r="11" fill="${y}" stroke="#111" stroke-width="3.5"/><circle cx="2" cy="-6" r="3.5" fill="#fff" opacity=".7"/>`
    + sp.slice(0, Math.min(burns, sp.length)).map(b => `<ellipse cx="${b.x}" cy="${b.y}" rx="${b.r}" ry="${b.r * .8}" fill="#3b2b20" opacity=".85"/>`).join("");
}
function chefSvg(holding, stage, burns, em) {
  const body = `<g stroke="#111" stroke-width="8" stroke-linecap="round"><line x1="150" y1="248" x2="132" y2="316"/><line x1="150" y1="248" x2="170" y2="316"/></g>
<ellipse cx="128" cy="322" rx="16" ry="9" fill="#111"/><ellipse cx="174" cy="322" rx="16" ry="9" fill="#111"/>
<line x1="150" y1="146" x2="150" y2="252" stroke="#111" stroke-width="10" stroke-linecap="round"/>
<path d="M128 164 L172 164 L164 254 L136 254 Z" fill="#fff" stroke="#111" stroke-width="5" stroke-linejoin="round"/>
<rect x="141" y="196" width="18" height="14" rx="4" fill="#fff" stroke="#111" stroke-width="3"/>
<path d="M136 148 L164 148 L150 164 Z" fill="#ef4444" stroke="#111" stroke-width="4" stroke-linejoin="round"/>
<line x1="150" y1="174" x2="114" y2="216" stroke="#111" stroke-width="7" stroke-linecap="round"/><circle cx="112" cy="219" r="9" fill="#ffd9a3" stroke="#111" stroke-width="4"/>
<circle cx="150" cy="116" r="30" fill="#ffd9a3" stroke="#111" stroke-width="5"/><circle cx="139" cy="112" r="3.6" fill="#111"/><circle cx="161" cy="112" r="3.6" fill="#111"/>
<path d="M136 128 Q150 141 164 128" stroke="#111" stroke-width="4" fill="none" stroke-linecap="round"/>
<circle cx="128" cy="122" r="5" fill="#f6a5a5" opacity=".7"/><circle cx="172" cy="122" r="5" fill="#f6a5a5" opacity=".7"/>
<path d="M112 64 C104 38 128 28 142 38 C146 20 172 20 176 38 C190 28 214 38 206 64 C214 72 206 82 196 80 L122 80 C112 82 104 72 112 64 Z" fill="#fff" stroke="#111" stroke-width="5" stroke-linejoin="round"/>
<rect x="112" y="76" width="76" height="17" rx="8" fill="#fff" stroke="#111" stroke-width="4"/>`;
  const arm = holding === "pan"
    ? `<line x1="150" y1="174" x2="232" y2="196" stroke="#111" stroke-width="7" stroke-linecap="round"/><circle cx="234" cy="197" r="9" fill="#ffd9a3" stroke="#111" stroke-width="4"/>
<line x1="242" y1="197" x2="292" y2="193" stroke="#111" stroke-width="10" stroke-linecap="round"/>
<ellipse cx="326" cy="192" rx="50" ry="17" fill="#4b4b4b" stroke="#111" stroke-width="5"/><ellipse cx="326" cy="189" rx="41" ry="12" fill="#262626"/>
<g transform="translate(322 183)">${eggSvg(stage, burns)}</g>
<path class="steam" d="M306 148 q6 -10 0 -20 q-6 -10 0 -20" stroke="#9aa0a6" stroke-width="4" fill="none" stroke-linecap="round"/>
<path class="steam" style="animation-delay:.6s" d="M338 148 q6 -10 0 -20 q-6 -10 0 -20" stroke="#9aa0a6" stroke-width="4" fill="none" stroke-linecap="round"/>`
    : `<line x1="150" y1="174" x2="252" y2="156" stroke="#111" stroke-width="7" stroke-linecap="round"/>
<ellipse cx="292" cy="150" rx="58" ry="15" fill="#fff" stroke="#111" stroke-width="5"/><ellipse cx="292" cy="150" rx="44" ry="10" fill="none" stroke="#111" stroke-width="2.5" opacity=".5"/>
<g transform="translate(292 141) scale(1.05)">${eggSvg(stage, burns)}</g>
<circle cx="254" cy="157" r="9" fill="#ffd9a3" stroke="#111" stroke-width="4"/>`;
  return `<svg viewBox="0 0 380 380" style="width:100%;height:auto" role="img" aria-label="Cartoon chef">${body}${arm}</svg>`;
}

/* ---------------- game logic ---------------- */
let screen = "setup";           // setup | hub | service | cook | result | dayend
let day = null;                 // current day session
let cook = null;                // active rhythm session
let rafId = 0;
let timers = [];
const later = (fn, ms) => { timers.push(setTimeout(fn, ms)); };
function clearTimers() { timers.forEach(clearTimeout); timers = []; }

function customerCount() {
  return Math.max(2, Math.round(3 + (S.rep / 100) * 9 + Math.floor((S.day - 1) / 3)));
}
function makeCustomer(forceVip) {
  const list = unlockedList();
  const vipChance = S.day >= 2 ? 0.1 + S.rep / 500 : 0;
  const vip = forceVip || Math.random() < vipChance;
  let recipe;
  if (vip) {
    const top = list.slice(-3);
    recipe = (S.vipGood >= SECRET_VIP_NEEDED && Math.random() < .35) ? RECIPES[RECIPES.length - 1] : pick(top);
  } else {
    recipe = pick(list.filter(r => !r.secret));
  }
  const v = vip ? pick(VIPS) : null;
  return {vip, name: v ? v.name : pick(NAMES), face: v ? v.face : pick(FACES), recipe};
}
function startDay() {
  const n = customerCount();
  const queue = [];
  for (let i = 0; i < n; i++) queue.push(makeCustomer(false));
  day = {queue, total: n, earned: 0, served: [], startRep: S.rep, startServed: S.served, unlockedNow: [], log: []};
  nextCustomer();
}
function nextCustomer() {
  if (!day.queue.length) return endDay();
  day.current = day.queue.shift();
  screen = "service"; render();
}

/* score a finished order */
function evaluate(c, score) {
  const q = clamp(score * 0.8 + 20, 0, 100);
  const st = q >= 90 ? 5 : q >= 76 ? 4 : q >= 58 ? 3 : q >= 38 ? 2 : 1;
  let pay = c.recipe.price * [0.2, 0.5, 0.8, 1, 1.2][st - 1];
  if (st === 5) pay *= 1.25;           // tip
  if (c.vip) pay *= 2.5;
  pay = Math.round(pay * payBonus());
  let rep = [-7, -4, -1, 1.5, 3][st - 1];
  if (c.vip) rep *= rep < 0 ? 2 : 1.5;
  let review;
  if (st === 5) review = pick(["Chef's kiss! Best egg ever!", "Perfect cook, perfect plate!", "I'm telling EVERYONE about this place."]);
  else if (st === 4) review = pick(["Really tasty, would come back!", "Nice and crispy. Solid!"]);
  else if (st === 3) review = pick(["It's okay. Decent diner food.", "Not bad, not great."]);
  else if (st === 2) review = pick(["Rubbery and a bit burnt...", "Meh. I've had better."]);
  else review = pick(["Burnt! The smoke alarm is applauding.", "I want my money back!"]);
  return {st, pay, rep, review, vip: c.vip, customer: c, recipe: c.recipe};
}
function applyResult(r) {
  S.cash += r.pay; S.rep = clamp(S.rep + r.rep, 0, 100); S.served++; S.best = Math.max(S.best, S.cash);
  if (r.vip) { S.vipTotal++; if (r.st >= 4) S.vipGood++; }
  day.earned += r.pay; day.served.push(r);
}
function chefsServe() {
  const logs = [];
  S.chefs.forEach((id) => {
    const ch = CHEFS.find(x => x.id === id);
    const i = day.queue.findIndex(c => !c.vip);
    if (!ch || i < 0) return;
    const c = day.queue.splice(i, 1)[0];
    const score = clamp(ch.skill + rnd(-15, 12), 5, 100);
    const r = evaluate(c, score);
    applyResult(r);
    logs.push(`${ch.em} ${ch.name} served ${c.name} a ${c.recipe.name} — ${stars(r.st)} (${money(r.pay)})`);
  });
  return logs;
}
function checkUnlocks() {
  const out = [];
  RECIPES.forEach(r => { if (unlocked(r) && !S.seen.includes(r.id)) { S.seen.push(r.id); out.push(r); } });
  return out;
}
function endDay() {
  const wages = [];
  let paid = 0;
  [...S.chefs].forEach(id => {
    const ch = CHEFS.find(x => x.id === id);
    if (S.cash >= ch.wage) { S.cash -= ch.wage; paid += ch.wage; }
    else { S.chefs.splice(S.chefs.indexOf(id), 1); wages.push(`${ch.em} A ${ch.name} quit — you couldn't pay them!`); }
  });
  day.wagesPaid = paid; day.quit = wages;
  day.endRep = S.rep;
  S.day++;
  save();
  screen = "dayend"; render();
}

/* ---------------- rhythm mini game ---------------- */
function startCook() {
  const r = day.current.recipe;
  cook = {zone: Math.min(.8, r.zone * zoneBonus()), recipe: r, pos: .5, dir: 1, target: rnd(.15, .35), done: 0, pts: 0, results: [], lock: false, fb: null, particles: [], pid: 1};
  clearTimers();
  sfx("start");
  screen = "cook"; render();
  let last = performance.now();
  cancelAnimationFrame(rafId);
  const loop = (t) => {
    if (screen !== "cook") return;
    const dt = Math.min((t - last) / 1000, .05); last = t;
    const near = Math.abs(cook.pos - cook.target) < cook.zone * .5 ? .85 : 1; // ball eases off near the zone
    const speed = .6 * (1 + cook.done * .035) * r.speed * near;
    cook.pos += cook.dir * speed * dt;
    if (cook.pos >= 1) { cook.pos = 1; cook.dir = -1; tone(300, .05, "triangle", .08); } else if (cook.pos <= 0) { cook.pos = 0; cook.dir = 1; tone(300, .05, "triangle", .08); }
    const ball = $("#ball"), zone = $("#zone");
    if (ball) ball.style.top = (cook.pos * 100) + "%";
    if (zone) zone.style.boxShadow = Math.abs(cook.pos - cook.target) <= cook.zone / 2 ? "0 0 20px 5px rgba(34,197,94,.85)" : "none";
    rafId = requestAnimationFrame(loop);
  };
  rafId = requestAnimationFrame(loop);
}
function flip() {
  if (screen !== "cook" || cook.lock || cook.done >= cook.recipe.flips) return;
  cook.lock = true; setTimeout(() => { if (cook) cook.lock = false; }, 260);
  const r = cook.recipe, half = cook.zone / 2, d = Math.abs(cook.pos - cook.target);
  const res = d <= half * .55 ? "perfect" : d <= half * 1.1 ? "good" : "miss";
  sfx(res);
  cook.pts += res === "perfect" ? 10 : res === "good" ? 7 : 0;
  cook.results.push(res); cook.done++;
  cook.fb = res; cook.fbKey = Math.random();
  const n = res === "miss" ? 4 : 7;
  for (let i = 0; i < n; i++) cook.particles.push({id: cook.pid++, k: res === "miss" ? "k" : "s", x: rnd(52, 88), y: rnd(26, 48)});
  cook.shake = res !== "miss";
  if (cook.done >= r.flips) {
    cancelAnimationFrame(rafId);
    cook.score = Math.round(cook.pts / (r.flips * 10) * 100);
    paint();
    later(finishOrder, 1000);
    return;
  }
  do { cook.target = rnd(.16, .84); } while (Math.abs(cook.target - cook.pos) < .3);
  paint();
  later(() => { if (cook) { cook.particles = []; cook.shake = false; } }, 1000);
}
function eggStage() {
  const good = cook.results.filter(x => x !== "miss").length / cook.recipe.flips;
  return good >= .9 ? 3 : good >= .6 ? 2 : good >= .3 ? 1 : 0;
}
function burns() { return cook.results.filter(x => x === "miss").length; }

function finishOrder() {
  const r = evaluate(day.current, cook.score);
  applyResult(r); day.last = r;
  day.chefLog = chefsServe();
  day.newUnlocks = checkUnlocks();
  if (day.newUnlocks.length) sfx("unlock"); else if (r.st >= 4) sfx("cash"); else if (r.st <= 2) sfx("miss");
  save();
  screen = "result"; render();
}

/* ---------------- rendering ---------------- */
function hud() {
  const el = $("#hud");
  if (screen === "setup") { el.innerHTML = muteBtn(); return; }
  const home = screen === "hub" ? "" : `<button class="pill" data-act="home" aria-label="Back to the café" style="cursor:pointer">🏠 Home</button>`;
  el.innerHTML = `${home}<span class="pill gold">💰 ${money(S.cash)}</span><span class="pill">📅 Day ${S.day}</span><span class="pill" title="Reputation">${stars(Math.round(S.rep / 20))}</span>${muteBtn()}`;
}
function muteBtn() { return `<button class="pill" data-act="mute" aria-label="Toggle sound" style="cursor:pointer">${muted ? "🔇" : "🔊"}</button>`; }

function render() {
  hud();
  const app = $("#app");
  const fn = {setup: vSetup, hub: vHub, service: vService, cook: vCook, result: vResult, dayend: vDayEnd}[screen];
  app.innerHTML = fn();
  window.scrollTo({top: 0});
}
/* lightweight updates during the rhythm game */
function paint() {
  const f = $("#fb"), p = $("#parts"), chef = $("#chef"), dots = $("#dots"), pts = $("#pts");
  if (!f) return;
  f.innerHTML = cook.fb ? `<div class="fb" key="${cook.fbKey}" style="color:${cook.fb === "perfect" ? "#16a34a" : cook.fb === "good" ? "#d97706" : "#ef4444"}">${cook.fb === "perfect" ? "PERFECT! +10" : cook.fb === "good" ? "Good! +7" : "Miss!"}</div>` : "";
  p.innerHTML = cook.particles.map(q => `<div class="part ${q.k}" style="left:${q.x}%;top:${q.y}%"></div>`).join("");
  chef.className = cook.shake ? "shake" : "";
  chef.innerHTML = `<div class="bob">${chefSvg("pan", eggStage(), burns())}</div>`;
  dots.innerHTML = dotsHtml();
  pts.textContent = cook.pts;
  const z = $("#zone");
  if (z) z.style.top = ((cook.target - cook.zone / 2) * 100) + "%";
}
function dotsHtml() {
  let h = "";
  for (let i = 0; i < cook.recipe.flips; i++) {
    const r = cook.results[i];
    h += `<span class="dot" style="background:${r === "perfect" ? "#22c55e" : r === "good" ? "#facc15" : r === "miss" ? "#ef4444" : "#fff"}"></span>`;
  }
  return h;
}

function vSetup() {
  return `<div class="col center" style="padding-top:8px">
    <div><h2 class="big"><span class="wig">Egg Rhythm Café!</span></h2><p style="font-size:1.3rem">Cook to the beat, run a restaurant, impress the VIPs.</p></div>
    <div class="grid2">
      <div class="card bob">${chefSvg("pan", 0, 0)}</div>
      <div class="card" style="text-align:left;display:flex;flex-direction:column;gap:10px;justify-content:center">
        <h3 style="font-size:1.6rem">How to play</h3>
        <p>Tap <b>FLIP!</b> (or press <b>SPACE</b>) when the ball is in the <b style="color:#16a34a">green zone</b> to cook each order.</p>
        <p>Great food earns cash and reputation. Burnt plates mean bad reviews and fewer customers.</p>
        <p>Hire chefs to help, unlock new recipes the more you serve, and cook for VIPs to find the secret recipe.</p>
      </div>
    </div>
    <button class="btn" data-act="begin">Open my café!</button>
  </div>`;
}

function vHub() {
  const nUnlocked = unlockedList().length;
  const hired = S.chefs.map(id => CHEFS.find(c => c.id === id));
  const wages = hired.reduce((a, c) => a + c.wage, 0);
  const recipeCards = RECIPES.map(r => {
    if (r.secret && !unlocked(r)) return `<div class="recipe locked secret"><span class="em">❓</span><div><b>Secret recipe</b><span class="muted">Impress ${SECRET_VIP_NEEDED} VIPs with 4★+ (${Math.min(S.vipGood, SECRET_VIP_NEEDED)}/${SECRET_VIP_NEEDED})</span></div></div>`;
    if (!unlocked(r)) return `<div class="recipe locked"><span class="em">🔒</span><div><b>${r.name}</b><span class="muted">Serve ${r.need} customers (${S.served}/${r.need}) · ${money(r.price)}</span></div></div>`;
    return `<div class="recipe ${r.secret ? "secret" : ""}"><span class="em">${r.em}</span><div><b>${r.name}${r.secret ? " 🤫" : ""}</b><span class="muted">${money(r.price)} · ${r.flips} flips</span></div></div>`;
  }).join("");
  const chefRows = CHEFS.map(c => {
    const can = S.cash >= c.cost && S.chefs.length < MAX_CHEFS;
    return `<div class="chefrow"><div><b>${c.em} ${c.name}</b><div class="muted" style="font-size:.9rem">Cooks ~${c.skill}% quality · ${money(c.wage)}/day</div></div>
      <button class="btn sm ${can ? "green" : "gray"}" data-act="hire" data-id="${c.id}" ${can ? "" : "disabled"}>Hire ${money(c.cost)}</button></div>`;
  }).join("");
  const rosterHtml = hired.length ? `<p class="muted" style="margin-top:4px">Your team (${hired.length}/${MAX_CHEFS}): ${hired.map(c => c.em).join(" ")} · wages ${money(wages)}/day</p>` : `<p class="muted">No helpers yet — hired chefs cook for you automatically (but VIPs always want <i>you</i>).</p>`;
  return `<div class="col">
    <div class="stat">
      <span class="chip" style="background:#fff">Reputation <span class="bar" style="display:inline-block;width:110px;height:12px;vertical-align:middle"><i style="width:${S.rep}%"></i></span> ${Math.round(S.rep)}%</span>
      <span class="chip" style="background:#fff">🍽️ ${S.served} served</span>
      <span class="chip" style="background:#fff">👑 ${S.vipTotal} VIPs</span>
      ${S.rebirths ? `<span class="chip" style="background:#fef3c7">✨ Rebirth ${S.rebirths}</span>` : ""}
    </div>
    <div class="card center" style="width:100%">
      <h2 style="font-size:1.8rem">Day ${S.day} — about ${customerCount()} customers expected</h2>
      <p class="muted" style="margin:4px 0 12px">${S.rep >= 70 ? "Word is out — the café is buzzing!" : S.rep >= 40 ? "Steady business." : "Bad reviews are keeping people away. Cook better!"}</p>
      <button class="btn" data-act="open">🍳 Open for business!</button>
    </div>
    ${S.rebirths ? `<div class="card" style="width:100%"><h3 style="font-size:1.4rem;margin-bottom:8px">🎁 Rebirth gifts</h3><div class="row" style="justify-content:flex-start">${GIFTS.map((g, i) => giftCount(i) ? `<span class="chip" style="background:#fef3c7">${g.em} ${g.name} ×${giftCount(i)} — ${g.desc}</span>` : "").join("")}</div></div>` : ""}
    <div class="grid2">
      <div class="card"><h3 style="font-size:1.4rem;margin-bottom:8px">📖 Menu (${nUnlocked}/${RECIPES.length})</h3><div style="display:grid;gap:8px">${recipeCards}</div></div>
      <div class="card"><h3 style="font-size:1.4rem;margin-bottom:8px">👩‍🍳 Hire help</h3>${chefRows}${rosterHtml}
        <div class="row" style="margin-top:12px"><button class="btn sm ${S.served >= REBIRTH_NEED ? "" : "gray"}" data-act="rebirth" ${S.served >= REBIRTH_NEED ? "" : "disabled"}>✨ Rebirth</button></div>
        <p class="muted" style="font-size:.9rem;text-align:center;margin-top:6px">${S.served >= REBIRTH_NEED ? "Start over and earn a permanent gift!" : `Rebirth unlocks after ${REBIRTH_NEED} customers served (${S.served}/${REBIRTH_NEED}).`}</p>
      </div>
    </div>
  </div>`;
}

function custCard(c) {
  return `<div class="card ${c.vip ? "vipcard" : ""}" style="text-align:center;width:100%;max-width:440px">
    ${c.vip ? `<span class="vip">👑 VIP — pays 2.5×</span>` : ""}
    <div class="face bob">${c.face}</div>
    <h3 style="font-size:1.6rem">${c.name}</h3>
    <p style="font-size:1.3rem;margin-top:4px">Orders: <b>${c.recipe.em} ${c.recipe.name}</b></p>
    <p class="muted">Pays up to ${money(c.recipe.price * (c.vip ? 2.5 : 1) * 1.25)}</p>
  </div>`;
}
function vService() {
  const left = day.queue.length;
  return `<div class="col center">
    <h2 class="big">Order up!</h2>
    ${custCard(day.current)}
    <p class="muted" style="font-size:1.1rem">${left} more customer${left === 1 ? "" : "s"} waiting${S.chefs.length ? ` · ${S.chefs.length} chef${S.chefs.length > 1 ? "s" : ""} helping` : ""}</p>
    <button class="btn" data-act="cook">Start Cooking!</button>
  </div>`;
}
function vCook() {
  const r = cook.recipe;
  return `<div>
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <div id="dots">${dotsHtml()}</div>
      <span class="pill gold">${r.em} ${r.name} · <span id="pts">${cook.pts}</span> pts</span>
    </div>
    <p class="center" style="font-size:1.3rem;font-weight:700;margin-bottom:10px">Tap <span style="color:#d97706">FLIP!</span> (or the bar, or SPACE) when the ball is in the <span style="color:#16a34a">green zone</span>!</p>
    <div class="cookgrid">
      <div class="card" style="position:relative;overflow:hidden">
        <div style="position:absolute;top:10px;left:14px;font-size:1.2rem;font-weight:700;z-index:3">🧑‍🍳 For ${day.current.name}${day.current.vip ? " 👑" : ""}</div>
        <div id="fb"></div><div id="parts"></div>
        <div id="chef" style="padding-top:24px"><div class="bob">${chefSvg("pan", eggStage(), burns())}</div></div>
      </div>
      <div class="card col" style="gap:10px;padding:10px">
        <b style="font-size:1.4rem">RHYTHM</b>
        <div class="track" id="track" tabindex="0" role="button" aria-label="Rhythm bar">
          <div class="zone" id="zone" style="top:${(cook.target - cook.zone / 2) * 100}%;height:${cook.zone * 100}%"></div>
          <div class="ball" id="ball" style="top:${cook.pos * 100}%"><i></i><b></b></div>
        </div>
        <button class="btn" data-act="flip" style="width:100%;padding:8px">FLIP!</button>
        <span class="muted" style="font-size:.9rem;margin-top:-6px">…or press SPACE</span>
      </div>
    </div>
  </div>`;
}
function vResult() {
  const r = day.last, c = r.customer, face = r.st >= 4 ? "😋" : r.st === 3 ? "😐" : "😖";
  const left = day.queue.length;
  return `<div class="col center">
    <h2 class="big">The verdict!</h2>
    <div class="card ${c.vip ? "vipcard" : ""}" style="width:100%;max-width:460px">
      ${c.vip ? `<span class="vip">👑 VIP</span>` : ""}
      <div class="face">${face}</div>
      <p style="font-size:1.3rem;font-weight:700">${c.name} says:</p>
      <p style="font-size:1.3rem">"${r.review}"</p>
      <p style="font-size:2.2rem;color:#f59e0b;letter-spacing:2px">${stars(r.st)}</p>
      <div class="chips" style="margin:6px 0">
        <span class="chip" style="background:#bbf7d0">Perfect × ${cook.results.filter(x => x === "perfect").length}</span>
        <span class="chip" style="background:#fef08a">Good × ${cook.results.filter(x => x === "good").length}</span>
        <span class="chip" style="background:#fecaca">Miss × ${burns()}</span>
      </div>
      <p style="font-size:1.6rem;font-weight:700;color:#15803d">+${money(r.pay)}${r.st === 5 ? " (with tip!)" : ""}</p>
      <p class="muted">Reputation ${r.rep >= 0 ? "+" : ""}${(Math.round(r.rep * 10) / 10)}${r.rep < 0 ? " — bad review! Fewer customers will show up." : ""}</p>
    </div>
    ${day.newUnlocks.length ? day.newUnlocks.map(u => `<div class="banner">🎉 New recipe unlocked: ${u.em} ${u.name}${u.secret ? " — THE SECRET RECIPE!" : ""}</div>`).join("") : ""}
    ${day.chefLog.length ? `<div class="card" style="width:100%;max-width:460px;text-align:left"><b>While you cooked…</b>${day.chefLog.map(l => `<p class="muted">${l}</p>`).join("")}</div>` : ""}
    <button class="btn" data-act="next">${left || day.queue.length ? "Next customer →" : "Close up shop →"}</button>
  </div>`;
}
function vDayEnd() {
  const sv = day.served, n = sv.length;
  const avg = n ? sv.reduce((a, r) => a + r.st, 0) / n : 0;
  const delta = Math.round((S.rep - day.startRep) * 10) / 10;
  const news = checkUnlocks();
  return `<div class="col center">
    <h2 class="big">Day ${S.day - 1} complete!</h2>
    <div class="card" style="width:100%;max-width:460px;font-size:1.25rem;display:grid;gap:6px">
      <div>🍽️ Served <b>${n}</b> customers</div>
      <div>⭐ Average rating <b>${avg.toFixed(1)}</b> / 5</div>
      <div>💵 Earned <b style="color:#15803d">${money(day.earned)}</b></div>
      <div>🧾 Wages paid <b style="color:#b91c1c">−${money(day.wagesPaid)}</b></div>
      <div>📈 Reputation <b>${delta >= 0 ? "+" : ""}${delta}</b> → ${Math.round(S.rep)}%</div>
      <div>💰 Cash <b>${money(S.cash)}</b></div>
    </div>
    ${day.quit.map(q => `<div class="banner" style="background:#fecaca">${q}</div>`).join("")}
    ${news.map(u => `<div class="banner">🎉 New recipe unlocked: ${u.em} ${u.name}</div>`).join("")}
    ${S.rep < 30 ? `<p class="muted">Reputation is low — fewer customers will come tomorrow. Aim for 4★ plates!</p>` : ""}
    <button class="btn" data-act="hub">Back to the café</button>
  </div>`;
}

/* ---------------- events ---------------- */
document.addEventListener("pointerdown", (e) => {
  if (screen === "cook" && e.target.closest("#track")) { e.preventDefault(); flip(); }
  else if (screen === "cook" && e.target.closest('[data-act="flip"]')) { e.preventDefault(); flip(); }
});
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const a = b.dataset.act;
  if (a === "flip") return; // handled on pointerdown
  if (a === "mute") { muted = !muted; if (master) master.gain.value = muted ? 0 : .4; if (!muted) tone(740, .1, "triangle", .2); return render(); }
  if (a === "begin") {
    S.started = true;
    save(); screen = "hub"; return render();
  }
  if (a === "rebirth") {
    if (S.served < REBIRTH_NEED) return;
    const gift = GIFTS[S.rebirths % GIFTS.length];
    if (!confirm(`Be reborn? Your cash, days, recipes, reputation and chefs reset, but you keep your gifts and earn a new one: ${gift.em} ${gift.name} (${gift.desc}).`)) return;
    const n = S.rebirths + 1;
    S = fresh(); S.rebirths = n; S.started = true;
    S.cash = 150 * giftCount(1); S.rep = clamp(50 + 5 * giftCount(2), 0, 100);
    S.chefs = Array(giftCount(4)).fill("line").slice(0, MAX_CHEFS);
    sfx("unlock"); save(); day = null; cook = null; screen = "hub"; render(); return;
  }
  if (a === "hire") {
    const c = CHEFS.find(x => x.id === b.dataset.id);
    if (c && S.cash >= c.cost && S.chefs.length < MAX_CHEFS) { S.cash -= c.cost; S.chefs.push(c.id); sfx("cash"); save(); render(); }
    return;
  }
  if (a === "open") { try { audio(); } catch (er) {} return startDay(); }
  if (a === "cook") return startCook();
  if (a === "next") return day.queue.length ? nextCustomer() : endDay();
  if (a === "hub") { screen = "hub"; return render(); }
  if (a === "home") {
    if ((screen === "service" || screen === "cook") && !confirm("Go home? The rest of today's customers will leave.")) return;
    cancelAnimationFrame(rafId); clearTimers(); cook = null; day = null;
    screen = "hub"; return render();
  }
});
document.addEventListener("keydown", (e) => {
  if (e.code === "Space" && screen === "cook") { e.preventDefault(); flip(); }
  else if (e.key === "Enter" && screen === "cook" && document.activeElement && document.activeElement.id === "track") { e.preventDefault(); flip(); }
});

screen = S.started ? "hub" : "setup";
render();
</script>
</body>
</html>
