<!DOCTYPE html>

<title>A Little Adventure for Mia</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#160a32;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px;font-family:'Nunito',sans-serif}
#gm{
  width:100%;max-width:640px;position:relative;
  border-radius:20px;overflow:hidden;background:#100828;
  box-shadow:0 12px 44px rgba(60,20,100,.4);
}
#gm svg{width:100%;height:auto;display:block}
.stag{
  position:absolute;top:12px;left:50%;transform:translateX(-50%);
  background:rgba(255,255,255,.85);color:#7040A8;
  font-size:11px;font-weight:800;padding:4px 14px;
  border-radius:20px;letter-spacing:.7px;text-transform:uppercase;
  z-index:5;pointer-events:none;white-space:nowrap;
}
.hint{
  position:absolute;bottom:58px;left:50%;transform:translateX(-50%);
  color:rgba(255,255,255,.88);font-size:11.5px;font-weight:700;
  white-space:nowrap;pointer-events:none;animation:bob 2s ease-in-out infinite;
  text-shadow:0 1px 3px rgba(0,0,0,.3);
}
@keyframes bob{
  0%,100%{transform:translateX(-50%) translateY(0);opacity:.6}
  50%{transform:translateX(-50%) translateY(-4px);opacity:1}
}
.mc{
  position:absolute;left:50%;top:43%;transform:translate(-50%,-50%);
  background:rgba(255,255,255,.97);border-radius:18px;
  padding:18px 26px 16px;max-width:78%;text-align:center;z-index:30;display:none;
}
.mc.on{display:block;animation:pop .32s cubic-bezier(.175,.885,.32,1.275) forwards}
@keyframes pop{
  from{transform:translate(-50%,-50%) scale(.6);opacity:0}
  to{transform:translate(-50%,-50%) scale(1);opacity:1}
}
.mc p{color:#5A3878;font-size:14px;font-weight:600;line-height:1.55}
.mcx{
  position:absolute;top:8px;right:13px;font-size:19px;color:#C890E0;
  cursor:pointer;font-weight:800;background:none;border:none;
  font-family:'Nunito',sans-serif;line-height:1;
}
.mcx:hover{color:#7040A8}
.nav{
  position:absolute;bottom:13px;left:0;right:0;
  display:flex;justify-content:center;gap:10px;z-index:20;
}
.btn{
  font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;
  padding:7px 18px;border-radius:25px;border:none;cursor:pointer;
  transition:transform .14s;letter-spacing:.3px;
}
.btn:hover{transform:scale(1.07)}
.btn:active{transform:scale(.96)}
.btnp{background:rgba(255,255,255,.93);color:#7040A8}
.btns{background:rgba(255,255,255,.42);color:white}
.btnbig{font-size:15px;padding:10px 28px;background:rgba(255,255,255,.93);color:#7040A8}
@keyframes sp{0%,100%{opacity:.8;transform:scale(1)}50%{opacity:1;transform:scale(1.22)}}
.sp{cursor:pointer;transform-box:fill-box;transform-origin:center;animation:sp 1.65s ease-in-out infinite}
#cf{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;overflow:hidden;z-index:15}
@keyframes cffall{0%{transform:translateY(-30px) rotate(0deg);opacity:.95}100%{transform:translateY(520px) rotate(720deg);opacity:0}}
</style>
</head>

let cur=0;

function mkRand(seed){let s=seed;return()=>{s=(s*1664525+1013904223)&0xFFFFFFFF;return(s>>>0)/4294967296};}
function starField(n,x0,y0,x1,y1,seed){
  const r=mkRand(seed||54321);let out='';
  for(let i=0;i<n;i++){
    const x=(x0+r()*(x1-x0)).toFixed(1),y=(y0+r()*(y1-y0)).toFixed(1);
    const rad=(.7+r()*1.8).toFixed(1),op=(.35+r()*.65).toFixed(2);
    out+=`<circle cx="${x}" cy="${y}" r="${rad}" fill="white" opacity="${op}"/>`;
  }return out;
}

function confetti(){
  const w=document.getElementById('cf');if(!w)return;w.innerHTML='';
  const cs=['#FF6090','#FFE040','#60E8FF','#80FF90','#FF9040','#C080FF','#FFFFFF','#FF6060'];
  for(let i=0;i<55;i++){
    const d=document.createElement('div');
    const sz=6+Math.random()*7;
    d.style.cssText=`position:absolute;top:${-20-Math.random()*120}px;left:${Math.random()*100}%;width:${sz}px;height:${sz}px;background:${cs[i%8]};border-radius:${Math.random()>.5?'50%':'2px'};opacity:.9;animation:cffall ${2+Math.random()*2.4}s ${Math.random()*2.2}s linear infinite;`;
    w.appendChild(d);
  }
}
