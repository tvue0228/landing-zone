<!DOCTYPE html>

<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;touch-action:none}
body{background:#0D0620;display:flex;align-items:center;justify-content:center;font-family:'Nunito',sans-serif}
#gm{
  position:relative;overflow:hidden;background:#100828;
  box-shadow:0 0 60px rgba(80,20,140,.5);
  width:min(100vw, calc(100vh * 390 / 680));
  height:min(100vh, calc(100vw * 680 / 390));
  max-height:100vh;max-width:100vw;
}
@media(min-width:500px){#gm{border-radius:28px}}
.sw{position:absolute;inset:0;will-change:transform}
.sw svg{width:100%;height:100%;display:block}
.stag{
  position:absolute;top:14px;left:50%;transform:translateX(-50%);
  background:rgba(255,255,255,.88);color:#7040A8;
  font-size:11px;font-weight:800;padding:5px 16px;border-radius:20px;
  letter-spacing:.8px;text-transform:uppercase;z-index:10;pointer-events:none;white-space:nowrap;
}
.hint{
  position:absolute;bottom:86px;left:50%;transform:translateX(-50%);
  color:rgba(255,255,255,.9);font-size:12px;font-weight:700;
  white-space:nowrap;pointer-events:none;z-index:10;
  animation:bob 2s ease-in-out infinite;text-shadow:0 1px 4px rgba(0,0,0,.4);
}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0);opacity:.65}50%{transform:translateX(-50%) translateY(-5px);opacity:1}}
.mc{
  position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);
  background:rgba(255,255,255,.97);border-radius:20px;
  padding:22px 28px 18px;max-width:84%;text-align:center;
  z-index:30;display:none;box-shadow:0 8px 32px rgba(80,20,140,.25);
}
.mc.on{display:block;animation:pop .32s cubic-bezier(.175,.885,.32,1.275) forwards}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.6);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.mc p{color:#5A3878;font-size:15px;font-weight:600;line-height:1.6}
.mcx{position:absolute;top:10px;right:14px;font-size:20px;color:#C890E0;cursor:pointer;font-weight:800;background:none;border:none;font-family:'Nunito',sans-serif;line-height:1;}
.mcx:hover{color:#7040A8}
.nav{position:absolute;bottom:16px;left:0;right:0;display:flex;justify-content:center;gap:12px;z-index:20;}
.btn{font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;padding:12px 28px;border-radius:30px;border:none;cursor:pointer;transition:transform .12s;letter-spacing:.3px;min-height:50px;min-width:110px;}
.btn:active{transform:scale(.93)}
.btnp{background:rgba(255,255,255,.95);color:#7040A8}
.btns{background:rgba(255,255,255,.3);color:white;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.btnbig{font-size:16px;padding:14px 38px;background:rgba(255,255,255,.95);color:#7040A8;min-width:190px}
@keyframes sp{0%,100%{opacity:.8;transform:scale(1)}50%{opacity:1;transform:scale(1.28)}}
.sp{cursor:pointer;transform-box:fill-box;transform-origin:center;animation:sp 1.8s ease-in-out infinite}
#cf{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:15}
@keyframes cffall{0%{transform:translateY(-30px) rotate(0deg);opacity:.95}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
@keyframes sparkfly{0%{transform:translate(0,0) scale(1.2);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
.spark{position:absolute;width:9px;height:9px;border-radius:50%;pointer-events:none;z-index:50;animation:sparkfly .65s ease-out forwards}
</style>
</head>
<body>
<div id="gm"></div>
<script>
let cur=0,moving=false,swX=0,swY=0;

// swipe
document.addEventListener('touchstart',e=>{swX=e.touches[0].clientX;swY=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-swX,dy=e.changedTouches[0].clientY-swY;
  if(Math.abs(dx)>Math.abs(dy)*1.2&&Math.abs(dx)>44){dx<0&&cur<6?go(cur+1,1):dx>0&&cur>0?go(cur-1,-1):null;}
},{passive:true});

function goNext(){if(cur<6)go(cur+1,1);}
function goBack(){if(cur>0)go(cur-1,-1);}

function go(n,dir=1){
  if(moving||n===cur)return;
  moving=true;
  const gm=document.getElementById('gm');
  const old=gm.querySelector('.sw');
  cur=n;
  const wrap=document.createElement('div');
  wrap.className='sw';
  wrap.innerHTML=getSVG(n);
  wrap.style.transform=`translateX(${dir>0?'100%':'-100%'})`;
  gm.appendChild(wrap);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const ease='cubic-bezier(.25,.46,.45,.94)';
    wrap.style.transition=`transform .4s ${ease}`;
    wrap.style.transform='translateX(0)';
    if(old){old.style.transition=`transform .4s ${ease}`;old.style.transform=`translateX(${dir>0?'-100%':'100%'})`;}
  }));
  setTimeout(()=>{if(old)old.remove();moving=false;if(n===6)confetti();},440);
}

function openMem(e){
  if(e)sparkle(e);
  const w=document.querySelector('.sw:last-child');
  const m=w?.querySelector('.mc');if(m)m.classList.add('on');
  const h=w?.querySelector('.hint');if(h)h.style.display='none';
}
function closeMem(){document.querySelectorAll('.mc.on').forEach(m=>m.classList.remove('on'));}

function sparkle(e){
  const gm=document.getElementById('gm');
  const r=gm.getBoundingClientRect();
  const cx=e.clientX-r.left,cy=e.clientY-r.top;
  const cs=['#FFE040','#FF80C8','#80E8FF','#A0FF80','#FF9040','#C080FF'];
  for(let i=0;i<10;i++){
    const s=document.createElement('div');s.className='spark';
    const a=(i/10)*Math.PI*2,d=38+Math.random()*22;
    s.style.cssText+=`left:${cx}px;top:${cy}px;background:${cs[i%6]};--dx:${(Math.cos(a)*d).toFixed(1)}px;--dy:${(Math.sin(a)*d).toFixed(1)}px;animation-delay:${i*18}ms`;
    gm.appendChild(s);setTimeout(()=>s.remove(),900);
  }
}

function mkRand(seed){let s=seed;return()=>{s=(s*1664525+1013904223)&0xFFFFFFFF;return(s>>>0)/4294967296;};}
function stars(n,x0,y0,x1,y1,seed){
  const r=mkRand(seed||54321);let o='';
  for(let i=0;i<n;i++){const x=(x0+r()*(x1-x0)).toFixed(1),y=(y0+r()*(y1-y0)).toFixed(1),rad=(.6+r()*1.6).toFixed(1),op=(.3+r()*.7).toFixed(2);o+=`<circle cx="${x}" cy="${y}" r="${rad}" fill="white" opacity="${op}"/>`;}
  return o;
}

    d.style.cssText=`position:absolute;top:${-20-Math.random()*120}px;left:${Math.random()*100}%;width:${sz}px;height:${sz}px;background:${cs[i%8]};border-radius:${Math.random()>.5?'50%':'2px'};opacity:.9;animation:cffall ${2+Math.random()*2.4}s ${Math.random()*2}s linear infinite;`;
    w.appendChild(d);
  }
}
