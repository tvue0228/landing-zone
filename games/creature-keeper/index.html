<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Creature Keeper</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none;}
html,body{height:100%;overflow:hidden;}
body{
  display:flex;flex-direction:column;
  background:#0d0b1e;
  font-family:'Press Start 2P',monospace;
  user-select:none;-webkit-user-select:none;
  color:#e2d9f3;
}
/* ── Canvas area ── */
#canvas-area{
  flex:1;display:flex;align-items:center;justify-content:center;
  padding:38px 8px 4px;position:relative;min-height:0;
}
#c{display:block;max-width:100%;max-height:100%;image-rendering:pixelated;}
#back{
  position:absolute;top:10px;left:12px;
  font-size:8px;color:#7c6faa;text-decoration:none;z-index:10;
  font-family:'Press Start 2P',monospace;
}
/* ── Controls ── */
#controls{
  display:none;flex-direction:column;flex-shrink:0;
  background:#12102a;border-top:2px solid #2a2560;
}
@media(pointer:coarse){#controls{display:flex;height:46vh;}}
/* ── Nav ── */
#nav{display:flex;border-bottom:2px solid #2a2560;flex-shrink:0;}
.nb{
  flex:1;border:none;background:none;
  padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:14px;color:#4a3d7a;cursor:pointer;touch-action:none;
}
.nb span{font-size:6px;font-family:'Press Start 2P',monospace;color:#4a3d7a;}
.nb.active{color:#c084fc;}
.nb.active span{color:#c084fc;}
/* ── Tab panels ── */
#tc{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0;}
.panel{display:none;flex-direction:column;height:100%;min-height:0;}
.panel.active{display:flex;}
/* ── Battle grid ── */
#battle-grid{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:4px;padding:4px;flex:1;
}
.cell{
  border:2px solid #2a2560;border-radius:6px;
  background:#0d0b1e;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;padding:4px 3px;
  cursor:pointer;touch-action:none;
  position:relative;overflow:hidden;
  transition:border-color .1s;
}
.cell canvas{image-rendering:pixelated;display:block;}
.cell .cname{font-size:6px;color:#c084fc;text-align:center;line-height:1.3;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.cell .clvl{font-size:5px;color:#7c6faa;}
.cell .bar-row{width:100%;display:flex;flex-direction:column;gap:2px;}
.bar{width:100%;height:5px;background:#1a1840;border-radius:2px;overflow:hidden;}
.bar-fill{height:100%;border-radius:2px;transition:width .15s;}
.hp-fill{background:#22c55e;}
.sp-fill{background:#3b82f6;}
.cell.charged{
  border-color:#fbbf24;
  animation:cpulse .65s ease-in-out infinite alternate;
}
@keyframes cpulse{
  from{box-shadow:0 0 6px #fbbf24,inset 0 0 8px #fbbf2422;}
  to{box-shadow:0 0 18px #fbbf24,inset 0 0 18px #fbbf2444;}
}
.cell.charged::after{
  content:'!';
  position:absolute;top:2px;right:4px;
  font-size:8px;color:#fbbf24;
  font-family:'Press Start 2P',monospace;
}
.cell.empty{border-style:dashed;opacity:.4;}
.cell.empty::before{content:'+';font-size:18px;color:#4a3d7a;}
.cell.dead{opacity:.35;filter:grayscale(1);}
/* ── Summon panel ── */
.summon-wrap{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;padding:12px;
}
.gold-display{font-size:10px;color:#fbbf24;letter-spacing:.05em;}
.egg-btn{
  width:80px;height:80px;border-radius:50%;border:3px solid #7c3aed;
  background:radial-gradient(circle at 40% 38%, #7c3aed, #1e1b4b);
  font-size:36px;cursor:pointer;touch-action:none;
  display:flex;align-items:center;justify-content:center;
  transition:transform .1s,box-shadow .1s;
  box-shadow:0 0 16px #7c3aed88;
}
.egg-btn:active{transform:scale(.93);}
.summon-cost{font-size:8px;color:#a78bfa;}
.summon-result{
  font-size:9px;text-align:center;min-height:32px;
  display:flex;flex-direction:column;align-items:center;gap:6px;
}
.rarity-common{color:#94a3b8;}
.rarity-uncommon{color:#22c55e;}
.rarity-rare{color:#3b82f6;}
.rarity-epic{color:#f59e0b;}
/* ── Collection panel ── */
.coll-wrap{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:4px;padding:4px;align-content:start;
}
.coll-wrap::-webkit-scrollbar{display:none;}
.ccard{
  border:2px solid #2a2560;border-radius:6px;
  background:#0d0b1e;padding:4px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  cursor:pointer;touch-action:none;
  transition:border-color .1s;
}
.ccard.in-party{border-color:#22c55e;}
.ccard canvas{image-rendering:pixelated;}
.ccard .cc-name{font-size:6px;color:#c084fc;text-align:center;}
.ccard .cc-lv{font-size:5px;color:#7c6faa;}
.ccard .cc-party{font-size:5px;color:#22c55e;}
/* ── Home panel ── */
.home-wrap{
  flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px;
}
.stat-row{display:flex;justify-content:space-between;align-items:center;font-size:8px;}
.stat-label{color:#7c6faa;}
.stat-val{color:#e2d9f3;}
.home-title{font-size:9px;color:#c084fc;text-align:center;margin-bottom:4px;}
/* Desktop fallback */
@media(pointer:fine){
  #controls{display:flex;height:42vh;}
}
.hidden{display:none!important;}
</style>
</head>
<body>

<div id="canvas-area">
  <a href="../../" id="back">← BACK</a>
  <canvas id="c" width="400" height="220"></canvas>
</div>

<div id="controls">
  <nav id="nav">
    <button class="nb active" data-tab="battle">⚔️<span>BATTLE</span></button>
    <button class="nb" data-tab="summon">🥚<span>SUMMON</span></button>
    <button class="nb" data-tab="collection">📦<span>ROSTER</span></button>
    <button class="nb" data-tab="home">🏠<span>HOME</span></button>
  </nav>
  <div id="tc">
    <!-- Battle panel -->
    <div class="panel active" id="tab-battle">
      <div id="battle-grid"></div>
    </div>
    <!-- Summon panel -->
    <div class="panel" id="tab-summon">
      <div class="summon-wrap">
        <div class="gold-display">💰 <span id="gold-count">0</span> GOLD</div>
        <button class="egg-btn" id="btn-summon">🥚</button>
        <div class="summon-cost">50 GOLD PER SUMMON</div>
        <div class="summon-result" id="summon-result"></div>
      </div>
    </div>
    <!-- Collection panel -->
    <div class="panel" id="tab-collection">
      <div class="coll-wrap" id="coll-grid"></div>
    </div>
    <!-- Home panel -->
    <div class="panel" id="tab-home">
      <div class="home-wrap">
        <div class="home-title">CREATURE KEEPER</div>
        <div class="stat-row"><span class="stat-label">ZONE</span><span class="stat-val" id="h-zone">1</span></div>
        <div class="stat-row"><span class="stat-label">WAVE</span><span class="stat-val" id="h-wave">1</span></div>
        <div class="stat-row"><span class="stat-label">GOLD</span><span class="stat-val" id="h-gold">0</span></div>
        <div class="stat-row"><span class="stat-label">CREATURES</span><span class="stat-val" id="h-count">0</span></div>
        <div class="stat-row"><span class="stat-label">PARTY ATK</span><span class="stat-val" id="h-atk">0</span></div>
        <div class="stat-row"><span class="stat-label">HIGHEST WAVE</span><span class="stat-val" id="h-best">1</span></div>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';
// ─── Canvas setup ────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
const W = 400, H = 220;
const isTouch = window.matchMedia('(pointer:coarse)').matches;

// ─── Pixel helpers ────────────────────────────────────────────────────────────
// P(ctx, ox, oy, pw): returns a fill helper
const P = (ox,oy,pw) => (x,y,w,h,c) => {
  ctx.fillStyle = c;
  ctx.fillRect(ox+x*pw, oy+y*pw, w*pw, h*pw);
};

// ─── Creature sprite drawing functions (12×10 grid, pw=4 → 48×40) ────────────
// Grid: x=0..11, y=0..9

function drawSlime(ctx, ox, oy, pw) {
  const f = P(ox,oy,pw);
  const [D,M,B,L] = ['#0a5c0a','#1aac1a','#26e026','#72ff72'];
  f(4,0,4,1,M); f(5,0,2,1,B);                    // top dome
  f(3,1,6,1,M); f(4,1,3,1,B);
  f(2,2,8,2,M); f(3,2,4,1,B);                    // wide body
  f(1,4,10,2,M);
  f(2,6,8,1,M); f(3,7,6,1,M); f(4,8,4,1,D);      // bottom
  f(3,3,2,2,'#fff'); f(7,3,2,2,'#fff');           // eyes white
  f(4,4,1,1,'#000'); f(8,4,1,1,'#000');           // pupils
  f(3,3,1,1,'#fff'); f(7,3,1,1,'#fff');           // shine
  f(4,6,1,1,D); f(6,6,2,1,D); f(9,6,1,1,D);      // smile dots
}

function drawSprout(ctx, ox, oy, pw) {
  const f = P(ox,oy,pw);
  // leaf
  f(2,2,5,3,'#1aac1a'); f(3,1,3,2,'#26e026'); f(2,2,2,1,'#72ff72');
  // bud
  f(5,0,3,2,'#f472b6'); f(6,0,1,1,'#fbbf24');
  // stem
  f(5,4,2,5,'#7c3b1a'); f(5,3,2,1,'#1aac1a');
  // roots
  f(4,9,4,1,'#7c3b1a'); f(3,9,1,1,'#7c3b1a'); f(8,9,1,1,'#7c3b1a');
}

function drawFoxkit(ctx, ox, oy, pw) {
  const f = P(ox,oy,pw);
  const [O,LO,W2,D2] = ['#d97706','#fbbf24','#fef3c7','#92400e'];
  // ears
  f(2,0,2,2,O); f(8,0,2,2,O);
  f(3,0,1,1,D2); f(9,0,1,1,D2);           // inner ear
  // head
  f(3,2,6,4,O); f(3,2,4,1,LO);            // head + highlight
  // face
  f(4,2,4,2,W2); f(4,3,4,2,W2);           // white face patch
  // eyes
  f(3,3,2,1,'#000'); f(7,3,2,1,'#000');   // eye stripe
  f(3,2,1,1,'#fff'); f(7,2,1,1,'#fff');   // shine
  // nose
  f(5,5,2,1,'#000'); f(6,5,1,1,'#d97706');
  // body
  f(3,6,6,3,O); f(4,6,4,1,LO);
  // tail
  f(9,7,3,2,LO); f(9,8,3,1,'#fff');
  // ears inner
  f(2,0,1,1,LO); f(8,0,1,1,LO);
}

function drawMushy(ctx, ox, oy, pw) {
  const f = P(ox,oy,pw);
  // cap
  f(3,0,6,1,'#dc2626'); f(2,1,8,1,'#dc2626'); f(1,2,10,3,'#dc2626');
  f(4,0,4,1,'#ef4444'); // highlight
  // spots
  f(3,1,2,2,'#fff'); f(7,2,2,2,'#fff'); f(5,3,1,1,'#fff');
  // stem / face
  f(3,5,6,4,'#fef3c7');
  f(4,5,4,1,'#fff');
  // eyes
  f(4,6,2,2,'#000'); f(7,6,2,2,'#000');
  f(4,6,1,1,'#fff'); f(7,6,1,1,'#fff');  // shine
  // mouth
  f(4,8,1,1,'#000'); f(6,8,2,1,'#000');
}

function drawGolem(ctx, ox, oy, pw) {
  const f = P(ox,oy,pw);
  const [S,L2,D2,C] = ['#64748b','#94a3b8','#334155','#22d3ee'];
  // body block
  f(1,1,10,8,S);
  f(1,1,10,2,L2);  // top highlight
  f(1,7,10,2,D2);  // bottom shadow
  // cracks
  f(4,2,1,3,D2); f(8,4,1,3,D2); f(5,6,2,1,D2);
  // eyes (glowing)
  f(3,3,2,2,'#000'); f(7,3,2,2,'#000');
  f(3,3,2,2,C+'88'); f(7,3,2,2,C+'88'); // glow tint
  f(4,3,1,1,C); f(8,3,1,1,C);           // bright center
  // arms
  f(0,2,1,5,S); f(11,2,1,5,S);
  f(0,2,1,2,L2); f(11,2,1,2,L2);
}

function drawWisp(ctx, ox, oy, pw) {
  const f = P(ox,oy,pw);
  const [P2,L2,G,W2] = ['#7c3aed','#a855f7','#c4b5fd','#fff'];
  // tail (bottom)
  f(5,8,2,2,P2); f(4,7,1,2,P2); f(7,7,1,2,P2); f(3,7,1,1,P2); f(8,7,1,1,P2);
  f(5,6,2,2,P2); f(4,6,1,1,P2); f(7,6,1,1,P2);
  // orb body
  f(4,2,4,5,P2); f(3,3,6,3,P2); // orb fill
  f(4,2,4,1,L2); f(3,3,1,1,L2); f(3,2,2,1,L2); // bright edges
  // glow rim
  f(4,1,4,1,G+'88'); f(3,2,1,1,G+'88'); f(8,2,1,1,G+'88');
  // white core
  f(5,3,2,2,W2); f(6,3,1,1,W2);
  // face
  f(4,4,2,1,'#1e0066'); f(7,4,2,1,'#1e0066'); // eyes
  f(4,4,1,1,G); f(7,4,1,1,G); // shine
}

function drawShadowPup(ctx, ox, oy, pw) {
  const f = P(ox,oy,pw);
  const [D2,M2,G] = ['#0f0a1e','#1e1040','#fbbf24'];
  // ears
  f(3,0,2,2,D2); f(8,0,2,2,D2);
  // head
  f(3,2,6,4,M2); f(3,2,4,1,'#2a1a50');
  // snout
  f(4,4,4,2,D2);
  // eyes (glowing)
  f(3,3,2,1,G); f(8,3,2,1,G);
  f(3,3,1,1,'#fff'); f(8,3,1,1,'#fff');
  // body
  f(2,6,7,3,M2); f(2,6,5,1,'#2a1a50');
  // tail
  f(9,6,3,2,D2); f(10,5,2,1,D2);
  // legs
  f(3,8,2,2,D2); f(7,8,2,2,D2);
  // nose
  f(5,5,2,1,'#000'); f(6,5,1,1,'#333');
}

function drawScrapBot(ctx, ox, oy, pw) {
  const f = P(ox,oy,pw);
  const [S,L2,D2,O2] = ['#475569','#94a3b8','#1e293b','#f97316'];
  // antenna
  f(6,0,1,2,S); f(5,0,3,1,L2); f(6,0,1,1,O2);  // tip glows
  // head
  f(3,2,6,4,S); f(3,2,6,1,L2);
  // visor screen
  f(4,3,4,2,D2); f(4,3,4,1,'#0ea5e9'+'66');
  f(5,3,2,1,O2); // active dot
  // body
  f(2,6,8,3,S); f(2,6,8,1,L2); f(2,8,8,1,D2);
  // arm joints
  f(1,6,1,2,D2); f(10,6,1,2,D2);
  f(0,7,1,2,S); f(11,7,1,2,S);
  // vents on body
  f(4,7,1,1,D2); f(6,7,1,1,D2); f(8,7,1,1,D2);
  // legs
  f(3,9,2,1,D2); f(7,9,2,1,D2);
}

// ─── Creature definitions ─────────────────────────────────────────────────────
const DEFS = [
  {id:'slime',     name:'SLIME',    type:'forest', rarity:'common',   col:'#1aac1a',
   atk:8,  def:4, hp:90,  spd:2.5, charge:8,  spec:'BOUNCE',   sfx:'dmg3x',  evolveAt:15, evolvesTo:'megaslime', draw:drawSlime},
  {id:'sprout',    name:'SPROUT',   type:'forest', rarity:'common',   col:'#22c55e',
   atk:6,  def:6, hp:100, spd:3.0, charge:10, spec:'BLOOM',    sfx:'dmg3x',  evolveAt:null,evolvesTo:null, draw:drawSprout},
  {id:'foxkit',    name:'FOXKIT',   type:'forest', rarity:'uncommon', col:'#d97706',
   atk:14, def:3, hp:70,  spd:1.8, charge:7,  spec:'SWIFT',    sfx:'dmg2x',  evolveAt:12, evolvesTo:'elderfox', draw:drawFoxkit},
  {id:'mushy',     name:'MUSHY',    type:'forest', rarity:'common',   col:'#dc2626',
   atk:7,  def:8, hp:110, spd:3.5, charge:12, spec:'SPORES',   sfx:'dmg2x',  evolveAt:null,evolvesTo:null, draw:drawMushy},
  {id:'golem',     name:'GOLEM',    type:'ruins',  rarity:'common',   col:'#64748b',
   atk:12, def:12,hp:150, spd:4.0, charge:14, spec:'SLAM',     sfx:'dmg4x',  evolveAt:null,evolvesTo:null, draw:drawGolem},
  {id:'wisp',      name:'WISP',     type:'ruins',  rarity:'uncommon', col:'#a855f7',
   atk:16, def:2, hp:60,  spd:2.0, charge:9,  spec:'BURST',    sfx:'dmg3x',  evolveAt:10, evolvesTo:null, draw:drawWisp},
  {id:'shadowpup', name:'SHAD-PUP', type:'void',   rarity:'uncommon', col:'#1e1040',
   atk:18, def:5, hp:80,  spd:2.2, charge:8,  spec:'FANG',     sfx:'dmg3x',  evolveAt:null,evolvesTo:null, draw:drawShadowPup},
  {id:'scrapbot',  name:'SCRAPBOT', type:'waste',  rarity:'common',   col:'#475569',
   atk:10, def:10,hp:120, spd:3.2, charge:11, spec:'ZAPPER',   sfx:'dmg3x',  evolveAt:null,evolvesTo:null, draw:drawScrapBot},
];

const RARITY_W = {common:50, uncommon:35, rare:13, epic:2};
const SUMMON_COST = 50;

// ─── Enemy drawing functions (larger pw on canvas) ────────────────────────────
function drawEnemyGoblin(ctx, ox, oy, pw) {
  const f = P(ox,oy,pw);
  // body
  f(3,4,6,5,'#4d7c0f'); f(3,4,6,1,'#84cc16');
  // head
  f(3,1,6,4,'#65a30d'); f(3,1,4,1,'#84cc16');
  // ears
  f(2,2,1,2,'#65a30d'); f(9,2,1,2,'#65a30d');
  // eyes
  f(4,2,2,1,'#dc2626'); f(7,2,2,1,'#dc2626');
  f(4,2,1,1,'#fff'); f(7,2,1,1,'#fff');
  // nose
  f(5,4,2,1,'#000');
  // arms
  f(1,5,2,3,'#4d7c0f'); f(9,5,2,3,'#4d7c0f');
  // weapon
  f(10,3,1,4,'#78716c'); f(10,3,2,1,'#a3a3a3');
}

function drawEnemySlime(ctx, ox, oy, pw) {
  const f = P(ox,oy,pw);
  f(4,0,6,1,'#7c3aed'); f(3,1,8,1,'#7c3aed');
  f(2,2,10,2,'#7c3aed'); f(2,2,8,1,'#a855f7');
  f(1,4,12,3,'#7c3aed');
  f(2,7,10,2,'#7c3aed');
  f(3,9,8,1,'#5b21b6');
  // eyes
  f(3,4,3,2,'#fff'); f(8,4,3,2,'#fff');
  f(5,5,2,1,'#000'); f(10,5,2,1,'#000');
  f(3,4,1,1,'#fff'); f(8,4,1,1,'#fff');
  // mouth
  f(4,7,1,1,'#5b21b6'); f(6,7,2,1,'#5b21b6'); f(9,7,1,1,'#5b21b6');
}

function drawEnemyTroll(ctx, ox, oy, pw) {
  const f = P(ox,oy,pw);
  const [D,M,H] = ['#14532d','#166534','#22c55e'];
  // feet
  f(2,9,3,1,D); f(8,9,3,1,D);
  // legs
  f(2,7,3,2,M); f(8,7,3,2,M);
  // body
  f(1,3,11,4,M); f(1,3,11,2,H);
  // head
  f(3,0,7,3,M); f(3,0,7,1,H);
  // horns
  f(3,0,1,2,D); f(9,0,1,2,D);
  // eyes
  f(4,1,2,1,'#dc2626'); f(7,1,2,1,'#dc2626');
  // club arm
  f(0,3,2,4,M); f(0,3,2,1,H);
  f(-1,2,2,1,D); f(-1,1,2,2,D); // club head
  // other arm
  f(11,4,2,3,M);
}

function drawEnemyBoss(ctx, ox, oy, pw) {
  const f = P(ox,oy,pw);
  const [D,M,H,G] = ['#1e293b','#334155','#64748b','#22d3ee'];
  // base
  f(2,8,10,2,D);
  // body
  f(1,3,12,5,M); f(1,3,12,2,H);
  // shoulders/arms
  f(0,3,1,5,D); f(13,3,1,5,D);
  f(-1,2,2,3,M); f(14,2,2,3,M);
  // head/helm
  f(3,0,8,3,M); f(3,0,8,1,H);
  // crest
  f(5,0,1,2,D); f(7,0,2,2,D); f(10,0,1,2,D);
  // eyes
  f(4,1,3,1,G); f(8,1,3,1,G);
  f(4,1,1,1,'#fff'); f(8,1,1,1,'#fff');
  // chest rune
  f(5,5,4,1,G); f(6,4,2,1,G); f(6,6,2,1,G);
}

// ─── Zone / Wave data ─────────────────────────────────────────────────────────
const ZONES = [
  { name:'FOREST ZONE', bgTop:'#0a1f0a', bgBot:'#061206', ground:'#081508',
    waves:[
      {name:'Goblin',       hp:80,   atk:6,  gold:8,  draw:drawEnemyGoblin, boss:false},
      {name:'Cave Slime',   hp:130,  atk:10, gold:12, draw:drawEnemySlime,  boss:false},
      {name:'Goblin',       hp:110,  atk:8,  gold:10, draw:drawEnemyGoblin, boss:false},
      {name:'Cave Slime',   hp:180,  atk:13, gold:16, draw:drawEnemySlime,  boss:false},
      {name:'Forest Troll', hp:260,  atk:16, gold:24, draw:drawEnemyTroll,  boss:false},
      {name:'Goblin',       hp:150,  atk:10, gold:12, draw:drawEnemyGoblin, boss:false},
      {name:'Cave Slime',   hp:240,  atk:15, gold:20, draw:drawEnemySlime,  boss:false},
      {name:'Forest Troll', hp:360,  atk:20, gold:30, draw:drawEnemyTroll,  boss:false},
      {name:'Cave Slime',   hp:300,  atk:18, gold:26, draw:drawEnemySlime,  boss:false},
      {name:'GUARDIAN',     hp:800,  atk:28, gold:80, draw:drawEnemyBoss,   boss:true},
    ]
  },
  { name:'RUINS ZONE', bgTop:'#1a0a2e', bgBot:'#0e0618', ground:'#120814',
    waves:[
      {name:'Skeleton',     hp:160,  atk:14, gold:18, draw:drawEnemyGoblin, boss:false},
      {name:'Stone Golem',  hp:300,  atk:20, gold:28, draw:drawEnemyTroll,  boss:false},
      {name:'Phantom',      hp:200,  atk:22, gold:24, draw:drawEnemySlime,  boss:false},
      {name:'Skeleton',     hp:220,  atk:16, gold:22, draw:drawEnemyGoblin, boss:false},
      {name:'Stone Golem',  hp:420,  atk:26, gold:36, draw:drawEnemyTroll,  boss:false},
      {name:'Phantom',      hp:300,  atk:28, gold:32, draw:drawEnemySlime,  boss:false},
      {name:'Skeleton',     hp:300,  atk:20, gold:26, draw:drawEnemyGoblin, boss:false},
      {name:'Stone Golem',  hp:560,  atk:32, gold:46, draw:drawEnemyTroll,  boss:false},
      {name:'Phantom',      hp:420,  atk:30, gold:38, draw:drawEnemySlime,  boss:false},
      {name:'RUIN KING',    hp:1800, atk:48, gold:150,draw:drawEnemyBoss,   boss:true},
    ]
  },
];

// ─── State ─────────────────────────────────────────────────────────────────────
let gold = 0, zone = 0, wave = 0, bestWave = 1;
let party = Array(9).fill(null);   // creature instances or null
let collection = [];               // all owned creature instances
let enemy = null;
let floats = [];
let hitFlash = 0; // frames remaining for enemy flash
let nextId = 1;

function createCreature(defId) {
  const def = DEFS.find(d => d.id === defId);
  if (!def) return null;
  return {
    uid: nextId++,
    defId,
    level: 1,
    hp: def.hp,
    maxHp: def.hp,
    charge: 0,
    atkTimer: def.spd * (0.5 + Math.random() * 0.5), // stagger starts
    slot: null,
  };
}

function spawnEnemy() {
  const z = ZONES[zone];
  const w = z.waves[wave];
  enemy = { ...w, curHp: w.hp, flashTimer: 0 };
}

function calcAtk(c) {
  const def = DEFS.find(d => d.id === c.defId);
  return Math.floor(def.atk * (1 + 0.12 * (c.level - 1)));
}

function doAutoAttack(c) {
  if (!enemy) return;
  const dmg = calcAtk(c);
  enemy.curHp -= dmg;
  hitFlash = 6;
  spawnFloat(dmg, '#e2d9f3');
  if (enemy.curHp <= 0) killEnemy();
}

function doSpecial(c) {
  if (!enemy || c.charge < 1) return;
  const def = DEFS.find(d => d.id === c.defId);
  let dmg = calcAtk(c);
  if (def.sfx === 'dmg3x') dmg *= 3;
  else if (def.sfx === 'dmg4x') dmg *= 4;
  else if (def.sfx === 'dmg2x') dmg *= 2;
  enemy.curHp -= dmg;
  c.charge = 0;
  hitFlash = 12;
  spawnFloat(dmg, '#fbbf24', true);
  if (enemy.curHp <= 0) killEnemy();
}

function killEnemy() {
  gold += enemy.gold;
  wave++;
  const zone_waves = ZONES[zone].waves.length;
  if (wave >= zone_waves) {
    wave = 0;
    zone = (zone + 1) % ZONES.length;
  }
  const abs = zone * 10 + wave + 1;
  if (abs > bestWave) bestWave = abs;
  spawnEnemy();
  updateHomeStat();
}

function spawnFloat(val, col, big=false) {
  floats.push({
    x: W/2 + (Math.random()-0.5)*40,
    y: H*0.45,
    val: big ? def_special_label(val) : val,
    col, big,
    life: 1.0,
  });
}

function def_special_label(val) {
  return val + '!';
}

// ─── Game loop ────────────────────────────────────────────────────────────────
let lastTick = performance.now();

function gameTick() {
  const now = performance.now();
  const dt = Math.min((now - lastTick) / 1000, 0.2);
  lastTick = now;

  for (let s = 0; s < 9; s++) {
    const c = party[s];
    if (!c || c.hp <= 0) continue;
    const def = DEFS.find(d => d.id === c.defId);

    c.atkTimer -= dt;
    if (c.atkTimer <= 0) {
      c.atkTimer += def.spd;
      doAutoAttack(c);
    }

    if (c.charge < 1) {
      c.charge = Math.min(1, c.charge + dt / def.charge);
    }
  }

  updateGrid();
  updateGoldDisplay();
}

setInterval(gameTick, 80);

// ─── Canvas rendering ─────────────────────────────────────────────────────────
function drawBg() {
  const z = ZONES[zone];
  // Sky gradient
  const grd = ctx.createLinearGradient(0,0,0,H*0.75);
  grd.addColorStop(0, z.bgTop);
  grd.addColorStop(1, z.bgBot);
  ctx.fillStyle = grd;
  ctx.fillRect(0,0,W,H);
  // Ground
  ctx.fillStyle = z.ground;
  ctx.fillRect(0, H*0.75, W, H*0.25);
  // Pixel ground line
  ctx.fillStyle = '#ffffff18';
  ctx.fillRect(0, Math.floor(H*0.75), W, 2);
  // Zone-specific decorations
  if (zone === 0) {
    // pixel trees
    for (let i=0; i<4; i++) {
      const tx = 20 + i*90;
      ctx.fillStyle = '#0a2e0a';
      ctx.fillRect(tx, H*0.75-40, 8, 40); // trunk
      ctx.fillStyle = '#0d4a0d';
      ctx.fillRect(tx-12, H*0.75-80, 32, 44);
      ctx.fillStyle = '#0f5c0f';
      ctx.fillRect(tx-8, H*0.75-96, 24, 20);
    }
  } else {
    // ruins pillars
    for (let i=0; i<3; i++) {
      const tx = 30 + i*130;
      ctx.fillStyle = '#1e1b4b';
      ctx.fillRect(tx, H*0.3, 18, H*0.45);
      ctx.fillStyle = '#2e2b5b';
      ctx.fillRect(tx-4, H*0.28, 26, 10);
    }
  }
}

function drawEnemy() {
  if (!enemy) return;
  const pw = 8;
  const ew = 14*pw, eh = 10*pw; // enemy draw size: 14 wide × 10 tall units
  let ex = (W - ew) / 2;
  let ey = H*0.12;
  // Hit flash: shake
  if (hitFlash > 0) {
    hitFlash--;
    ex += (Math.random()-0.5)*4;
    if (hitFlash > 6) {
      ctx.globalAlpha = 0.6;
    }
  }
  // Draw sprite
  ctx.save();
  ctx.translate(ex, ey);
  enemy.draw(ctx, 0, 0, pw);
  ctx.restore();
  ctx.globalAlpha = 1;

  // HP bar
  const barX = W/2 - 70, barY = H*0.12 + eh + 6;
  const barW = 140;
  ctx.fillStyle = '#1a1840';
  ctx.fillRect(barX-1, barY-1, barW+2, 10);
  ctx.fillStyle = enemy.boss ? '#f59e0b' : '#22c55e';
  const pct = Math.max(0, enemy.curHp / enemy.hp);
  ctx.fillStyle = pct > 0.5 ? '#22c55e' : pct > 0.25 ? '#f59e0b' : '#ef4444';
  ctx.fillRect(barX, barY, barW * pct, 8);

  // Enemy name
  ctx.fillStyle = enemy.boss ? '#fbbf24' : '#e2d9f3';
  ctx.font = '7px "Press Start 2P"';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(enemy.name, W/2, barY - 8);
}

function drawHUD() {
  const z = ZONES[zone];
  ctx.font = '6px "Press Start 2P"';
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillStyle = '#a78bfa';
  ctx.fillText(z.name, 8, 8);
  ctx.fillStyle = '#7c6faa';
  ctx.fillText(`WAVE ${wave+1}/10`, 8, 18);

  ctx.textAlign = 'right';
  ctx.fillStyle = '#fbbf24';
  ctx.fillText(`💰 ${gold}`, W-8, 8);
}

function drawFloats() {
  floats = floats.filter(f => f.life > 0);
  for (const f of floats) {
    ctx.globalAlpha = f.life;
    ctx.font = `${f.big ? 11 : 8}px "Press Start 2P"`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = f.col;
    ctx.fillText(f.val, f.x, f.y);
    f.y -= 0.9;
    f.life -= 0.02;
  }
  ctx.globalAlpha = 1;
}

function renderCanvas() {
  ctx.clearRect(0,0,W,H);
  drawBg();
  drawEnemy();
  drawHUD();
  drawFloats();
  requestAnimationFrame(renderCanvas);
}

// ─── Battle grid UI ───────────────────────────────────────────────────────────
const CELL_SPR_W = 48, CELL_SPR_H = 40; // pw=4

function buildGrid() {
  const grid = document.getElementById('battle-grid');
  grid.innerHTML = '';
  for (let s = 0; s < 9; s++) {
    const cell = document.createElement('div');
    cell.className = 'cell empty';
    cell.dataset.slot = s;
    cell.id = `cell-${s}`;
    cell.addEventListener('click', () => onCellClick(s));
    grid.appendChild(cell);
  }
}

function updateGrid() {
  for (let s = 0; s < 9; s++) {
    const c = party[s];
    const cell = document.getElementById(`cell-${s}`);
    if (!cell) continue;
    if (!c) {
      if (cell.dataset.filled) {
        cell.innerHTML = '';
        cell.className = 'cell empty';
        cell.dataset.filled = '';
      }
      continue;
    }
    const def = DEFS.find(d => d.id === c.defId);
    const charged = c.charge >= 1;
    const dead = c.hp <= 0;
    cell.className = `cell${charged?' charged':''}${dead?' dead':''}`;
    cell.dataset.filled = '1';

    // Rebuild cell content if first time or if creature changed
    if (!cell._lastUid || cell._lastUid !== c.uid) {
      cell.innerHTML = `
        <canvas width="${CELL_SPR_W}" height="${CELL_SPR_H}" id="spr-${s}"></canvas>
        <div class="cname">${def.name}</div>
        <div class="clvl">Lv.${c.level}</div>
        <div class="bar-row">
          <div class="bar" style="background:#1a1840"><div class="bar-fill hp-fill" id="hp-${s}" style="width:100%"></div></div>
          <div class="bar" style="background:#1a1840"><div class="bar-fill sp-fill" id="sp-${s}" style="width:0%"></div></div>
        </div>`;
      cell._lastUid = c.uid;
      // Draw sprite
      const sc = document.getElementById(`spr-${s}`);
      if (sc) {
        const sctx = sc.getContext('2d');
        sctx.imageSmoothingEnabled = false;
        def.draw(sctx, 0, 0, 4);
      }
    }
    // Update bars
    const hpEl = document.getElementById(`hp-${s}`);
    const spEl = document.getElementById(`sp-${s}`);
    if (hpEl) hpEl.style.width = Math.max(0,(c.hp/c.maxHp)*100)+'%';
    if (spEl) { spEl.style.width = (c.charge*100)+'%'; spEl.style.background = c.charge>=1?'#fbbf24':'#3b82f6'; }
  }
}

function onCellClick(slot) {
  const c = party[slot];
  if (!c) {
    // Switch to collection to pick
    switchTab('collection');
    return;
  }
  if (c.charge >= 1) {
    doSpecial(c);
    updateGrid();
  }
}

// ─── Collection UI ────────────────────────────────────────────────────────────
function buildCollection() {
  const grid = document.getElementById('coll-grid');
  grid.innerHTML = '';
  for (const c of collection) {
    const def = DEFS.find(d => d.id === c.defId);
    const inParty = c.slot !== null;
    const card = document.createElement('div');
    card.className = `ccard${inParty?' in-party':''}`;
    card.innerHTML = `
      <canvas width="${CELL_SPR_W}" height="${CELL_SPR_H}"></canvas>
      <div class="cc-name">${def.name}</div>
      <div class="cc-lv">Lv.${c.level}</div>
      <div class="cc-party">${inParty?`SLOT ${c.slot+1}`:''}</div>`;
    const sc = card.querySelector('canvas');
    const sctx = sc.getContext('2d');
    sctx.imageSmoothingEnabled = false;
    def.draw(sctx, 0, 0, 4);
    card.addEventListener('click', () => {
      toggleParty(c);
      buildCollection();
    });
    grid.appendChild(card);
  }
}

function toggleParty(c) {
  if (c.slot !== null) {
    party[c.slot] = null;
    c.slot = null;
  } else {
    const empty = party.indexOf(null);
    if (empty === -1) return;
    party[empty] = c;
    c.slot = empty;
  }
  updateGrid();
}

// ─── Summon UI ────────────────────────────────────────────────────────────────
function doSummon() {
  if (gold < SUMMON_COST) {
    const el = document.getElementById('summon-result');
    el.innerHTML = `<span style="color:#ef4444">NOT ENOUGH GOLD</span>`;
    return;
  }
  gold -= SUMMON_COST;
  updateGoldDisplay();

  // Weighted random pick
  const pool = [];
  for (const d of DEFS) {
    const w = RARITY_W[d.rarity] || 10;
    for (let i=0;i<w;i++) pool.push(d.id);
  }
  const picked = pool[Math.floor(Math.random()*pool.length)];
  const def = DEFS.find(d => d.id === picked);
  const c = createCreature(picked);
  collection.push(c);

  // Auto-assign to empty party slot
  const empty = party.indexOf(null);
  if (empty !== -1) { party[empty] = c; c.slot = empty; }

  // Show result
  const rarityCol = {common:'#94a3b8',uncommon:'#22c55e',rare:'#3b82f6',epic:'#f59e0b'}[def.rarity];
  const resultEl = document.getElementById('summon-result');
  resultEl.innerHTML = '';
  const sc = document.createElement('canvas');
  sc.width = CELL_SPR_W; sc.height = CELL_SPR_H;
  sc.style.imageRendering = 'pixelated';
  const sctx = sc.getContext('2d');
  sctx.imageSmoothingEnabled = false;
  def.draw(sctx, 0, 0, 4);
  resultEl.appendChild(sc);
  const label = document.createElement('div');
  label.style.color = rarityCol;
  label.textContent = `${def.name} [${def.rarity.toUpperCase()}]`;
  resultEl.appendChild(label);

  updateGrid();
  buildCollection();
  saveGame();
}

document.getElementById('btn-summon').addEventListener('click', doSummon);

// ─── Tab navigation ───────────────────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.nb').forEach(b => b.classList.toggle('active', b.dataset.tab===name));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id===`tab-${name}`));
  if (name==='collection') buildCollection();
  if (name==='home') updateHomeStat();
}
document.getElementById('nav').addEventListener('click', e => {
  const b = e.target.closest('.nb'); if(b) switchTab(b.dataset.tab);
});

// ─── Gold & HUD helpers ───────────────────────────────────────────────────────
function updateGoldDisplay() {
  const el = document.getElementById('gold-count'); if(el) el.textContent = gold;
}
function updateHomeStat() {
  const z = ZONES[zone];
  document.getElementById('h-zone').textContent = `${zone+1} (${z.name.split(' ')[0]})`;
  document.getElementById('h-wave').textContent = `${wave+1}/10`;
  document.getElementById('h-gold').textContent = gold;
  document.getElementById('h-count').textContent = collection.length;
  const totalAtk = party.reduce((s,c) => s + (c ? calcAtk(c) : 0), 0);
  document.getElementById('h-atk').textContent = totalAtk;
  document.getElementById('h-best').textContent = bestWave;
}

// ─── Save / Load ──────────────────────────────────────────────────────────────
function saveGame() {
  try {
    localStorage.setItem('ck_save', JSON.stringify({
      gold, zone, wave, bestWave, nextId,
      collection: collection.map(c => ({uid:c.uid,defId:c.defId,level:c.level,hp:c.hp,maxHp:c.maxHp,slot:c.slot})),
      party: party.map(c => c ? c.uid : null),
    }));
  } catch(e){}
}
setInterval(saveGame, 5000);

function loadGame() {
  try {
    const sv = JSON.parse(localStorage.getItem('ck_save')||'{}');
    if (!sv.collection) return false;
    gold = sv.gold||0; zone = sv.zone||0; wave = sv.wave||0;
    bestWave = sv.bestWave||1; nextId = sv.nextId||1;
    collection = sv.collection.map(cd => ({
      uid:cd.uid, defId:cd.defId, level:cd.level||1,
      hp:cd.hp, maxHp:cd.maxHp, slot:null,
      charge:0, atkTimer: (DEFS.find(d=>d.id===cd.defId)||DEFS[0]).spd,
    }));
    sv.party.forEach((uid,s) => {
      if (uid === null) return;
      const c = collection.find(c=>c.uid===uid);
      if (c) { party[s]=c; c.slot=s; }
    });
    return true;
  } catch(e){ return false; }
}

// ─── Canvas scale ─────────────────────────────────────────────────────────────
function fitCanvas() {
  const area = document.getElementById('canvas-area');
  const aw = area.clientWidth-16, ah = area.clientHeight-44;
  const sc = Math.min(aw/W, ah/H);
  canvas.style.width = (W*sc)+'px'; canvas.style.height = (H*sc)+'px';
}
window.addEventListener('resize', fitCanvas);
fitCanvas();

// ─── Tap canvas for bonus attack ──────────────────────────────────────────────
canvas.addEventListener('click', () => {
  if (!enemy) return;
  const dmg = Math.max(1, Math.floor(
    party.filter(Boolean).reduce((s,c)=>s+calcAtk(c),0) * 0.1
  ));
  enemy.curHp -= dmg;
  hitFlash = 4;
  spawnFloat(dmg, '#c084fc');
  if (enemy.curHp <= 0) killEnemy();
});

// ─── Init ─────────────────────────────────────────────────────────────────────
document.fonts.ready.then(() => {
  if (!loadGame()) {
    // Give starter creature
    const starter = createCreature('slime');
    collection.push(starter);
    party[0] = starter; starter.slot = 0;
    gold = 50; // enough for one summon
  }
  spawnEnemy();
  buildGrid();
  updateGrid();
  updateGoldDisplay();
  renderCanvas();
});
</script>
