<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Creature Keeper</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none;}
html,body{height:100%;overflow:hidden;}
html{background:#0a0818;}
body{
  display:flex;flex-direction:column;
  background:#0d0b1e;
  font-family:'Press Start 2P',monospace;
  user-select:none;-webkit-user-select:none;
  color:#e2d9f3;
  max-width:480px;margin:0 auto;
}
/* ── Canvas area ── */
#canvas-area{
  flex:1;display:flex;align-items:center;justify-content:center;
  padding:38px 8px 4px;position:relative;min-height:0;
}
#c{display:block;max-width:100%;max-height:100%;image-rendering:pixelated;}
#back{
  position:absolute;top:10px;left:12px;
  font-size:8px;color:#7c6faa;text-decoration:none;z-index:10;
  font-family:'Press Start 2P',monospace;
}
/* ── Controls ── */
#controls{
  display:none;flex-direction:column;flex-shrink:0;
  background:#12102a;border-top:2px solid #2a2560;
}
@media(pointer:coarse){#controls{display:flex;height:46vh;}}
/* ── Nav ── */
#nav{display:flex;border-top:2px solid #2a2560;flex-shrink:0;}
.nb{
  flex:1;border:none;background:none;
  padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:14px;color:#4a3d7a;cursor:pointer;touch-action:none;
}
.nb span{font-size:6px;font-family:'Press Start 2P',monospace;color:#4a3d7a;}
.nb.active{color:#c084fc;}
.nb.active span{color:#c084fc;}
/* ── Tab panels ── */
#tc{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0;}
.panel{display:none;flex-direction:column;min-height:0;}
.panel.active{display:flex;flex:1;}
/* ── Battle grid ── */
#battle-grid{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:4px;padding:4px;flex:1;
}
.cell{
  border:2px solid #2a2560;border-radius:6px;
  background:#0d0b1e;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;padding:4px 3px;
  cursor:pointer;touch-action:none;
  position:relative;overflow:hidden;
  transition:border-color .1s;
}
.cell canvas{image-rendering:pixelated;display:block;}
.cell .cname{font-size:6px;color:#c084fc;text-align:center;line-height:1.3;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.cell .clvl{font-size:5px;color:#7c6faa;}
.cell .bar-row{width:100%;display:flex;flex-direction:column;gap:2px;}
.bar{width:100%;height:5px;background:#1a1840;border-radius:2px;overflow:hidden;}
.bar-fill{height:100%;border-radius:2px;transition:width .15s;}
.hp-fill{background:#22c55e;}
.sp-fill{background:#3b82f6;}
.cell.charged{
  border-color:#fbbf24;
  animation:cpulse .65s ease-in-out infinite alternate;
}
@keyframes cpulse{
  from{box-shadow:0 0 6px #fbbf24,inset 0 0 8px #fbbf2422;}
  to{box-shadow:0 0 18px #fbbf24,inset 0 0 18px #fbbf2444;}
}
.cell.charged::after{
  content:'!';
  position:absolute;top:2px;right:4px;
  font-size:8px;color:#fbbf24;
  font-family:'Press Start 2P',monospace;
}
.cell.empty{border-style:dashed;opacity:.4;}
.cell.empty::before{content:'+';font-size:18px;color:#4a3d7a;}
.cell.dead{opacity:.35;filter:grayscale(1);}
/* ── Summon panel ── */
.summon-wrap{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;padding:12px;
}
.gold-display{font-size:10px;color:#fbbf24;letter-spacing:.05em;}
.egg-btn{
  width:80px;height:80px;border-radius:50%;border:3px solid #7c3aed;
  background:radial-gradient(circle at 40% 38%, #7c3aed, #1e1b4b);
  font-size:36px;cursor:pointer;touch-action:none;
  display:flex;align-items:center;justify-content:center;
  transition:transform .1s,box-shadow .1s;
  box-shadow:0 0 16px #7c3aed88;
}
.egg-btn:active{transform:scale(.93);}
.summon-cost{font-size:8px;color:#a78bfa;}
.summon-result{
  font-size:9px;text-align:center;min-height:32px;
  display:flex;flex-direction:column;align-items:center;gap:6px;
}
.rarity-common{color:#94a3b8;}
.rarity-uncommon{color:#22c55e;}
.rarity-rare{color:#3b82f6;}
.rarity-epic{color:#f59e0b;}
/* ── Collection panel ── */
.coll-wrap{
  flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  touch-action:pan-y;
  display:grid;grid-template-columns:repeat(3,1fr);
  grid-auto-rows:max-content;
  gap:4px;padding:4px;align-content:start;
}
.coll-wrap::-webkit-scrollbar{display:none;}
.coll-wrap *{touch-action:pan-y;}
.ccard{
  border:2px solid #2a2560;border-radius:6px;
  background:#0d0b1e;padding:4px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  cursor:pointer;touch-action:none;
  transition:border-color .1s;
}
.ccard.in-party{border-color:#22c55e;}
.ccard canvas{image-rendering:pixelated;}
.ccard .cc-name{font-size:6px;color:#c084fc;text-align:center;}
.ccard .cc-lv{font-size:5px;color:#7c6faa;}
.ccard .cc-party{font-size:5px;color:#22c55e;}
/* ── Home panel ── */
.home-wrap{
  flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;padding:12px 14px;display:flex;flex-direction:column;gap:10px;
}
.stat-row{display:flex;justify-content:space-between;align-items:center;font-size:8px;}
.stat-label{color:#7c6faa;}
.stat-val{color:#e2d9f3;}
.home-title{font-size:9px;color:#c084fc;text-align:center;margin-bottom:4px;}
/* Desktop fallback */
@media(pointer:fine){
  #controls{display:flex;height:42vh;}
}
.hidden{display:none!important;}
/* ── Resources bar ── */
#res-bar{
  display:flex;justify-content:space-around;align-items:center;
  padding:4px 8px;border-bottom:1px solid #1a1840;
  flex-shrink:0;background:#0a0818;
  font-family:'Press Start 2P',monospace;
}
.res-item{font-size:7px;display:flex;align-items:center;gap:4px;}
.res-gold{color:#fbbf24;} .res-shard{color:#22d3ee;} .res-ev{color:#a78bfa;}
/* ── Updated collection card ── */
.ccard{padding:0;gap:0;flex-direction:column;overflow:hidden;}
.cc-main{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;flex:1;cursor:pointer;}
.cc-main:active{background:#1a1840;}
.lvlup-small{
  width:100%;border:none;border-top:1px solid #1a1840;
  background:#0d0b1e;color:#22d3ee;
  font-family:'Press Start 2P',monospace;
  font-size:5px;padding:3px 2px;cursor:pointer;
  touch-action:none;line-height:1.5;letter-spacing:.03em;
}
.lvlup-small.cant-afford{color:#2a2560;}
.lvlup-small.party-btn{color:#22c55e;}
.lvlup-small.party-btn.in{color:#ef4444;}
/* ── Creature detail panel ── */
.detail-panel{
  display:flex;flex-direction:column;height:100%;overflow:hidden;
  padding:5px 6px;gap:4px;
}
.detail-header{
  display:flex;align-items:flex-start;gap:6px;flex-shrink:0;
}
.detail-back{
  background:#1a1840;border:1px solid #2a2560;
  color:#a78bfa;font-family:'Press Start 2P',monospace;
  font-size:6px;padding:4px 6px;border-radius:4px;
  cursor:pointer;touch-action:none;flex-shrink:0;
}
.detail-title{display:flex;flex-direction:column;gap:2px;min-width:0;}
.dn-name{font-size:9px;color:#e2d9f3;}
.dn-lv{font-size:6px;color:#7c6faa;}
.dn-type{font-size:5px;color:#4a3d7a;letter-spacing:.04em;}
.detail-body{display:flex;gap:6px;flex:1;min-height:0;}
.detail-left{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  flex-shrink:0;width:78px;
}
.detail-left canvas{image-rendering:pixelated;}
.det-type-badge{
  font-size:5px;color:#7c6faa;padding:2px 4px;
  background:#1a1840;border-radius:3px;text-align:center;
}
.detail-right{flex:1;display:flex;flex-direction:column;gap:4px;overflow-y:auto;min-height:0;}
.detail-right::-webkit-scrollbar{display:none;}
.detail-section-lbl{font-size:5px;color:#2a2560;letter-spacing:.06em;flex-shrink:0;}
.ev-row{display:flex;align-items:center;gap:3px;flex-shrink:0;margin-bottom:1px;}
.ev-stat{font-size:6px;color:#7c6faa;width:22px;flex-shrink:0;}
.ev-val{font-size:7px;color:#e2d9f3;width:26px;text-align:right;flex-shrink:0;}
.ev-bar-wrap{flex:1;height:5px;background:#0d0b1e;border-radius:2px;overflow:hidden;}
.ev-bar-fill{height:100%;border-radius:2px;transition:width .2s;}
.ev-plus-btn{
  width:16px;height:16px;
  background:#1a1840;border:1px solid #3a2d7a;
  color:#a78bfa;font-family:'Press Start 2P',monospace;font-size:9px;
  border-radius:3px;cursor:pointer;touch-action:none;
  display:flex;align-items:center;justify-content:center;
  padding:0;flex-shrink:0;line-height:1;
}
.ev-plus-btn.dim{color:#2a2560;border-color:#1a1840;}
.iv-row{display:flex;align-items:center;gap:3px;flex-shrink:0;margin-bottom:3px;}
.iv-stat-lbl{width:22px;flex-shrink:0;}
.iv-num{font-size:5px;width:26px;text-align:right;flex-shrink:0;}
.iv-bar-wrap{flex:1;height:3px;background:#0d0b1e;border-radius:1px;overflow:hidden;}
.iv-bar-fill{height:100%;border-radius:1px;}
.ev-num{font-size:5px;color:#2a2560;width:26px;text-align:right;flex-shrink:0;}
.detail-footer{flex-shrink:0;display:flex;flex-direction:column;gap:3px;}
.ev-total-row{font-size:5px;color:#3a2d7a;text-align:center;letter-spacing:.03em;}
.lvlup-big{
  border:none;border-radius:6px;padding:8px;
  background:linear-gradient(135deg,#4c1d95,#7c3aed);
  color:#fbbf24;font-family:'Press Start 2P',monospace;
  font-size:7px;cursor:pointer;touch-action:none;
  box-shadow:0 2px 0 #2d1a6e;transition:transform .08s;
  letter-spacing:.03em;
}
.lvlup-big:active{transform:translateY(1px);box-shadow:0 1px 0 #2d1a6e;}
.lvlup-big.dim{background:#1a1840;color:#2a2560;box-shadow:none;}
</style>
</head>
<body>

<div id="canvas-area">
  <a href="../../" id="back">← BACK</a>
  <canvas id="c" width="400" height="220"></canvas>
</div>

<div id="controls">
  <div id="res-bar">
    <span class="res-item res-gold">💰 <span id="gold-count">0</span></span>
    <span class="res-item res-shard">✦ <span id="shard-count">0</span></span>
    <span class="res-item res-ev">★ <span id="ev-count">0</span></span>
  </div>
  <div id="tc">
    <!-- Battle panel -->
    <div class="panel active" id="tab-battle">
      <div id="battle-grid"></div>
    </div>
    <!-- Summon panel -->
    <div class="panel" id="tab-summon">
      <div class="summon-wrap">
        <div class="gold-display">💰 <span id="summon-gold">0</span> GOLD</div>
        <button class="egg-btn" id="btn-summon">🥚</button>
        <div class="summon-cost">50 GOLD PER SUMMON</div>
        <div class="summon-result" id="summon-result"></div>
      </div>
    </div>
    <!-- Collection panel -->
    <div class="panel" id="tab-collection">
      <div class="coll-wrap" id="coll-grid"></div>
    </div>
    <!-- Home panel -->
    <div class="panel" id="tab-home">
      <div class="home-wrap">
        <div class="home-title">CREATURE KEEPER</div>
        <div class="stat-row"><span class="stat-label">ZONE</span><span class="stat-val" id="h-zone">1</span></div>
        <div class="stat-row"><span class="stat-label">WAVE</span><span class="stat-val" id="h-wave">1</span></div>
        <div class="stat-row"><span class="stat-label">GOLD</span><span class="stat-val" id="h-gold">0</span></div>
        <div class="stat-row"><span class="stat-label">CREATURES</span><span class="stat-val" id="h-count">0</span></div>
        <div class="stat-row"><span class="stat-label">PARTY ATK</span><span class="stat-val" id="h-atk">0</span></div>
        <div class="stat-row"><span class="stat-label">HIGHEST WAVE</span><span class="stat-val" id="h-best">1</span></div>
      </div>
    </div>
  </div>
  <nav id="nav">
    <button class="nb active" data-tab="battle">⚔️<span>BATTLE</span></button>
    <button class="nb" data-tab="summon">🥚<span>SUMMON</span></button>
    <button class="nb" data-tab="collection">📦<span>ROSTER</span></button>
    <button class="nb" data-tab="home">🏠<span>HOME</span></button>
  </nav>
</div>

<script>
'use strict';
// ─── Canvas setup ────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
const W = 400, H = 220;
const isTouch = window.matchMedia('(pointer:coarse)').matches;

// ─── Pixel helpers ────────────────────────────────────────────────────────────
// P(ctx, ox, oy, pw): returns a fill helper
const P = (ox,oy,pw) => (x,y,w,h,c) => {
  ctx.fillStyle = c;
  ctx.fillRect(ox+x*pw, oy+y*pw, w*pw, h*pw);
};

// ─── Creature sprite drawing functions (12×10 grid, pw=4 → 48×40) ────────────
// Grid: x=0..11, y=0..9

function drawSlime(ctx, ox, oy, pw) {
  const f = P(ox,oy,pw);
  const [D,M,B,L] = ['#0a5c0a','#1aac1a','#26e026','#72ff72'];
  f(4,0,4,1,M); f(5,0,2,1,B);                    // top dome
  f(3,1,6,1,M); f(4,1,3,1,B);
  f(2,2,8,2,M); f(3,2,4,1,B);                    // wide body
  f(1,4,10,2,M);
  f(2,6,8,1,M); f(3,7,6,1,M); f(4,8,4,1,D);      // bottom
  f(3,3,2,2,'#fff'); f(7,3,2,2,'#fff');           // eyes white
  f(4,4,1,1,'#000'); f(8,4,1,1,'#000');           // pupils
  f(3,3,1,1,'#fff'); f(7,3,1,1,'#fff');           // shine
  f(4,6,1,1,D); f(6,6,2,1,D); f(9,6,1,1,D);      // smile dots
}

function drawSprout(ctx, ox, oy, pw) {
  const f = P(ox,oy,pw);
  // leaf
  f(2,2,5,3,'#1aac1a'); f(3,1,3,2,'#26e026'); f(2,2,2,1,'#72ff72');
  // bud
  f(5,0,3,2,'#f472b6'); f(6,0,1,1,'#fbbf24');
  // stem
  f(5,4,2,5,'#7c3b1a'); f(5,3,2,1,'#1aac1a');
  // roots
  f(4,9,4,1,'#7c3b1a'); f(3,9,1,1,'#7c3b1a'); f(8,9,1,1,'#7c3b1a');
}

function drawFoxkit(ctx, ox, oy, pw) {
  const f = P(ox,oy,pw);
  const [O,LO,W2,D2] = ['#d97706','#fbbf24','#fef3c7','#92400e'];
  // ears
  f(2,0,2,2,O); f(8,0,2,2,O);
  f(3,0,1,1,D2); f(9,0,1,1,D2);           // inner ear
  // head
  f(3,2,6,4,O); f(3,2,4,1,LO);            // head + highlight
  // face
  f(4,2,4,2,W2); f(4,3,4,2,W2);           // white face patch
  // eyes
  f(3,3,2,1,'#000'); f(7,3,2,1,'#000');   // eye stripe
  f(3,2,1,1,'#fff'); f(7,2,1,1,'#fff');   // shine
  // nose
  f(5,5,2,1,'#000'); f(6,5,1,1,'#d97706');
  // body
  f(3,6,6,3,O); f(4,6,4,1,LO);
  // tail
  f(9,7,3,2,LO); f(9,8,3,1,'#fff');
  // ears inner
  f(2,0,1,1,LO); f(8,0,1,1,LO);
}

function drawMushy(ctx, ox, oy, pw) {
  const f = P(ox,oy,pw);
  // cap
  f(3,0,6,1,'#dc2626'); f(2,1,8,1,'#dc2626'); f(1,2,10,3,'#dc2626');
  f(4,0,4,1,'#ef4444'); // highlight
  // spots
  f(3,1,2,2,'#fff'); f(7,2,2,2,'#fff'); f(5,3,1,1,'#fff');
  // stem / face
  f(3,5,6,4,'#fef3c7');
  f(4,5,4,1,'#fff');
  // eyes
  f(4,6,2,2,'#000'); f(7,6,2,2,'#000');
  f(4,6,1,1,'#fff'); f(7,6,1,1,'#fff');  // shine
  // mouth
  f(4,8,1,1,'#000'); f(6,8,2,1,'#000');
}

function drawGolem(ctx, ox, oy, pw) {
  const f = P(ox,oy,pw);
  const [S,L2,D2,C] = ['#64748b','#94a3b8','#334155','#22d3ee'];
  // body block
  f(1,1,10,8,S);
  f(1,1,10,2,L2);  // top highlight
  f(1,7,10,2,D2);  // bottom shadow
  // cracks
  f(4,2,1,3,D2); f(8,4,1,3,D2); f(5,6,2,1,D2);
  // eyes (glowing)
  f(3,3,2,2,'#000'); f(7,3,2,2,'#000');
  f(3,3,2,2,C+'88'); f(7,3,2,2,C+'88'); // glow tint
  f(4,3,1,1,C); f(8,3,1,1,C);           // bright center
  // arms
  f(0,2,1,5,S); f(11,2,1,5,S);
  f(0,2,1,2,L2); f(11,2,1,2,L2);
}

function drawWisp(ctx, ox, oy, pw) {
  const f = P(ox,oy,pw);
  const [P2,L2,G,W2] = ['#7c3aed','#a855f7','#c4b5fd','#fff'];
  // tail (bottom)
  f(5,8,2,2,P2); f(4,7,1,2,P2); f(7,7,1,2,P2); f(3,7,1,1,P2); f(8,7,1,1,P2);
  f(5,6,2,2,P2); f(4,6,1,1,P2); f(7,6,1,1,P2);
  // orb body
  f(4,2,4,5,P2); f(3,3,6,3,P2); // orb fill
  f(4,2,4,1,L2); f(3,3,1,1,L2); f(3,2,2,1,L2); // bright edges
  // glow rim
  f(4,1,4,1,G+'88'); f(3,2,1,1,G+'88'); f(8,2,1,1,G+'88');
  // white core
  f(5,3,2,2,W2); f(6,3,1,1,W2);
  // face
  f(4,4,2,1,'#1e0066'); f(7,4,2,1,'#1e0066'); // eyes
  f(4,4,1,1,G); f(7,4,1,1,G); // shine
}

function drawShadowPup(ctx, ox, oy, pw) {
  const f = P(ox,oy,pw);
  const [D2,M2,G] = ['#0f0a1e','#1e1040','#fbbf24'];
  // ears
  f(3,0,2,2,D2); f(8,0,2,2,D2);
  // head
  f(3,2,6,4,M2); f(3,2,4,1,'#2a1a50');
  // snout
  f(4,4,4,2,D2);
  // eyes (glowing)
  f(3,3,2,1,G); f(8,3,2,1,G);
  f(3,3,1,1,'#fff'); f(8,3,1,1,'#fff');
  // body
  f(2,6,7,3,M2); f(2,6,5,1,'#2a1a50');
  // tail
  f(9,6,3,2,D2); f(10,5,2,1,D2);
  // legs
  f(3,8,2,2,D2); f(7,8,2,2,D2);
  // nose
  f(5,5,2,1,'#000'); f(6,5,1,1,'#333');
}

function drawScrapBot(ctx, ox, oy, pw) {
  const f = P(ox,oy,pw);
  const [S,L2,D2,O2] = ['#475569','#94a3b8','#1e293b','#f97316'];
  // antenna
  f(6,0,1,2,S); f(5,0,3,1,L2); f(6,0,1,1,O2);  // tip glows
  // head
  f(3,2,6,4,S); f(3,2,6,1,L2);
  // visor screen
  f(4,3,4,2,D2); f(4,3,4,1,'#0ea5e9'+'66');
  f(5,3,2,1,O2); // active dot
  // body
  f(2,6,8,3,S); f(2,6,8,1,L2); f(2,8,8,1,D2);
  // arm joints
  f(1,6,1,2,D2); f(10,6,1,2,D2);
  f(0,7,1,2,S); f(11,7,1,2,S);
  // vents on body
  f(4,7,1,1,D2); f(6,7,1,1,D2); f(8,7,1,1,D2);
  // legs

// ─── State ─────────────────────────────────────────────────────────────────────
let gold = 0, shards = 0, evPoints = 0;
let zone = 0, wave = 0, bestWave = 1;
let party = Array(9).fill(null);
let collection = [];
let enemy = null;
let floats = [];
let hitFlash = 0;
let nextId = 1;
let detailUid = null;

// ─── IV / EV / Stat formulas ──────────────────────────────────────────────────
function rollIV(bias, stat) {
  if (bias === stat) return 20 + Math.floor(Math.random() * 12);
  return Math.floor(Math.random() * 32);
}
function ivColor(iv) {
  if (iv >= 28) return '#22c55e';
  if (iv >= 21) return '#3b82f6';
  if (iv >= 11) return '#f59e0b';
  return '#ef4444';
}
function getStat0(base, iv, ev, level) {
  return Math.floor(base * (1 + 0.08 * (level - 1)) * (1 + iv / 62)) + Math.floor(ev / 4);
}
function getStat(c, stat) {
  const dfn = DEFS.find(d => d.id === c.defId);
  const ivMap = {atk:c.ivAtk, def:c.ivDef, hp:c.ivHp, spd:c.ivSpd};
  const evMap = {atk:c.evAtk||0, def:c.evDef||0, hp:c.evHp||0, spd:c.evSpd||0};
  return getStat0(dfn[stat], ivMap[stat]||0, evMap[stat]||0, c.level);
}
function calcAtk(c) { return getStat(c, 'atk'); }

// ─── Level-up / EV ────────────────────────────────────────────────────────────
function levelUpCost(c) {
  const dfn = DEFS.find(d => d.id === c.defId);
  const mult = {common:1, uncommon:1.8, rare:3, epic:6}[dfn.rarity] || 1;
  return Math.floor(20 * Math.pow(1.2, c.level - 1) * mult);
}
function doLevelUp(uid) {
  const c = collection.find(c => c.uid === uid);
  if (!c) return;
  const cost = levelUpCost(c);
  if (shards < cost) return;
  shards -= cost;
  c.level++;
  c.maxHp = getStat(c, 'hp');
  c.hp = Math.min(c.hp, c.maxHp);
  updateResources();
  if (detailUid === uid) openDetail(uid); else buildCollection();
  saveGame();
}
function addEV(uid, stat) {
  const c = collection.find(c => c.uid === uid);
  if (!c || evPoints < 1) return;
  const key = 'ev' + stat.charAt(0).toUpperCase() + stat.slice(1);
  const total = (c.evAtk||0) + (c.evDef||0) + (c.evHp||0) + (c.evSpd||0);
  if (total >= 510 || (c[key]||0) >= 252) return;
  evPoints--;
  c[key] = (c[key]||0) + 4;
  if (stat === 'hp') { c.maxHp = getStat(c, 'hp'); c.hp = Math.min(c.hp, c.maxHp); }
  updateResources();
  openDetail(uid);
  saveGame();
}

function createCreature(defId) {
  const def = DEFS.find(d => d.id === defId);
  if (!def) return null;
  const ivAtk = rollIV(def.ivBias, 'atk');
  const ivDef = rollIV(def.ivBias, 'def');
  const ivHp  = rollIV(def.ivBias, 'hp');
  const ivSpd = rollIV(def.ivBias, 'spd');
  const c = {
    uid: nextId++, defId, level: 1,
    ivAtk, ivDef, ivHp, ivSpd,
    evAtk: 0, evDef: 0, evHp: 0, evSpd: 0,
    charge: 0, atkTimer: def.spd * (0.5 + Math.random() * 0.5), slot: null,
  };
  c.maxHp = getStat(c, 'hp');
  c.hp = c.maxHp;
  return c;
}

function spawnEnemy() {
  const z = ZONES[zone];
  const w = z.waves[wave];
  enemy = { ...w, curHp: w.hp, atkTimer: 2.5 };
}

function doAutoAttack(c) {
  if (!enemy) return;
  const dmg = calcAtk(c);
  enemy.curHp -= dmg;
  hitFlash = 6;
  spawnFloat(dmg, '#e2d9f3');
  if (enemy.curHp <= 0) killEnemy();
}

function doSpecial(c) {
  if (!enemy || c.charge < 1) return;
  const def = DEFS.find(d => d.id === c.defId);
  let dmg = calcAtk(c);
  if (def.sfx === 'dmg4x') dmg *= 4;
  else if (def.sfx === 'dmg3x') dmg *= 3;
  else if (def.sfx === 'dmg2x') dmg *= 2;
  enemy.curHp -= dmg;
  c.charge = 0;
  hitFlash = 12;
  spawnFloat(dmg+'!', '#fbbf24', true);
  if (enemy.curHp <= 0) killEnemy();
}

function killEnemy() {
  gold += enemy.gold;
  const earnedShards = enemy.boss ? 20 : Math.max(2, Math.floor(enemy.hp / 20));
  const earnedEV = enemy.boss ? 10 : Math.max(1, Math.floor(enemy.hp / 35));
  shards += earnedShards;
  evPoints += earnedEV;
  spawnFloat('+' + earnedShards + '❆', '#22d3ee');
  wave++;
  const zone_waves = ZONES[zone].waves.length;
  if (wave >= zone_waves) { wave = 0; zone = (zone + 1) % ZONES.length; }
  const abs = zone * 10 + wave + 1;
  if (abs > bestWave) bestWave = abs;
  // Partial heal on wave clear (20% of max HP)
  party.forEach(c => { if (c) c.hp = Math.min(c.maxHp, c.hp + Math.floor(c.maxHp * 0.2)); });
  spawnEnemy();
  updateResources();
  updateHomeStat();
}

function spawnFloat(val, col, big=false) {
  floats.push({ x: W/2 + (Math.random()-0.5)*40, y: H*0.45, val, col, big, life: 1.0 });
}

// ─── Game loop ────────────────────────────────────────────────────────────────
let lastTick = performance.now();

function gameTick() {
  const now = performance.now();
  const dt = Math.min((now - lastTick) / 1000, 0.2);
  lastTick = now;
  for (let s = 0; s < 9; s++) {
    const c = party[s];
    if (!c || c.hp <= 0) continue;
    const def = DEFS.find(d => d.id === c.defId);
    c.atkTimer -= dt;
    if (c.atkTimer <= 0) { c.atkTimer += def.spd; doAutoAttack(c); }
    if (c.charge < 1) c.charge = Math.min(1, c.charge + dt / def.charge);
  }
  // Enemy attacks a random alive party member
  if (enemy) {
    enemy.atkTimer -= dt;
    if (enemy.atkTimer <= 0) {
      enemy.atkTimer = 2.5;
      const alive = party.filter(c => c && c.hp > 0);
      if (alive.length > 0) {
        const target = alive[Math.floor(Math.random() * alive.length)];
        target.hp = Math.max(0, target.hp - enemy.atk);
      }
    }
  }
  updateGrid();
  updateResources();
}

setInterval(gameTick, 80);

// ─── Canvas rendering ─────────────────────────────────────────────────────────
function drawBg() {
  const z = ZONES[zone];
  const grd = ctx.createLinearGradient(0,0,0,H*0.75);
  grd.addColorStop(0, z.bgTop); grd.addColorStop(1, z.bgBot);
  ctx.fillStyle = grd; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = z.ground; ctx.fillRect(0, H*0.75, W, H*0.25);
  ctx.fillStyle = '#ffffff18'; ctx.fillRect(0, Math.floor(H*0.75), W, 2);
  if (zone === 0) {
    for (let i=0; i<4; i++) {
      const tx = 20 + i*90;
      ctx.fillStyle = '#0a2e0a'; ctx.fillRect(tx, H*0.75-40, 8, 40);
      ctx.fillStyle = '#0d4a0d'; ctx.fillRect(tx-12, H*0.75-80, 32, 44);
      ctx.fillStyle = '#0f5c0f'; ctx.fillRect(tx-8, H*0.75-96, 24, 20);
    }
  } else {
    for (let i=0; i<3; i++) {
      const tx = 30 + i*130;
      ctx.fillStyle = '#1e1b4b'; ctx.fillRect(tx, H*0.3, 18, H*0.45);
      ctx.fillStyle = '#2e2b5b'; ctx.fillRect(tx-4, H*0.28, 26, 10);
    }
  }
}

function drawEnemy() {
  if (!enemy) return;
  const pw = 6;
  const ew = 14*pw, eh = 10*pw; // 84 × 60px
  // Enemy stands on the ground line
  let ex = (W - ew) / 2;
  let ey = Math.floor(H * 0.75) - eh;
  if (hitFlash > 0) {
    hitFlash--;
    ex += (Math.random()-0.5)*4;
    if (hitFlash > 6) ctx.globalAlpha = 0.6;
  }
  ctx.save(); ctx.translate(ex, ey);
  enemy.draw(ctx, 0, 0, pw);
  ctx.restore(); ctx.globalAlpha = 1;

  // Enemy name above HP bar at top
  ctx.fillStyle = enemy.boss ? '#fbbf24' : '#e2d9f3';
  ctx.font = '7px "Press Start 2P"';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(enemy.name, W/2, 11);

  // HP bar at very top of canvas
  const barX = 4, barY = 18, barW = W - 8;
  ctx.fillStyle = '#1a1840'; ctx.fillRect(barX-1, barY-1, barW+2, 10);
  const pct = Math.max(0, enemy.curHp / enemy.hp);
  ctx.fillStyle = pct > 0.5 ? '#22c55e' : pct > 0.25 ? '#f59e0b' : '#ef4444';
  ctx.fillRect(barX, barY, barW * pct, 8);
}

function drawHUD() {
  const z = ZONES[zone];
  ctx.font = '6px "Press Start 2P"';
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillStyle = '#a78bfa'; ctx.fillText(z.name, 8, H - 26);
  ctx.fillStyle = '#7c6faa'; ctx.fillText('WAVE '+(wave+1)+'/10', 8, H - 16);
  if (wave === 9) {
    ctx.textAlign = 'right'; ctx.fillStyle = '#fbbf24';
    ctx.fillText('⚠ BOSS', W-8, H - 26);
  }
}

function drawFloats() {
  floats = floats.filter(f => f.life > 0);
  for (const f of floats) {
    ctx.globalAlpha = f.life;
    ctx.font = (f.big ? 11 : 8)+'px "Press Start 2P"';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = f.col;
    ctx.fillText(f.val, f.x, f.y);
    f.y -= 0.9; f.life -= 0.02;
  }
  ctx.globalAlpha = 1;
}

function renderCanvas() {
  ctx.clearRect(0,0,W,H);
  drawBg(); drawEnemy(); drawHUD(); drawFloats();
  requestAnimationFrame(renderCanvas);
}

// ─── Battle grid UI ───────────────────────────────────────────────────────────
const CELL_SPR_W = 36, CELL_SPR_H = 30;

function buildGrid() {
  const grid = document.getElementById('battle-grid');
  grid.innerHTML = '';
  for (let s = 0; s < 9; s++) {
    const cell = document.createElement('div');
    cell.className = 'cell empty'; cell.dataset.slot = s; cell.id = 'cell-'+s;
    cell.addEventListener('click', () => onCellClick(s));
    grid.appendChild(cell);
  }
}

function updateGrid() {
  for (let s = 0; s < 9; s++) {
    const c = party[s];
    const cell = document.getElementById('cell-'+s);
    if (!cell) continue;
    if (!c) {
      if (cell.dataset.filled) { cell.innerHTML=''; cell.className='cell empty'; cell.dataset.filled=''; cell._lastUid=null; }
      continue;
    }
    const def = DEFS.find(d => d.id === c.defId);
    cell.className = 'cell'+(c.charge>=1?' charged':'')+(c.hp<=0?' dead':'');
    cell.dataset.filled = '1';
    if (!cell._lastUid || cell._lastUid !== c.uid) {
      cell.innerHTML = `<canvas width="${CELL_SPR_W}" height="${CELL_SPR_H}" id="spr-${s}"></canvas>
        <div class="cname">${def.name}</div>
        <div class="clvl" id="clvl-${s}">Lv.${c.level}</div>
        <div class="bar-row">
          <div class="bar"><div class="bar-fill hp-fill" id="hp-${s}" style="width:100%"></div></div>
          <div class="bar"><div class="bar-fill sp-fill" id="sp-${s}" style="width:0%"></div></div>
        </div>`;
      cell._lastUid = c.uid;
      const sc = document.getElementById('spr-'+s);
      if (sc) { const sctx=sc.getContext('2d'); sctx.imageSmoothingEnabled=false; def.draw(sctx,0,0,3); }
    }
    const hpEl=document.getElementById('hp-'+s), spEl=document.getElementById('sp-'+s), lvEl=document.getElementById('clvl-'+s);
    if (hpEl) hpEl.style.width = Math.max(0,(c.hp/c.maxHp)*100)+'%';
    if (spEl) { spEl.style.width=(c.charge*100)+'%'; spEl.style.background=c.charge>=1?'#fbbf24':'#3b82f6'; }
    if (lvEl) lvEl.textContent = 'Lv.'+c.level;
  }
}

function onCellClick(slot) {
  const c = party[slot];
  if (!c) { switchTab('collection'); return; }
  if (c.charge >= 1) { doSpecial(c); updateGrid(); }
}

// ─── Collection UI ────────────────────────────────────────────────────────────
function buildCollection() {
  if (detailUid !== null) { openDetail(detailUid); return; }
  const grid = document.getElementById('coll-grid');
  grid.style.cssText = '';
  grid.innerHTML = '';
  for (const c of collection) {
    const def = DEFS.find(d => d.id === c.defId);
    const inParty = c.slot !== null;
    const cost = levelUpCost(c);
    const canLvl = shards >= cost;
    const card = document.createElement('div');
    card.className = 'ccard'+(inParty?' in-party':'');
    card.innerHTML = `<div class="cc-main">
        <canvas width="${CELL_SPR_W}" height="${CELL_SPR_H}"></canvas>
        <div class="cc-name">${def.name}</div>
        <div class="cc-lv">Lv.${c.level}</div>
      </div>
      <button class="lvlup-small${canLvl?'':' cant-afford'}" data-uid="${c.uid}" data-action="lvl">❆${cost} LV UP</button>
      <button class="lvlup-small party-btn${inParty?' in':''}" data-uid="${c.uid}" data-action="party">${inParty?'REMOVE':(party.indexOf(null)===-1?'FULL':'ADD')}</button>`;
    const sc = card.querySelector('canvas');
    const sctx = sc.getContext('2d'); sctx.imageSmoothingEnabled = false; def.draw(sctx,0,0,3);
    card.querySelector('.cc-main').addEventListener('click', () => openDetail(c.uid));
    card.querySelector('[data-action="lvl"]').addEventListener('click', e => { e.stopPropagation(); doLevelUp(c.uid); });
    card.querySelector('[data-action="party"]').addEventListener('click', e => { e.stopPropagation(); toggleParty(c); buildCollection(); });
    grid.appendChild(card);
  }
}

function openDetail(uid) {
  detailUid = uid;
  const c = collection.find(c => c.uid === uid);
  if (!c) { detailUid = null; buildCollection(); return; }
  const def = DEFS.find(d => d.id === c.defId);
  const cost = levelUpCost(c);
  const canLvl = shards >= cost;
  const totalEV = (c.evAtk||0)+(c.evDef||0)+(c.evHp||0)+(c.evSpd||0);
  const STATS = [{key:'atk',label:'ATK',col:'#ef4444'},{key:'def',label:'DEF',col:'#3b82f6'},{key:'hp',label:'HP',col:'#22c55e'},{key:'spd',label:'SPD',col:'#f59e0b'}];
  let evRows='', ivRows='';
  for (const {key,label,col} of STATS) {
    const ivKey='iv'+key[0].toUpperCase()+key.slice(1), evKey='ev'+key[0].toUpperCase()+key.slice(1);
    const iv=c[ivKey]||0, ev=c[evKey]||0, statVal=getStat(c,key);
    const canAdd = evPoints>0 && totalEV<510 && ev<252;
    evRows+=`<div class="ev-row"><span class="ev-stat">${label}</span><span class="ev-val">${statVal}</span><div class="ev-bar-wrap"><div class="ev-bar-fill" style="width:${(ev/252)*100}%;background:${col}"></div></div><button class="ev-plus-btn${canAdd?'':' dim'}" data-uid="${uid}" data-stat="${key}">+</button></div>`;
    ivRows+=`<div class="iv-row"><span class="iv-stat-lbl" style="font-size:5px;color:#4a3d7a">${label}</span><span class="iv-num" style="color:${ivColor(iv)}">${iv}</span><div class="iv-bar-wrap"><div class="iv-bar-fill" style="width:${(iv/31)*100}%;background:${ivColor(iv)}"></div></div></div>`;
  }
  const spW=60, spH=50, pw=5;
  const grid = document.getElementById('coll-grid');
  grid.style.cssText = 'display:block;overflow-y:auto;grid-template-columns:unset;padding:0';
  grid.innerHTML = `<div class="detail-panel">
    <div class="detail-header">
      <button class="detail-back" id="det-back">◀ BACK</button>
      <div class="detail-title"><div class="dn-name">${def.name}</div><div class="dn-lv">Lv.${c.level}</div><div class="dn-type">${def.type.toUpperCase()} · ${def.rarity.toUpperCase()}</div></div>
    </div>
    <div class="detail-body">
      <div class="detail-left"><canvas width="${spW}" height="${spH}" id="det-spr" style="image-rendering:pixelated"></canvas><div class="det-type-badge">${def.spec}</div></div>
      <div class="detail-right">
        <div class="detail-section-lbl">STATS (★ ${evPoints} EV)</div>
        ${evRows}
        <div class="ev-total-row">EV: ${totalEV}/510</div>
        <div class="detail-section-lbl" style="margin-top:4px">POTENTIAL (IVs)</div>
        ${ivRows}
      </div>
    </div>
    <div class="detail-footer">
      <div class="ev-total-row">❆ ${shards} SHARDS</div>
      <button class="lvlup-big${canLvl?'':' dim'}" id="det-lvl">LV UP (❆${cost})</button>
    </div>
  </div>`;
  const detSpr = document.getElementById('det-spr');
  if (detSpr) { const sctx=detSpr.getContext('2d'); sctx.imageSmoothingEnabled=false; def.draw(sctx,0,0,pw); }
  document.getElementById('det-back').addEventListener('click', () => { detailUid=null; buildCollection(); });
  document.getElementById('det-lvl').addEventListener('click', () => doLevelUp(uid));
  grid.querySelectorAll('.ev-plus-btn:not(.dim)').forEach(btn => btn.addEventListener('click', () => addEV(+btn.dataset.uid, btn.dataset.stat)));
}

function toggleParty(c) {
  if (c.slot !== null) { party[c.slot]=null; c.slot=null; }
  else { const e=party.indexOf(null); if(e===-1)return; party[e]=c; c.slot=e; }
  updateGrid();
}

// ─── Summon UI ────────────────────────────────────────────────────────────────
function doSummon() {
  if (gold < SUMMON_COST) {
    document.getElementById('summon-result').innerHTML='<span style="color:#ef4444">NOT ENOUGH GOLD</span>';
    return;
  }
  gold -= SUMMON_COST;
  updateResources();
  const pool=[];
  for (const d of DEFS) { const w=RARITY_W[d.rarity]||10; for(let i=0;i<w;i++) pool.push(d.id); }
  const picked=pool[Math.floor(Math.random()*pool.length)];
  const def=DEFS.find(d=>d.id===picked);
  const c=createCreature(picked);
  collection.push(c);
  const e=party.indexOf(null); if(e!==-1){party[e]=c;c.slot=e;}
  const rarityCol={common:'#94a3b8',uncommon:'#22c55e',rare:'#3b82f6',epic:'#f59e0b'}[def.rarity];
  const resultEl=document.getElementById('summon-result');
  resultEl.innerHTML='';
  const sc=document.createElement('canvas'); sc.width=CELL_SPR_W; sc.height=CELL_SPR_H; sc.style.imageRendering='pixelated';
  const sctx=sc.getContext('2d'); sctx.imageSmoothingEnabled=false; def.draw(sctx,0,0,3);
  resultEl.appendChild(sc);
  const lbl=document.createElement('div'); lbl.style.color=rarityCol; lbl.textContent=def.name+' ['+def.rarity.toUpperCase()+']';
  resultEl.appendChild(lbl);
  updateGrid(); buildCollection(); saveGame();
}

document.getElementById('btn-summon').addEventListener('click', doSummon);

// ─── Tab navigation ───────────────────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.nb').forEach(b => b.classList.toggle('active', b.dataset.tab===name));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id==='tab-'+name));
  if (name==='battle') updateGrid();
  if (name==='collection') { detailUid=null; buildCollection(); }
  if (name==='home') updateHomeStat();
}
document.getElementById('nav').addEventListener('click', e => { const b=e.target.closest('.nb'); if(b) switchTab(b.dataset.tab); });

// ─── Resources & HUD helpers ──────────────────────────────────────────────────
function updateResources() {
  const g=document.getElementById('gold-count'); if(g) g.textContent=gold;
  const sg=document.getElementById('summon-gold'); if(sg) sg.textContent=gold;
  const s=document.getElementById('shard-count'); if(s) s.textContent=shards;
  const e=document.getElementById('ev-count'); if(e) e.textContent=evPoints;
}
function updateGoldDisplay() { updateResources(); }

function updateHomeStat() {
  const z=ZONES[zone];
  const el=id=>document.getElementById(id);
  if(el('h-zone')) el('h-zone').textContent=(zone+1)+' ('+z.name.split(' ')[0]+')';
  if(el('h-wave')) el('h-wave').textContent=(wave+1)+'/10';
  if(el('h-gold')) el('h-gold').textContent=gold;
  if(el('h-count')) el('h-count').textContent=collection.length;
  const totalAtk=party.reduce((s,c)=>s+(c?calcAtk(c):0),0);
  if(el('h-atk')) el('h-atk').textContent=totalAtk;
  if(el('h-best')) el('h-best').textContent=bestWave;
}

// ─── Save / Load ──────────────────────────────────────────────────────────────
function saveGame() {
  try {
    localStorage.setItem('ck_save', JSON.stringify({
      gold, shards, evPoints, zone, wave, bestWave, nextId,
      collection: collection.map(c=>({uid:c.uid,defId:c.defId,level:c.level,hp:c.hp,maxHp:c.maxHp,slot:c.slot,ivAtk:c.ivAtk,ivDef:c.ivDef,ivHp:c.ivHp,ivSpd:c.ivSpd,evAtk:c.evAtk||0,evDef:c.evDef||0,evHp:c.evHp||0,evSpd:c.evSpd||0})),
      party: party.map(c=>c?c.uid:null),
    }));
  } catch(e){}
}
setInterval(saveGame, 5000);

function loadGame() {
  try {
    const sv=JSON.parse(localStorage.getItem('ck_save')||'{}');
    if (!sv.collection) return false;
    gold=sv.gold||0; shards=sv.shards||0; evPoints=sv.evPoints||0;
    zone=sv.zone||0; wave=sv.wave||0; bestWave=sv.bestWave||1; nextId=sv.nextId||1;
    collection=sv.collection.map(cd=>{
      const def=DEFS.find(d=>d.id===cd.defId)||DEFS[0];
      return {uid:cd.uid,defId:cd.defId,level:cd.level||1,hp:cd.hp,maxHp:cd.maxHp,slot:null,
        ivAtk:cd.ivAtk!=null?cd.ivAtk:rollIV(def.ivBias,'atk'),
        ivDef:cd.ivDef!=null?cd.ivDef:rollIV(def.ivBias,'def'),
        ivHp: cd.ivHp !=null?cd.ivHp :rollIV(def.ivBias,'hp'),
        ivSpd:cd.ivSpd!=null?cd.ivSpd:rollIV(def.ivBias,'spd'),
        evAtk:cd.evAtk||0,evDef:cd.evDef||0,evHp:cd.evHp||0,evSpd:cd.evSpd||0,
        charge:0,atkTimer:def.spd};
    });
    sv.party.forEach((uid,s)=>{ if(uid===null)return; const c=collection.find(c=>c.uid===uid); if(c){party[s]=c;c.slot=s;} });
    return true;
  } catch(e){ return false; }
}

// ─── Canvas scale ─────────────────────────────────────────────────────────────
function fitCanvas() {
  const area=document.getElementById('canvas-area');
  const aw=area.clientWidth-16, ah=area.clientHeight-44;
  const sc=Math.min(aw/W,ah/H);
  canvas.style.width=(W*sc)+'px'; canvas.style.height=(H*sc)+'px';
}
window.addEventListener('resize', fitCanvas);
fitCanvas();

// ─── Tap canvas for bonus attack ──────────────────────────────────────────────
canvas.addEventListener('click', () => {
  if (!enemy) return;
  const dmg=Math.max(1,Math.floor(party.filter(Boolean).reduce((s,c)=>s+calcAtk(c),0)*0.1));
  enemy.curHp -= dmg; hitFlash=4; spawnFloat(dmg,'#c084fc');
  if (enemy.curHp<=0) killEnemy();
});

// ─── Init ─────────────────────────────────────────────────────────────────────
document.fonts.ready.then(() => {
  if (!loadGame()) {
    const starter=createCreature('slime');
    collection.push(starter); party[0]=starter; starter.slot=0;
    gold=50; shards=30;
  }
  spawnEnemy(); buildGrid(); updateGrid(); updateResources(); renderCanvas();
});
</script>
</body>
</html>
