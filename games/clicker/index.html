<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cookie Lab</title>
<style>
*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
html, body { height: 100%; overflow: hidden; }
body {
  display: flex;
  flex-direction: column;
  background: #fdf8f0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  user-select: none;
  -webkit-user-select: none;
}

/* ── Canvas area (top) ── */
#canvas-area {
  flex: 1;
  min-height: 0;
  position: relative;
  overflow: hidden;
  touch-action: none;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Particle canvas sits behind everything */
canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
}

/* Back link */
#back {
  position: absolute;
  top: 12px; left: 16px;
  font-size: 13px;
  color: #9ca3af;
  text-decoration: none;
  z-index: 10;
}
#back:hover { color: #6b7280; }

/* ── HUD ── */
#hud {
  width: 100%;
  padding: 12px 16px 0;
  text-align: center;
  pointer-events: none;
  z-index: 5;
  flex-shrink: 0;
}
#score-display {
  font-size: clamp(30px, 7.5vw, 48px);
  font-weight: 700;
  color: #7c3aed;
  letter-spacing: -0.02em;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
#score-sub {
  font-size: clamp(11px, 2.5vw, 13px);
  color: #9ca3af;
  margin-top: 3px;
}
#level-bar-wrap {
  width: min(260px, 68%);
  margin: 8px auto 0;
  height: 5px;
  background: #e9d5ff;
  border-radius: 99px;
  overflow: hidden;
}
#level-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #7c3aed, #a78bfa);
  border-radius: 99px;
  transition: width 0.4s ease;
}
#level-label {
  font-size: clamp(9px, 1.8vw, 11px);
  font-weight: 700;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: #a78bfa;
  margin-top: 5px;
}

/* ── Cookie button ── */
#btn-cookie {
  flex: 1;
  position: relative;
  z-index: 6;
  background: none;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  touch-action: none;
  width: 100%;
  font-size: clamp(88px, 21vw, 160px);
  line-height: 1;
  padding: 4px;
  filter: drop-shadow(0 4px 18px rgba(124,58,237,0.18));
  transition: transform 0.1s, filter 0.1s;
}

/* ── Shop ── */
#shop {
  flex-shrink: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-y;
  padding: 8px 12px max(12px, env(safe-area-inset-bottom));
  background: #fff;
  border-top: 1.5px solid #f3e8ff;
}
@media (pointer: coarse) { #shop { height: 46vh; } }
@media (pointer: fine)   { #shop { max-height: 44vh; min-height: 200px; } }

#shop-header {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #9ca3af;
  padding: 0 2px 6px;
}

.shop-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}

.shop-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  border-radius: 12px;
  border: 1.5px solid #e9d5ff;
  background: #faf5ff;
  cursor: pointer;
  text-align: left;
  touch-action: manipulation;
  transition: background 0.1s, border-color 0.1s, transform 0.1s;
}
.shop-btn:active:not(:disabled) {
  background: #f3e8ff;
  border-color: #c4b5fd;
  transform: scale(0.96);
}
.shop-btn:disabled { opacity: 0.38; cursor: default; pointer-events: none; }

.shop-icon { font-size: 20px; flex-shrink: 0; }
.shop-info { flex: 1; min-width: 0; }
.shop-name {
  font-size: 12px; font-weight: 600; color: #374151;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.shop-cost {
  font-size: 11px; font-weight: 700; color: #7c3aed; margin-top: 1px;
}
.shop-desc {
  font-size: 10px; color: #9ca3af; margin-top: 1px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.shop-badge {
  font-size: 13px; font-weight: 700; color: #7c3aed;
  flex-shrink: 0; min-width: 18px; text-align: right;
}
/* Synergy upgrade highlight */
.shop-btn.synergy {
  border-color: #c4b5fd;
  background: linear-gradient(135deg, #faf5ff 60%, #f3e8ff);
}
.shop-btn.synergy .shop-badge { color: #f59e0b; }

/* ── Shop tabs ── */
#shop-tabs { display: flex; gap: 6px; padding: 8px 0 4px; }
.shop-tab {
  flex: 1; padding: 8px 0; border-radius: 10px; border: 1.5px solid #e9d5ff;
  background: #faf5ff; font-size: 12px; font-weight: 700; color: #9ca3af;
  cursor: pointer; touch-action: manipulation; transition: all 0.15s;
}
.shop-tab.active { background: #7c3aed; border-color: #7c3aed; color: #fff; }

/* ── Gear grid ── */
.gear-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding-bottom: 8px; }
.gear-card {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 12px 8px 10px; border-radius: 14px; border: 1.5px solid #e9d5ff;
  background: linear-gradient(160deg, #faf5ff 60%, #ede9fe);
  cursor: pointer; text-align: center; touch-action: manipulation;
  transition: transform 0.1s, border-color 0.15s;
  position: relative;
}
.gear-card.maxed { border-color: #f59e0b; background: linear-gradient(160deg, #fffbeb 60%, #fef3c7); }
.gear-card:active:not(:disabled) { transform: scale(0.95); }
.gear-card:disabled { opacity: 0.38; cursor: default; }
.gear-icon-lg { font-size: 26px; line-height: 1; margin-bottom: 2px; }
.gear-name { font-size: 11px; font-weight: 700; color: #374151; }
.gear-tier { font-size: 10px; color: #7c3aed; font-weight: 600; margin-top: 1px; }
.gear-bonus { font-size: 10px; color: #059669; font-weight: 600; }
.gear-cost { font-size: 11px; font-weight: 700; color: #7c3aed; margin-top: 4px; }
.gear-cost.maxed-label { color: #f59e0b; }
.gear-stars { font-size: 8px; color: #d1d5db; letter-spacing: 1px; margin-top: 2px; }
.gear-stars .lit { color: #f59e0b; }

/* Shared overlay banner */
.banner {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  font-weight: 700;
  background: rgba(250,245,255,0.94);
  border: 2px solid #c4b5fd;
  border-radius: 14px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.25s;
  white-space: nowrap;
  text-align: center;
}
.banner.show { opacity: 1; }

#levelup-banner {
  top: 50%;
  translate: -50% -50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: clamp(18px, 5vw, 26px);
  color: #7c3aed;
  padding: 10px 22px;
}

/* Offline earnings toast (slides in from top) */
#offline-toast {
  top: 12px;
  font-size: clamp(12px, 3vw, 15px);
  color: #059669;
  border-color: #a7f3d0;
  background: rgba(236,253,245,0.96);
  padding: 8px 18px;
  line-height: 1.4;
  max-width: 90%;
  white-space: normal;
  text-align: center;
}
</style>
</head>
<body>

<div id="canvas-area">
  <a href="../../" id="back">← R&amp;D Lab</a>
  <canvas id="c"></canvas>

  <div id="hud">
    <div id="score-display">0</div>
    <div id="score-sub">cookies</div>
    <div id="level-bar-wrap"><div id="level-bar"></div></div>
    <div id="level-label">LV 1 · Apprentice Baker · 1/click</div>
  </div>

  <button id="btn-cookie">🍪</button>
  <div id="levelup-banner" class="banner">⬆ LEVEL UP!</div>
  <div id="offline-toast"  class="banner"></div>
</div>

<div id="shop">
  <div id="shop-tabs">
    <button class="shop-tab active" id="tab-shop" onclick="switchTab('shop')">🛒 Shop</button>
    <button class="shop-tab" id="tab-gear" onclick="switchTab('gear')">⚔️ Gear</button>
  </div>
  <div id="panel-shop">
    <div id="shop-header">Upgrades &amp; Buildings</div>
    <div class="shop-grid" id="shop-grid"></div>
  </div>
  <div id="panel-gear" style="display:none">
    <div id="shop-header">⚔️ Gear Upgrades</div>
    <div class="gear-grid" id="gear-grid"></div>
  </div>
</div>

<script>
// ─── Canvas setup ───────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W = 0, H = 0, dpr = 1;

function resizeCanvas() {
  const area = document.getElementById('canvas-area');
  dpr = window.devicePixelRatio || 1;
  W = area.clientWidth;
  H = area.clientHeight;
  canvas.width  = W * dpr;
  canvas.height = H * dpr;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ─── State ──────────────────────────────────────────────────────
let cookies     = 0;
let totalEarned = 0;
let clickValue  = 1;
let cps         = 0;
let lastTime    = performance.now();
let prevLevel   = 0;

// ─── Levels ─────────────────────────────────────────────────────
const LEVELS = [
  { min: 0,             name: 'Apprentice Baker',  bonus: 0     },
  { min: 100,           name: 'Cookie Rookie',     bonus: 1     },
  { min: 500,           name: 'Sugar Rush',        bonus: 1     },
  { min: 2500,          name: 'Dough Expert',      bonus: 2     },
  { min: 10000,         name: 'Cookie Master',     bonus: 3     },
  { min: 50000,         name: 'Grand Baker',       bonus: 5     },
  { min: 250000,        name: 'Legendary Chef',    bonus: 10    },
  { min: 1000000,       name: 'Cookie God',        bonus: 20    },
  { min: 5000000,       name: 'Cookie Titan',      bonus: 40    },
  { min: 25000000,      name: 'Cookie Overlord',   bonus: 80    },
  { min: 100000000,     name: 'Transcendent',      bonus: 150   },
  { min: 500000000,     name: 'Cookie Eternal',    bonus: 300   },
  { min: 2000000000,    name: 'Omnipotent',        bonus: 600   },
  { min: 10000000000,   name: 'Cookie Infinite',   bonus: 1200  },
  { min: 50000000000,   name: 'Cookie Universe',   bonus: 2500  },
];

function getLevel() {
  let lv = 0;
  for (let i = 0; i < LEVELS.length; i++) {
    if (totalEarned >= LEVELS[i].min) lv = i; else break;
  }
  return lv;
}
function levelProgress() {
  const lv = getLevel();
  if (lv >= LEVELS.length - 1) return 1;
  return (totalEarned - LEVELS[lv].min) / (LEVELS[lv + 1].min - LEVELS[lv].min);
}

// ─── Shop data ──────────────────────────────────────────────────
const BUILDINGS = [
  { icon: '🖱️', name: 'Auto-Cursor',  baseCost: 15,           cps: 0.1,       owned: 0, mult: 1 },
  { icon: '👵', name: 'Grandma',      baseCost: 100,          cps: 0.5,       owned: 0, mult: 1 },
  { icon: '🌾', name: 'Cookie Farm',  baseCost: 800,          cps: 4,         owned: 0, mult: 1 },
  { icon: '⛏️', name: 'Dough Mine',   baseCost: 6000,         cps: 10,        owned: 0, mult: 1 },
  { icon: '🏭', name: 'Factory',      baseCost: 50000,        cps: 40,        owned: 0, mult: 1 },
  { icon: '🧪', name: 'Cookie Lab',   baseCost: 400000,       cps: 200,       owned: 0, mult: 1 },
  { icon: '🌀', name: 'Portal',       baseCost: 10000000,     cps: 1000,      owned: 0, mult: 1 },
  { icon: '⏱️', name: 'Time Machine', baseCost: 250000000,    cps: 6500,      owned: 0, mult: 1 },
  { icon: '⚛️', name: 'Antimatter',   baseCost: 8000000000,   cps: 50000,     owned: 0, mult: 1 },
  { icon: '🔆', name: 'Prism',        baseCost: 200000000000, cps: 400000,    owned: 0, mult: 1 },
];

// One-time click power upgrades
const UPGRADES = [
  { icon: '🧤', name: 'Better Grip',   cost: 50,           bonus: 1,      bought: false },
  { icon: '⚡', name: 'Power Click',   cost: 500,          bonus: 5,      bought: false },
  { icon: '💥', name: 'Hyper Click',   cost: 5000,         bonus: 20,     bought: false },
  { icon: '🌀', name: 'Turbo Click',   cost: 50000,        bonus: 100,    bought: false },
  { icon: '🚀', name: 'Mega Click',    cost: 500000,       bonus: 500,    bought: false },
  { icon: '🌟', name: 'Ultra Click',   cost: 5000000,      bonus: 2000,   bought: false },
  { icon: '✨', name: 'Godly Click',   cost: 50000000,     bonus: 10000,  bought: false },
  { icon: '🌌', name: 'Cosmic Click',  cost: 500000000,    bonus: 50000,  bought: false },
];

// Building synergy upgrades (appear when you own enough of a building)
const BUPGRADES = [
  { icon: '🖱️', name: 'Cursor Swarm',     cost: 2000,          desc: 'Cursors ×2',       idx: 0, need: 10, mult: 2, bought: false },
  { icon: '📋', name: "Grandma's Recipe",  cost: 10000,         desc: 'Grandmas ×2',      idx: 1, need: 10, mult: 2, bought: false },
  { icon: '🌿', name: 'Irrigation',        cost: 100000,        desc: 'Farms ×2',         idx: 2, need: 10, mult: 2, bought: false },
  { icon: '💎', name: 'Diamond Drill',     cost: 1000000,       desc: 'Mines ×2',         idx: 3, need: 10, mult: 2, bought: false },
  { icon: '🤖', name: 'Production AI',     cost: 10000000,      desc: 'Factories ×2',     idx: 4, need: 10, mult: 2, bought: false },
  { icon: '🔬', name: 'Dark Matter',       cost: 100000000,     desc: 'Labs ×2',          idx: 5, need: 10, mult: 2, bought: false },
  { icon: '🌀', name: 'Void Anchor',       cost: 2000000000,    desc: 'Portals ×2',       idx: 6, need: 10, mult: 2, bought: false },
  { icon: '⏰', name: 'Temporal Flux',     cost: 50000000000,   desc: 'Time Mach. ×2',    idx: 7, need: 10, mult: 2, bought: false },
  { icon: '☢️', name: 'Cosmic Rays',       cost: 2000000000000, desc: 'Antimatter ×2',    idx: 8, need: 10, mult: 2, bought: false },
  { icon: '🌈', name: 'Rainbow Spectrum',  cost: 50000000000000,desc: 'Prisms ×2',        idx: 9, need: 10, mult: 2, bought: false },
  // Tier 2 (25 owned)
  { icon: '💫', name: 'Grandma Army',      cost: 500000,        desc: 'Grandmas ×3',      idx: 1, need: 25, mult: 3, bought: false },
  { icon: '🚜', name: 'Mega Farm',         cost: 5000000,       desc: 'Farms ×3',         idx: 2, need: 25, mult: 3, bought: false },
  { icon: '🏔️', name: 'Mountain Mine',    cost: 50000000,      desc: 'Mines ×3',         idx: 3, need: 25, mult: 3, bought: false },
  { icon: '🏗️', name: 'Mega Factory',     cost: 500000000,     desc: 'Factories ×3',     idx: 4, need: 25, mult: 3, bought: false },
  { icon: '🧬', name: 'Quantum Theory',    cost: 5000000000,    desc: 'Labs ×3',          idx: 5, need: 25, mult: 3, bought: false },
];

// ─── Gear ───────────────────────────────────────────────────────
// Each gear piece has 5 upgrade tiers. mults[i] = total multiplier at level i+1.
const GEAR = [
  {
    icons: ['🧤','⚡','💪','🌟','🔱'],
    name: 'Power Mitt',
    desc: 'click ×',
    mults: [2, 4, 8, 16, 32],
    costs: [200, 2000, 20000, 200000, 2000000],
    level: 0,
    type: 'click',
  },
  {
    icons: ['👨‍🍳','🥼','🛡️','✨','🌌'],
    name: "Chef's Apron",
    desc: 'CPS ×',
    mults: [2, 4, 8, 16, 32],
    costs: [500, 5000, 50000, 500000, 5000000],
    level: 0,
    type: 'cps',
  },
  {
    icons: ['🎩','👑','💎','🌠','🌌'],
    name: "Baker's Hat",
    desc: 'all ×',
    mults: [1.5, 3, 6, 12, 25],
    costs: [1000, 10000, 100000, 1000000, 10000000],
    level: 0,
    type: 'both',
  },
  {
    icons: ['🔥','💥','⚡','☢️','🌀'],
    name: 'Power Oven',
    desc: 'CPS ×',
    mults: [3, 6, 12, 24, 50],
    costs: [5000, 50000, 500000, 5000000, 50000000],
    level: 0,
    type: 'cps',
  },
];

function gearClickMult() {
  let m = 1;
  for (const g of GEAR) {
    if (g.level > 0 && (g.type === 'click' || g.type === 'both')) m *= g.mults[g.level - 1];
  }
  return m;
}
function gearCpsMult() {
  let m = 1;
  for (const g of GEAR) {
    if (g.level > 0 && (g.type === 'cps' || g.type === 'both')) m *= g.mults[g.level - 1];
  }
  return m;
}

function buildingCost(b) {
  return Math.floor(b.baseCost * Math.pow(1.15, b.owned));
}
function recomputeCps() {
  cps = BUILDINGS.reduce((s, b) => s + b.cps * b.owned * b.mult, 0);
}

// ─── Format numbers ─────────────────────────────────────────────
function fmt(n) {
  n = Math.floor(n);
  if (n >= 1e18) return (n / 1e18).toFixed(1) + 'Qi';
  if (n >= 1e15) return (n / 1e15).toFixed(1) + 'Qa';
  if (n >= 1e12) return (n / 1e12).toFixed(1) + 'T';
  if (n >= 1e9)  return (n / 1e9 ).toFixed(1) + 'B';
  if (n >= 1e6)  return (n / 1e6 ).toFixed(1) + 'M';
  if (n >= 1e3)  return (n / 1e3 ).toFixed(1) + 'K';
  return n.toString();
}

// ─── Save / load ────────────────────────────────────────────────
let offlineBonusPending = 0; // set by loadGame, shown after first loop tick

function saveGame() {
  localStorage.setItem('cookie_lab', JSON.stringify({
    savedAt:    Date.now(),
    cookies, totalEarned, clickValue, prevLevel,
    buildings:  BUILDINGS.map(b => b.owned),
    upgrades:   UPGRADES.map(u => u.bought),
    bupgrades:  BUPGRADES.map(u => u.bought),
    gear:       GEAR.map(g => g.level),
  }));
}

function loadGame() {
  try {
    const raw = localStorage.getItem('cookie_lab');
    if (!raw) return;
    const s = JSON.parse(raw);
    cookies     = s.cookies     || 0;
    totalEarned = s.totalEarned || 0;
    clickValue  = s.clickValue  || 1;
    prevLevel   = s.prevLevel   || 0;
    if (s.buildings) s.buildings.forEach((n, i) => { if (BUILDINGS[i]) BUILDINGS[i].owned = n; });
    if (s.upgrades)  s.upgrades.forEach ((b, i) => { if (UPGRADES[i])  UPGRADES[i].bought = b; });
    if (s.bupgrades) s.bupgrades.forEach((b, i) => {
      if (b && BUPGRADES[i]) {
        BUPGRADES[i].bought = true;
        BUILDINGS[BUPGRADES[i].idx].mult *= BUPGRADES[i].mult;
      }
    });
    if (s.gear) s.gear.forEach((lv, i) => { if (GEAR[i]) GEAR[i].level = lv; });
    recomputeCps();

    // ── Offline earnings ──────────────────────────────────────────
    if (s.savedAt && cps > 0) {
      const elapsed = Math.min((Date.now() - s.savedAt) / 1000, 8 * 3600); // cap 8 h
      if (elapsed >= 5) {
        const bonus = cps * elapsed;
        cookies        += bonus;
        totalEarned    += bonus;
        offlineBonusPending = bonus;
        checkLevelUp();
      }
    }
  } catch (_) {}
}

loadGame();

// Show offline bonus after state is fully ready
if (offlineBonusPending > 0) {
  elOffline.textContent = `Welcome back! 🍪 +${fmt(offlineBonusPending)} cookies baked while you were away.`;
  elOffline.classList.add('show');
  offlineTimer = 5;
}

// Save on page hide/close
window.addEventListener('beforeunload', saveGame);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) saveGame();
});

// ─── Particles & floats ─────────────────────────────────────────
const particles = [];
const floats    = [];

function spawnParticles(x, y, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 1.5 + Math.random() * 3.5;
    particles.push({
      x, y,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2.5,
      r: 2.5 + Math.random() * 3.5,
      life: 1,
      hue: 256 + Math.random() * 50,
    });
  }
}

function spawnFloat(x, y, text, big) {
  floats.push({ x, y, vy: big ? -1.6 : -1.2, text, life: 1, big: !!big });
}

// ─── HUD refs ───────────────────────────────────────────────────
const elScore    = document.getElementById('score-display');
const elSub      = document.getElementById('score-sub');
const elBar      = document.getElementById('level-bar');
const elLvLabel  = document.getElementById('level-label');
const elBanner   = document.getElementById('levelup-banner');
const elOffline  = document.getElementById('offline-toast');

let bannerTimer  = 0;
let offlineTimer = 0;

function updateHud() {
  elScore.textContent = fmt(cookies);
  const effCps = cps * gearCpsMult();
  const cpsStr = effCps >= 0.1 ? ` · ${fmt(effCps)}/s` : '';
  elSub.textContent = `cookies${cpsStr}`;
  elBar.style.width = (levelProgress() * 100).toFixed(1) + '%';
  const lv = getLevel();
  const effClick = Math.floor(clickValue * gearClickMult());
  elLvLabel.textContent =
    `LV ${lv + 1}  ·  ${LEVELS[lv].name}  ·  ${effClick}/click`;
}

// ─── Level up ───────────────────────────────────────────────────
function checkLevelUp() {
  const lv = getLevel();
  if (lv > prevLevel) {
    for (let i = prevLevel + 1; i <= lv; i++) clickValue += LEVELS[i].bonus;
    prevLevel = lv;

    spawnParticles(W / 2, H * 0.55, 35);
    spawnFloat(W / 2, H * 0.36, `LEVEL ${lv + 1} — ${LEVELS[lv].name}`, true);
    elBanner.textContent = `⬆ Level ${lv + 1} — ${LEVELS[lv].name}`;
    elBanner.classList.add('show');
    bannerTimer = 2.2;
  }
}

// ─── Canvas draw ────────────────────────────────────────────────
function drawCanvas() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.13;
    p.life -= 0.033;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.save();
    ctx.globalAlpha = p.life * 0.85;
    ctx.fillStyle = `hsl(${p.hue},80%,65%)`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * (0.3 + p.life * 0.7), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i];
    f.y += f.vy;
    f.life -= f.big ? 0.015 : 0.022;
    if (f.life <= 0) { floats.splice(i, 1); continue; }
    ctx.save();
    ctx.globalAlpha = Math.min(1, f.life * 1.5);
    ctx.fillStyle = f.big ? '#5b21b6' : '#7c3aed';
    ctx.font = `700 ${f.big ? 17 : 15}px -apple-system,BlinkMacSystemFont,sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(f.text, f.x, f.y);
    ctx.restore();
  }
}

// ─── Cookie click ───────────────────────────────────────────────
const btnCookie = document.getElementById('btn-cookie');
const canvasArea = document.getElementById('canvas-area');

function activateCookie(clientX, clientY) {
  const cv = Math.floor(clickValue * gearClickMult());
  cookies     += cv;
  totalEarned += cv;
  checkLevelUp();

  btnCookie.style.transform = 'scale(0.82)';
  setTimeout(() => { btnCookie.style.transform = ''; }, 110);

  const rect = canvasArea.getBoundingClientRect();
  const px = clientX - rect.left;
  const py = clientY - rect.top;
  spawnParticles(px, py, 9);
  spawnFloat(px, py - 24, `+${fmt(cv)}`, false);
}

btnCookie.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  activateCookie(t.clientX, t.clientY);
}, { passive: false });

btnCookie.addEventListener('mousedown', e => {
  activateCookie(e.clientX, e.clientY);
});

// ─── Shop ───────────────────────────────────────────────────────
const shopGrid = document.getElementById('shop-grid');

function makeBtn(icon, name, costNum, desc, badge, onBuy) {
  const btn = document.createElement('button');
  btn.className = 'shop-btn' + (badge === '★' ? ' synergy' : '');
  btn.disabled  = cookies < costNum;
  btn.innerHTML =
    `<span class="shop-icon">${icon}</span>
     <div class="shop-info">
       <div class="shop-name">${name}</div>
       <div class="shop-cost">🍪 ${fmt(costNum)}</div>
       <div class="shop-desc">${desc}</div>
     </div>
     ${badge ? `<span class="shop-badge">${badge}</span>` : ''}`;
  btn.addEventListener('touchstart', e => {
    e.stopPropagation(); e.preventDefault();
    if (cookies < costNum) return;
    onBuy();
  }, { passive: false });
  btn.addEventListener('click', () => {
    if (cookies < costNum) return;
    onBuy();
  });
  return btn;
}

function buildShop() {
  shopGrid.innerHTML = '';

  // Building synergy upgrades — only show when unlock threshold met
  for (const u of BUPGRADES) {
    if (u.bought) continue;
    if (BUILDINGS[u.idx].owned < u.need) continue;
    shopGrid.appendChild(makeBtn(u.icon, u.name, u.cost, u.desc, '★', () => {
      cookies -= u.cost;
      u.bought = true;
      BUILDINGS[u.idx].mult *= u.mult;
      recomputeCps();
      saveGame(); buildShop();
    }));
  }

  // Click power upgrades
  for (const u of UPGRADES) {
    if (u.bought) continue;
    shopGrid.appendChild(makeBtn(u.icon, u.name, u.cost, `+${fmt(u.bonus)}/click`, null, () => {
      cookies -= u.cost;
      u.bought = true;
      clickValue += u.bonus;
      saveGame(); buildShop();
    }));
  }

  // Buildings (repeatable)
  for (const b of BUILDINGS) {
    const cost = buildingCost(b);
    const cpsEach = (b.cps * b.mult).toFixed(b.cps * b.mult < 1 ? 2 : 1);
    shopGrid.appendChild(makeBtn(b.icon, b.name, cost, `${cpsEach}/s each`,
      b.owned > 0 ? b.owned : null, () => {
        cookies -= cost;
        b.owned++;
        recomputeCps();
        saveGame(); buildShop();
      }));
  }
}

buildShop();

// ─── Gear UI ─────────────────────────────────────────────────────
function buildGear() {
  const grid = document.getElementById('gear-grid');
  grid.innerHTML = '';
  for (let i = 0; i < GEAR.length; i++) {
    const g = GEAR[i];
    const maxed = g.level >= 5;
    const cost  = maxed ? 0 : g.costs[g.level];
    const canBuy = !maxed && cookies >= cost;
    const currentIcon = g.level === 0 ? '📦' : g.icons[g.level - 1];
    const nextIcon    = maxed ? '✅' : g.icons[g.level];
    const bonusText   = g.level === 0
      ? 'No bonus yet'
      : `${g.desc}${g.mults[g.level - 1]}`;
    const stars = Array.from({length: 5}, (_, k) =>
      `<span class="${k < g.level ? 'lit' : ''}">★</span>`).join('');

    const card = document.createElement('button');
    card.className = 'gear-card' + (maxed ? ' maxed' : '');
    card.disabled = !canBuy && !maxed;
    card.innerHTML = `
      <div class="gear-icon-lg">${currentIcon}</div>
      <div class="gear-name">${g.name}</div>
      <div class="gear-stars">${stars}</div>
      <div class="gear-bonus">${bonusText}</div>
      ${maxed
        ? `<div class="gear-cost maxed-label">MAX</div>`
        : `<div class="gear-cost">🍪 ${fmt(cost)}</div>
           <div style="font-size:9px;color:#9ca3af;margin-top:1px;">→ ${nextIcon} ${g.desc}${g.mults[g.level]}</div>`
      }
    `;
    if (!maxed) {
      card.addEventListener('touchstart', e => {
        e.preventDefault();
        if (cookies < cost) return;
        cookies -= cost;
        g.level++;
        saveGame(); buildGear(); buildShop();
        spawnParticles(W / 2, H * 0.55, 20);
        spawnFloat(W / 2, H * 0.4, `⚔️ ${g.name} upgraded!`, true);
      }, { passive: false });
      card.addEventListener('click', () => {
        if (cookies < cost) return;
        cookies -= cost;
        g.level++;
        saveGame(); buildGear(); buildShop();
        spawnParticles(W / 2, H * 0.55, 20);
        spawnFloat(W / 2, H * 0.4, `⚔️ ${g.name} upgraded!`, true);
      });
    }
    grid.appendChild(card);
  }
}

function switchTab(tab) {
  document.getElementById('panel-shop').style.display = tab === 'shop' ? '' : 'none';
  document.getElementById('panel-gear').style.display = tab === 'gear' ? '' : 'none';
  document.getElementById('tab-shop').classList.toggle('active', tab === 'shop');
  document.getElementById('tab-gear').classList.toggle('active', tab === 'gear');
}

buildGear();

// ─── Game loop ───────────────────────────────────────────────────
let shopTimer = 0;
let saveTimer = 5;

function loop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;

  if (cps > 0) {
    const gain = cps * gearCpsMult() * dt;
    cookies     += gain;
    totalEarned += gain;
    checkLevelUp();
  }

  if (bannerTimer > 0) {
    bannerTimer -= dt;
    if (bannerTimer <= 0) elBanner.classList.remove('show');
  }
  if (offlineTimer > 0) {
    offlineTimer -= dt;
    if (offlineTimer <= 0) elOffline.classList.remove('show');
  }

  updateHud();
  drawCanvas();

  shopTimer -= dt;
  if (shopTimer <= 0) { buildShop(); shopTimer = 0.5; }

  saveTimer -= dt;
  if (saveTimer <= 0) { saveGame(); saveTimer = 5; }

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
