html, body { height: 100%; overflow: hidden; }
body {
  display: flex;
  flex-direction: column;
  background: #fdf4ff;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  user-select: none;
  -webkit-user-select: none;
}

#canvas-area {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 44px 12px 8px;
  position: relative;
  min-height: 0;
}
canvas {
  display: block;
  max-width: 100%;
  max-height: 100%;
  border-radius: 20px;
  box-shadow: 0 4px 24px rgba(168,85,247,0.15);
}
#back {
  position: absolute;
  top: 12px; left: 16px;
  font-size: 13px; color: #c084fc;
  text-decoration: none; z-index: 10;
}
#back:hover { color: #a855f7; }

#controls {
  display: none;
  flex-direction: column;
  padding: 10px 14px max(20px, env(safe-area-inset-bottom));
  gap: 8px;
  flex-shrink: 0;
}
@media (pointer: coarse) { #controls { display: flex; height: 46vh; } }

.btn {
  flex: 1; border: none; border-radius: 18px;
  font-size: 20px; font-weight: 700; letter-spacing: 0.02em;
  cursor: pointer; touch-action: none;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  color: #fff; transition: transform 0.08s, opacity 0.08s;
}
.btn:active { opacity: 0.82; transform: scale(0.97); }

#btn-start, #btn-restart {
  background: linear-gradient(135deg, #a855f7, #ec4899);
  font-size: 22px;
  box-shadow: 0 4px 0 #7c3aed;
}
#btn-start:active, #btn-restart:active {
  transform: translateY(3px) scale(0.97);
  box-shadow: 0 1px 0 #7c3aed;
}

#choice-area {
  display: none;
  flex-direction: column;
  gap: 8px;
  flex: 1;
}

.choice-btn {
  flex: 1; border: 3px solid transparent; border-radius: 16px;
  background: #fff;
  font-size: 18px; font-weight: 600;
  cursor: pointer; touch-action: none;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  color: #3b0764; transition: transform 0.06s, border-color 0.1s, background 0.1s;
  padding: 0 14px;
  box-shadow: 0 2px 8px rgba(168,85,247,0.1);
}
.choice-btn:active { transform: scale(0.97); }
.choice-btn.correct  { background: #dcfce7; border-color: #16a34a; color: #14532d; }
.choice-btn.partial  { background: #fef9c3; border-color: #ca8a04; color: #713f12; }
.choice-btn.wrong    { background: #fee2e2; border-color: #dc2626; color: #7f1d1d; }

.hidden { display: none !important; }
@media (pointer: fine) { body { cursor: pointer; } }
</style>

// ── Particle system ──
let particles = [];
function spawnConfetti(x, y, count = 10) {
  const colors = ['#a855f7','#ec4899','#f59e0b','#10b981','#3b82f6','#f43f5e'];
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 6,
      vy: -Math.random() * 7 - 2,
      color: colors[Math.floor(Math.random() * colors.length)],
      size: Math.random() * 7 + 4,
      life: 1,
      rot: Math.random() * Math.PI * 2,
      rspeed: (Math.random() - 0.5) * 0.3,
    });
  }
}

function updateParticles() {
  particles = particles.filter(p => p.life > 0);
  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.35;
    p.life -= 0.022;
    p.rot += p.rspeed;
  }
}
function drawParticles() {
  for (const p of particles) {
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
    ctx.restore();
  }
}

// ── Draw helpers ──
function rndf(min, max) { return min + Math.random() * (max - min); }

function drawBg(q) {
  const bg = q ? q.bg : '#7c3aed';
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // subtle pattern dots
  ctx.globalAlpha = 0.07;
  ctx.fillStyle = '#fff';
  for (let r = 0; r < H; r += 40) {
    for (let c = 0; c < W; c += 40) {
      ctx.beginPath();
      ctx.arc(c + 20, r + 20, 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

    ctx.fillStyle = 'rgba(255,255,255,0.9)';

    roundRect(ctx, btn.x, btn.y, btn.w, btn.h, 12);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillText('👗 START', W / 2, btn.y + btn.h / 2);
  }
}

function drawPlayScreen() {
  if (!currentQ) return;
  drawBg(currentQ);

  // Theme label
  ctx.font = 'bold 22px -apple-system, sans-serif';
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(currentQ.t, W / 2, 50);

  // Timer bar
  const barW = W - 60;
  const barX = 30;
  const barY = 82;
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  roundRect(ctx, barX, barY, barW, 10, 5);
  ctx.fill();
  const pct = timeLeft / 60;
  const barColor = pct > 0.5 ? '#4ade80' : pct > 0.25 ? '#facc15' : '#f87171';
  ctx.fillStyle = barColor;
  roundRect(ctx, barX, barY, barW * pct, 10, 5);
  ctx.fill();

  // Timer number
  ctx.font = 'bold 15px -apple-system, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fillText(`${timeLeft}s`, W / 2, 107);

  // Score
  ctx.font = 'bold 13px -apple-system, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.textAlign = 'right';
  ctx.fillText(`${score} pts`, W - 20, 107);
  ctx.textAlign = 'center';

  // Question
  ctx.font = 'bold 20px -apple-system, sans-serif';
  ctx.fillStyle = '#fff';
  const words = currentQ.q.split(' ');
  let line = '', lines = [];
  for (const w of words) {
    const test = line + (line ? ' ' : '') + w;
    if (ctx.measureText(test).width > W - 60 && line) { lines.push(line); line = w; }
    else line = test;
  }
  lines.push(line);
  const qY = 160;
  lines.forEach((l, i) => ctx.fillText(l, W / 2, qY + i * 28));

  // Character figure
  ctx.font = '88px serif';
  ctx.fillText('👗', W / 2, 310);

  // Q count
  ctx.font = '13px -apple-system, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillText(`Q ${questionCount}`, W / 2, 410);

  // Desktop choice buttons
  if (!isTouch) {
    const choices = shuffled;
    const bh = 52, gap = 10;
    const totalH = choices.length * bh + (choices.length - 1) * gap;
    const startY = H - totalH - 14;
    choices.forEach((ch, i) => {
      const y = startY + i * (bh + gap);
      const col = ch._result === 'correct' ? '#bbf7d0' :
                  ch._result === 'partial'  ? '#fef08a' :
                  ch._result === 'wrong'    ? '#fecaca' : 'rgba(255,255,255,0.92)';
      ctx.fillStyle = col;
      roundRect(ctx, 24, y, W - 48, bh, 12);
      ctx.fill();
      ctx.font = 'bold 17px -apple-system, sans-serif';
      ctx.fillStyle = '#1e0936';
      ctx.textAlign = 'center';
      ctx.fillText(`${ch.e}  ${ch.n}`, W / 2, y + bh / 2);
    });
  }

  drawParticles();
}

function drawGameover() {
  ctx.fillStyle = '#1e0936';

  ctx.font = '26px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('✨👗✨', W / 2, 90);

  ctx.font = 'bold 30px -apple-system, sans-serif';
  ctx.fillStyle = '#e9d5ff';
  ctx.fillText("Time's Up!", W / 2, 145);

  ctx.font = 'bold 52px -apple-system, sans-serif';
  ctx.fillStyle = '#c084fc';
  ctx.fillText(`${score}`, W / 2, 215);

  ctx.font = '17px -apple-system, sans-serif';
  ctx.fillStyle = 'rgba(233,213,255,0.7)';
  ctx.fillText('pts', W / 2, 250);

  if (score >= bestScore && score > 0) {
    ctx.font = 'bold 18px -apple-system, sans-serif';
    ctx.fillStyle = '#fde68a';
    ctx.fillText('🏆 New Best!', W / 2, 290);
  } else if (bestScore > 0) {
    ctx.font = '15px -apple-system, sans-serif';
    ctx.fillStyle = 'rgba(233,213,255,0.5)';
    ctx.fillText(`Best: ${bestScore} pts`, W / 2, 290);
  }

  const grade = score >= 500 ? '👑 Fashion Icon' :
                score >= 350 ? '💅 Style Star' :
                score >= 200 ? '✨ Trend Setter' :
                score >= 100 ? '👗 Getting There' : '🧺 Try Again';
  ctx.font = 'bold 22px -apple-system, sans-serif';
  ctx.fillStyle = '#f0abfc';
  ctx.fillText(grade, W / 2, 340);

  if (!isTouch) {
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    roundRect(ctx, W/2 - 90, 400, 180, 44, 12);
    ctx.fill();
    ctx.font = 'bold 16px -apple-system, sans-serif';
    ctx.fillStyle = '#fff';
    ctx.fillText('↺ PLAY AGAIN', W / 2, 422);
  }

  drawParticles();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

// ── Game logic ──
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickQuestion() {
  const eligible = POOL.filter(q => q.t !== lastTheme);
  const pool = eligible.length ? eligible : POOL;
  const q = pool[Math.floor(Math.random() * pool.length)];
  lastTheme = q.t;
  return q;
}

function nextQuestion() {
  answered = false;
  currentQ = pickQuestion();
  questionCount++;
  shuffled = shuffle(currentQ.c.map(c => ({ ...c, _result: null })));
  updateChoiceButtons();
}

function updateChoiceButtons() {
  const btns = document.querySelectorAll('.choice-btn');
  btns.forEach((btn, i) => {
    const ch = shuffled[i];
    btn.textContent = '';
    btn.className = 'choice-btn';
    const span = document.createElement('span');
    span.style.fontSize = '26px';
    span.textContent = ch.e;
    const label = document.createElement('span');
    label.style.fontSize = '17px';
    label.textContent = ch.n;
    btn.appendChild(span);
    btn.appendChild(label);
  });
}

function applyResultColors() {
  const btns = document.querySelectorAll('.choice-btn');
  btns.forEach((btn, i) => {
    const ch = shuffled[i];
    btn.classList.remove('correct', 'partial', 'wrong');
    if (ch._result) btn.classList.add(ch._result);
  });
}

function startGame() {
  score = 0;
  questionCount = 0;
  timeLeft = 60;
  particles = [];
  lastTheme = '';
  state = 'playing';

  document.getElementById('btn-start').classList.add('hidden');
  document.getElementById('btn-restart').classList.add('hidden');
  document.getElementById('choice-area').style.display = 'flex';

  nextQuestion();
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timeLeft--;
    if (timeLeft <= 0) {
      timeLeft = 0;
      endGame();
    }
  }, 1000);
}

function endGame() {
  clearInterval(timerInterval);
  clearTimeout(resultTimer);
  state = 'gameover';
  if (score > bestScore) {
    bestScore = score;
    localStorage.setItem('dti_best', bestScore);
  }
  document.getElementById('choice-area').style.display = 'none';
  document.getElementById('btn-restart').classList.remove('hidden');
  spawnConfetti(W / 2, 200, 30);
}

function handleChoice(i) {
  if (answered || state !== 'playing') return;
  answered = true;

  const ch = shuffled[i];
  score += ch.p;

  shuffled.forEach((c, j) => {
    c._result = c.p === 60 ? 'correct' : c.p === 35 ? 'partial' : 'wrong';
  });
  shuffled[i]._result = ch.p === 60 ? 'correct' : ch.p === 35 ? 'partial' : 'wrong';

  if (ch.p === 60) spawnConfetti(W / 2, 280, 18);

  applyResultColors();

  resultTimer = setTimeout(() => {
    if (state === 'playing') {
      nextQuestion();
      const btns = document.querySelectorAll('.choice-btn');
      btns.forEach(b => b.classList.remove('correct','partial','wrong'));
    }
  }, 900);
}

// ── Desktop click on canvas ──
canvas.addEventListener('click', e => {
  if (isTouch) return;
  const rect = canvas.getBoundingClientRect();
  const sx = W / rect.width;
  const sy = H / rect.height;
  const x = (e.clientX - rect.left) * sx;
  const y = (e.clientY - rect.top) * sy;

  if (state === 'idle') { startGame(); return; }
  if (state === 'gameover') { startGame(); return; }
  if (state === 'playing' && !answered) {
    const choices = shuffled;
    const bh = 52, gap = 10;
    const totalH = choices.length * bh + (choices.length - 1) * gap;
    const startY = H - totalH - 14;
    choices.forEach((ch, i) => {
      const by = startY + i * (bh + gap);
      if (x >= 24 && x <= W - 24 && y >= by && y <= by + bh) {
        handleChoice(i);
      }
    });
  }
});

// ── Touch controls ──
document.getElementById('btn-start').addEventListener('click', startGame);
document.getElementById('btn-restart').addEventListener('click', startGame);
document.querySelectorAll('.choice-btn').forEach(btn => {
  btn.addEventListener('click', () => handleChoice(+btn.dataset.i));
});

// ── Render loop ──
function draw() {
  ctx.clearRect(0, 0, W, H);
  updateParticles();

  if (state === 'idle')     drawIdleScreen();
  else if (state === 'playing') drawPlayScreen();
  else if (state === 'gameover') drawGameover();

  requestAnimationFrame(draw);
}

// ── Canvas scale ──
function fitCanvas() {
  const area = document.getElementById('canvas-area');
  const aw = area.clientWidth - 24;
  const ah = area.clientHeight - 52;
  const scale = Math.min(aw / W, ah / H);
  canvas.style.width  = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
}
window.addEventListener('resize', fitCanvas);
fitCanvas();

draw();
</script>
